{title:`ข้อ 1`,
stem:[
`ภาคภูมิและพลอยจดทะเบียนสมรสกัน และมีบุตรด้วยกัน 2 คน คือมาลาและบุษบง มาลาจดทะเบียนสมรสกับพร้อมและมีบุตรด้วยกัน 2 คน คือ ภูและลัลล์ แต่ภายหลังมาลาและพร้อมมีปากเสียงและมีปัญหากันจนต้องเลิกรากันในที่สุด เหตุการณ์ดังกล่าวทำให้พลอยซึ่งเป็นมารดาของมาลาเสียใจเป็นอย่างมากจนตรอมใจเสียชีวิต ภายหลังจากนั้น มาลาได้จดทะเบียนหย่ากับพร้อม ต่อมาได้ไปชมละครเวทีจึงบังเอิญเจอสร้อยและตกหลุมรักกัน จากนั้นมาลาได้อยู่กินกับสร้อยและจดทะเบียนสมรสกัน แต่ทั้งสองไม่มีบุตรด้วยกัน สร้อยจึงจดทะเบียนรับภีมเป็นบุตรบุญธรรม โดยได้รับความยินยอมจากมาลาเรียบร้อยแล้ว`,
`ต่อมา ภีมและบุหลันอยู่กินกันฉันคู่สมรสและมีบุตรด้วยกันเพียงคนเดียว คือ ป่าน โดยภีมได้จดทะเบียนรับรองป่านเป็นบุตรโดยชอบด้วยกฎหมายแล้ว ส่วนลัลล์ได้พบรักกับไวน์ ทั้งสองจึงจดทะเบียนสมรสกันและจัดงานแต่งงานริมทะเล ระหว่างที่ภีมกำลังขับรถเพื่อไปร่วมงานแต่งงานของลัลล์และไวน์ ภีมประสบอุบัติเหตุและเสียชีวิตลง ในเวลาต่อมาลัลล์และไวน์ตกลงกันรับม่อนเป็นบุตรบุญธรรมของทั้งสองและได้จดทะเบียนรับบุตรบุญธรรมเรียบร้อยแล้ว แต่แล้วลัลล์กลับเสียชีวิตเนื่องจากภาวะหัวใจล้มเหลว เมื่อมาลาทราบข่าวการเสียชีวิตของบุตรสาว คือ ลัลล์ มาลาเสียใจเป็นอย่างมากจนตรอมใจและเสียชีวิตในเวลาต่อมา ขณะที่มาลาเสียชีวิต มาลามีสินส่วนตัวซึ่งรวมกับทรัพย์สินที่แบ่งจากสินสมรสแล้ว หลังจากแบ่งสินสมรสแล้ว รวมเป็นเงินทั้งสิ้น 24,000,000 บาท และมาลาไม่ได้ทำพินัยกรรมไว้`],
ask:`ดังนั้น จงพิจารณาว่า ทรัพย์มรดกของมาลาจำนวน 24,000,000 บาท จะตกทอดแก่บุคคลใดบ้าง และแต่ละคนมีสิทธิได้รับมรดกเป็นจำนวนเท่าใด`,
model:[
{list:[
`<b>ภาคภูมิ</b> เป็นบิดาโดยชอบด้วยกฎหมายของมาลาเจ้ามรดก จึงมีฐานะเป็นทายาท ตามมาตรา 1629(2)`,
`<b>พลอย</b> เป็นมารดาโดยชอบด้วยกฎหมายของมาลาเจ้ามรดก จึงมีฐานะเป็นทายาท ตามมาตรา 1629(2) แต่พลอยไม่สามารถรับมรดกได้ เพราะไม่มีสภาพบุคคลอยู่ในเวลาที่เจ้ามรดกตาย ตามมาตรา 1604`,
`<b>พร้อม</b> จดทะเบียนหย่ากับมาลาแล้ว จึงไม่ใช่คู่สมรสของมาลา ย่อมไม่มีฐานะเป็นทายาท ตามมาตรา 1629 วรรคสอง`,

`<b>ลัลล์</b> เป็นบุตรโดยชอบด้วยกฎหมายของมาลาเจ้ามรดก จึงมีฐานะเป็นทายาท ตามมาตรา 1629(1) แต่ลัลล์ไม่สามารถรับมรดกได้ เพราะไม่มีสภาพบุคคลอยู่ในเวลาที่เจ้ามรดกตาย ตามมาตรา 1604 แม้ลัลล์และไวน์จดทะเบียนรับม่อนเป็นบุตรบุญธรรม ม่อนก็ไม่อาจรับมรดกแทนที่ได้เพราะไม่ใช่ผู้สืบสันดานโดยตรง ตามมาตรา 1643`,
`<b>สร้อย</b> เป็นคู่สมรสโดยชอบด้วยกฎหมาย เนื่องจากได้จดทะเบียนสมรสแล้ว จึงมีฐานะเป็นทายาท ตามมาตรา 1629 วรรคสอง`,
`<b>ภีม</b> เป็นบุตรบุญธรรมของสร้อย มาลาซึ่งเป็นเจ้ามรดกยินยอมด้วย ภีมย่อมเป็นบุตรโดยชอบด้วยกฎหมายของสร้อยเท่านั้น มิใช่เป็นบุตรโดยชอบด้วยกฎหมายของมาลา จึงไม่มีฐานะเป็นทายาท ตามมาตรา 1629(1) ประกอบมาตรา 1627 แม้ภีมจะไม่มีสภาพบุคคลขณะเจ้ามรดกตาย และมีป่านเป็นบุตรโดยชอบด้วยกฎหมายเนื่องจากจดทะเบียนรับรองบุตรแล้ว ป่านก็ไม่อาจรับมรดกแทนที่ภีมได้`,
`<b>บุษบง</b> พี่น้องร่วมบิดามารดากับมาลาเจ้ามรดก จึงมีฐานะเป็นทายาท ตามมาตรา 1629(3) อย่างไรก็ตาม มาลาเจ้ามรดกมีทายาทที่มีลำดับสูงกว่าบุษบง กล่าวคือ มีทายาทลำดับ 1 และ 2 บุษบงจึงไม่มีสิทธิรับมรดกของมาลาได้ ตามมาตรา 1630`]},
{sum:`<b>สรุป</b> ต้องแบ่งมรดกให้คู่สมรส บิดา และบุตร ตามมาตรา 1635(1) ประกอบ 1630 วรรคสอง กล่าวคือ ทั้งสามคนมีสิทธิได้รับมรดกเสมือนว่าเป็นทายาทชั้นบุตร ดังนั้น สร้อย ภาคภูมิ และภู มีสิทธิรับมรดกของมาลาคนละเท่า ๆ กัน คือ <b>คนละ 8,000,000 บาท</b>`}

{title:`ข้อ 2`,
stem:[
`นายเอโกรธแค้นนายบี ซึ่งเป็นบิดาแท้ ๆ ของตน นายเอจึงโพสต์ข้อความลงในกลุ่มโซเชียลมีเดียที่มีสมาชิกหลักหมื่นคนว่า "ผู้ใดสามารถไปรุมทำร้ายนายบีจนบาดเจ็บสาหัสได้ จะมอบเงินรางวัลให้ 100,000 บาท" ต่อมานายดี ซึ่งเป็นเพื่อนสนิทของนายเอ อ่านเจอข้อความดังกล่าวจึงอยากช่วยเพื่อน นายดีจึงชวนนายเอร่วมกันเดินทางไปที่บ้านของนายบี เมื่อไปถึงนายดีและนายเอได้ช่วยกันใช้ไม้รุมตีนายบีอย่างรุนแรงจนนายบีล้มลงสลบไป นายเอหยุดทำร้ายแล้วบอกกับนายดีว่า "เอาให้ตายไปเลย" นายดีจึงมีความคิดที่จะฆ่านายบีและได้เงื้อไม้ขึ้นเหนือศีรษะ ก่อนจะเหวี่ยงไม้ลงไปเพื่อฟาดศีรษะของนายบีซึ่งนอนสลบอยู่ แต่ขณะที่ไม้กำลังจะถูกศีรษะของนายบี นายเอเกิดเกรงกลัวความผิดและรู้สึกผิดต่อบิดา จึงเข้าห้ามปรามและฉุดดึงแขนของนายดีไว้จนไม้ไม่ถูกนายบี นายดียอมหยุดและทั้งสองพากันหลบหนีไป ผลปรากฏว่านายบีได้รับบาดเจ็บกระดูกแขนแตกและตาบอดหนึ่งข้างจากการถูกทำร้าย แต่ไม่ถึงแก่ความตาย`],
ask:`จงวินิจฉัยความรับผิดทางอาญาของนายเอและนายดี`,
model:[
{h:`ความรับผิดของนายเอจากการโฆษณาหรือประกาศให้ผู้อื่นกระทำความผิด`,
 p:[`การที่นายเอโพสต์ข้อความลงในกลุ่มโซเชียลมีเดียซึ่งมีสมาชิกหลักหมื่นคน โดยเสนอเงินรางวัล 100,000 บาท แก่ผู้ที่รุมทำร้ายนายบีจนได้รับอันตรายสาหัส เป็นการโฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิดตามประมวลกฎหมายอาญา มาตรา 85 วรรคหนึ่ง เนื่องจากเป็นการโฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิดฐานทำร้ายร่างกายจนเป็นเหตุให้ได้รับอันตรายสาหัส ตามมาตรา 297 และเมื่อความผิดที่นายเอได้โฆษณาหรือประกาศไว้ได้เกิดขึ้น นายเอจึงต้องรับโทษเสมือนเป็นตัวการในความผิดดังกล่าว ตามมาตรา 297 ประกอบมาตรา 85 วรรคสอง`,

{h:`ความผิดฐานทำร้ายร่างกายจนเป็นเหตุให้ได้รับอันตรายสาหัส`,
 p:[`การที่นายเอและนายดีร่วมกันใช้ไม้รุมทำร้ายนายบีจนตาบอดหนึ่งข้าง ถือเป็นอันตรายสาหัสตามมาตรา 297 (1) อีกทั้งการที่ทั้งสองตกลงและเดินทางไปทำร้ายนายบีตามแผนที่คิดไว้ก่อนแล้ว แสดงถึงการไตร่ตรองไว้ก่อน มิใช่การทำร้ายที่เกิดขึ้นโดยปัจจุบันทันด่วน จึงเป็นความผิดฐานร่วมกันทำร้ายผู้อื่นจนได้รับอันตรายสาหัสโดยไตร่ตรองไว้ก่อน ตามมาตรา 298 ประกอบมาตรา 289 (4) และมาตรา 83`,

{h:`ความผิดฐานพยายามฆ่าของนายดี และความรับผิดของนายเอในฐานะผู้ใช้`,
 p:[`ภายหลังจากนายบีถูกทำร้ายจนสลบ นายเอบอกนายดีว่า "เอาให้ตายไปเลย" เป็นการก่อให้นายดีเกิดเจตนาฆ่านายบี จึงทำให้นายเอเป็นผู้ใช้ให้กระทำความผิดตามมาตรา 84 เมื่อนายดีเกิดเจตนาฆ่าและเงื้อไม้ขึ้นเหนือศีรษะ ก่อนเหวี่ยงไม้ลงไปเพื่อฟาดศีรษะนายบีซึ่งนอนสลบอยู่ ย่อมถือว่าได้เริ่มลงมือกระทำความผิดฐานฆ่าผู้อื่นแล้ว แต่การกระทำไม่บรรลุผลเพราะนายเอเข้าขัดขวางและฉุดดึงแขนนายดีไว้ นายดีจึงมีความผิดฐานพยายามฆ่าผู้อื่นตามมาตรา 288 ประกอบมาตรา 80 และไม่อาจอ้างมาตรา 82 ได้ เพราะไม่ได้ยับยั้งการกระทำหรือกลับใจแก้ไขด้วยตนเอง แต่ความผิดฐานฆ่าบุพการีตามมาตรา 289 (1) ไม่อาจนำมาใช้เพิ่มโทษโดยอาศัยความสัมพันธ์ระหว่างนายเอกับนายบีได้ เนื่องจากเป็นเหตุส่วนตัวตามมาตรา 89 ดังนั้นนายดีจึงรับผิดฐานพยายามฆ่าผู้อื่นตามมาตรา 288 ประกอบมาตรา 80`,
 `ส่วนนายเอเมื่อเป็นผู้ใช้ให้นายดีกระทำความผิดฐานฆ่าและได้เข้าขัดขวางจนการกระทำไม่บรรลุผล ต้องพิจารณามาตรา 88 ซึ่งบัญญัติให้ผู้ใช้ที่เข้าขัดขวางดังกล่าวคงรับผิดตามมาตรา 84 วรรคสอง กล่าวคือ นายเอต้องรับโทษตามหลักที่กำหนดไว้สำหรับกรณีผู้ใช้ให้กระทำความผิดแต่ความผิดนั้นไม่บรรลุผล โดยต้องพิจารณาความผิดที่นายเอใช้ให้กระทำและเหตุเพิ่มโทษเฉพาะตัวของนายเอประกอบด้วย อย่างไรก็ดี การเข้าขัดขวางดังกล่าวไม่ทำให้ความผิดฐานทำร้ายร่างกายจนได้รับอันตรายสาหัสซึ่งสำเร็จไปแล้วสิ้นไป นายเอยังคงต้องรับผิดในความผิดส่วนนี้`]},

/* ---------- state ---------- */
const KEY="chula69-quiz-v1";
let st={cur:0,ans:Array(MCQ.length).fill(null),show:false,essay:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.ans)&&s.ans.length===MCQ.length){st=Object.assign(st,s);st.show=false}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

let tab="mcq";
const app=document.getElementById("app");
const tabMcq=document.getElementById("tab-mcq"),tabEssay=document.getElementById("tab-essay");
tabMcq.onclick=()=>setTab("mcq");tabEssay.onclick=()=>setTab("essay");
function setTab(t){
  tab=t;
  tabMcq.setAttribute("aria-selected",t==="mcq");
  tabEssay.setAttribute("aria-selected",t==="essay");
  render();window.scrollTo(0,0);
}

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- MCQ ---------- */
function renderMcq(){
  const answered=st.ans.filter(a=>a!==null).length;
  const correct=st.ans.filter((a,i)=>a===MCQ[i].ans).length;
  let h=`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${MCQ.length}" aria-valuenow="${answered}"><i style="width:${answered/MCQ.length*100}%"></i></div>
  <div class="meta"><span>ตอบแล้ว ${answered} / ${MCQ.length} ข้อ</span><span>ถูก ${correct} ข้อ</span></div>
  <div class="dots">`;
  MCQ.forEach((q,i)=>{
    const a=st.ans[i];
    const cls=(!st.show&&i===st.cur?"cur ":"")+(a===null?"":(a===q.ans?"ok":"no"));
    h+=`<button class="${cls}" data-go="${i}" aria-label="ข้อ ${i+1}">${i+1}</button>`;
  });
  h+=`</div>`;
  if(st.show){h+=resultHtml(correct)}else{h+=questionHtml(st.cur)}
  app.innerHTML=h;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.go;st.show=false;save();render()});
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    if(st.ans[st.cur]!==null)return;
    st.ans[st.cur]=+b.dataset.pick;save();render();
  });
  const prev=document.getElementById("prev"),next=document.getElementById("next"),fin=document.getElementById("fin"),again=document.getElementById("again"),back=document.getElementById("back");
  if(prev)prev.onclick=()=>{st.cur--;save();render()};
  if(next)next.onclick=()=>{st.cur++;save();render()};
  if(fin)fin.onclick=()=>{st.show=true;render();window.scrollTo(0,0)};
  if(again)again.onclick=()=>{st.ans=Array(MCQ.length).fill(null);st.cur=0;st.show=false;save();render();window.scrollTo(0,0)};
  if(back)back.onclick=()=>{st.show=false;render()};
}
function questionHtml(i){
  const q=MCQ[i],a=st.ans[i],done=a!==null;
  const ask=`<p class="ask">${esc(q.ask)}</p>`;
  const stem=q.stem.length?`<div class="stem">${q.stem.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:"";
  let h=`<div class="card"><h2 class="qno">ข้อที่ ${i+1}</h2>${q.askFirst?ask+stem:stem+ask}<div class="choices">`;
  q.choices.forEach((c,k)=>{
    let cls="choice";
    if(done){if(k===q.ans)cls+=" right";else if(k===a)cls+=" wrong"}
    h+=`<button class="${cls}" data-pick="${k}" ${done?"disabled":""}><span class="k">${LETTERS[k]}</span><span class="t">${esc(c)}</span></button>`;
  });
  h+=`</div>`;
  if(done){
    h+=a===q.ans?`<div class="verdict ok">ถูกต้อง ข้อนี้ตอบ ${LETTERS[q.ans]}</div>`
                 :`<div class="verdict no">ยังไม่ถูก เฉลยคือข้อ ${LETTERS[q.ans]} (คุณตอบข้อ ${LETTERS[a]})</div>`;
  }
  const last=i===MCQ.length-1;
  h+=`<div class="row"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>ข้อก่อนหน้า</button>`;
  h+=last?`<button class="btn" id="fin">ดูผลคะแนน</button>`:`<button class="btn" id="next">ข้อถัดไป</button>`;
  h+=`</div></div>`;
  return h;
}
function resultHtml(correct){
  const n=MCQ.length;
  let h=`<div class="card result"><h2>ผลคะแนนปรนัย</h2><div class="score">${correct}<small> / ${n}</small></div>
  <ul class="review">`;
  MCQ.forEach((q,i)=>{
    const a=st.ans[i];
    const t=a===null?`<span class="tag skip">ยังไม่ตอบ</span>`:a===q.ans?`<span class="tag ok">ถูก</span>`:`<span class="tag no">ผิด</span>`;
    const detail=a===null?`เฉลย ${LETTERS[q.ans]}`:a===q.ans?`ตอบ ${LETTERS[a]}`:`ตอบ ${LETTERS[a]} · เฉลย ${LETTERS[q.ans]}`;
    h+=`<li><b>ข้อ ${i+1}</b>${t}<span>${detail}</span></li>`;
  });
  h+=`</ul><div class="row"><button class="btn ghost" id="back">กลับไปดูข้อสอบ</button><button class="btn" id="again">ทำใหม่ทั้งหมด</button></div></div>`;
  return h;
}

/* ---------- Essay ---------- */
function modelHtml(m){
  return m.map(b=>{
    let h="";
    if(b.h)h+=`<h4>${esc(b.h)}</h4>`;
    if(b.p)h+=b.p.map(p=>`<p>${esc(p)}</p>`).join("");
    if(b.list)h+=`<ul>${b.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    if(b.ol)h+=`<ol>${b.ol.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    if(b.sum)h+=`<div class="sum">${b.sum}</div>`;
    return h;
  }).join("");
}
function renderEssay(){
  let h="";
  ESSAY.forEach((e,i)=>{
    const open=!!st.essay["o"+i];
    h+=`<section class="card essay"><h2 class="qno">อัตนัย ${esc(e.title)}${e.model?"":`<span class="badge">ยังไม่มีแนวตอบ</span>`}</h2>
    <div class="stem">${e.stem.map(p=>`<p>${esc(p)}</p>`).join("")}</div><p class="ask">${esc(e.ask)}</p>
    <label for="ta${i}" class="sub">พื้นที่เขียนตอบของคุณ (บันทึกในเบราว์เซอร์นี้)</label>
    <textarea id="ta${i}" data-i="${i}" placeholder="พิมพ์คำตอบที่นี่">${esc(st.essay["t"+i]||"")}</textarea>
    <div class="row"><span></span>${e.model?`<button class="btn" data-toggle="${i}" aria-expanded="${open}">${open?"ซ่อนแนวตอบ":"ดูแนวตอบ"}</button>`:""}</div>
    ${e.note?`<div class="note" style="margin-top:14px">${esc(e.note)}</div>`:""}
    ${e.model?`<div class="model" ${open?"":"hidden"}>${modelHtml(e.model)}</div>`:""}</section>`;
  });
  app.innerHTML=h;
  app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{st.essay["t"+t.dataset.i]=t.value;save()});
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const i=b.dataset.toggle;st.essay["o"+i]=!st.essay["o"+i];save();
    const m=b.closest("section").querySelector(".model");
    m.hidden=!st.essay["o"+i];
    b.textContent=st.essay["o"+i]?"ซ่อนแนวตอบ":"ดูแนวตอบ";
    b.setAttribute("aria-expanded",!!st.essay["o"+i]);
  });
}

function render(){tab==="mcq"?renderMcq():renderEssay()}
render();
</script>
