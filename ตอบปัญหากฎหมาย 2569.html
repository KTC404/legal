const LETTERS=["ก","ข","ค","ง"];
const MCQ=Q.map(([stem,choices,ans,exp])=>({stem,choices,ans,exp}));
const KEY="law2569-quiz-v1";
let st={cur:0,ans:Array(MCQ.length).fill(null),show:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.ans)&&s.ans.length===MCQ.length){st=Object.assign(st,s);st.show=false}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function render(){
  const answered=st.ans.filter(a=>a!==null).length;
  const correct=st.ans.filter((a,i)=>a===MCQ[i].ans).length;
  let h=`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${MCQ.length}" aria-valuenow="${answered}"><i style="width:${answered/MCQ.length*100}%"></i></div>
  <div class="meta"><span>ตอบแล้ว ${answered} / ${MCQ.length} ข้อ</span><span>ถูก ${correct} ข้อ</span></div><div class="dots">`;
  MCQ.forEach((q,i)=>{const a=st.ans[i];
    const cls=(!st.show&&i===st.cur?"cur ":"")+(a===null?"":(a===q.ans?"ok":"no"));
    h+=`<button class="${cls}" data-go="${i}" aria-label="ข้อ ${i+1}">${i+1}</button>`});
  h+=`</div>`+(st.show?resultHtml(correct):questionHtml(st.cur));
  app.innerHTML=h;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.go;st.show=false;save();render()});
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{if(st.ans[st.cur]!==null)return;st.ans[st.cur]=+b.dataset.pick;save();render()});
  const $=id=>document.getElementById(id);
  if($("prev"))$("prev").onclick=()=>{st.cur--;save();render()};
  if($("next"))$("next").onclick=()=>{st.cur++;save();render()};
  if($("fin"))$("fin").onclick=()=>{st.show=true;render();window.scrollTo(0,0)};
  if($("again"))$("again").onclick=()=>{st.ans=Array(MCQ.length).fill(null);st.cur=0;st.show=false;save();render();window.scrollTo(0,0)};
  if($("back"))$("back").onclick=()=>{st.show=false;render()};
}
function questionHtml(i){
  const q=MCQ[i],a=st.ans[i],done=a!==null;
  let h=`<div class="card"><h2 class="qno">ข้อที่ ${i+1}</h2><div class="stem"><p>${esc(q.stem)}</p></div><div class="choices">`;
  q.choices.forEach((c,k)=>{let cls="choice";
    if(done){if(k===q.ans)cls+=" right";else if(k===a)cls+=" wrong"}
    h+=`<button class="${cls}" data-pick="${k}" ${done?"disabled":""}><span class="k">${LETTERS[k]}</span><span class="t">${esc(c)}</span></button>`});
  h+=`</div>`;
  if(done){
    h+=a===q.ans?`<div class="verdict ok">ถูกต้อง ข้อนี้ตอบ ${LETTERS[q.ans]}</div>`:`<div class="verdict no">ยังไม่ถูก เฉลยคือข้อ ${LETTERS[q.ans]} (คุณตอบข้อ ${LETTERS[a]})</div>`;
    h+=`<div class="exp"><b>คำอธิบาย</b>${esc(q.exp)}</div>`;
  }
  const last=i===MCQ.length-1;
  h+=`<div class="row"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>ข้อก่อนหน้า</button>`;
  h+=last?`<button class="btn" id="fin">ดูผลคะแนน</button>`:`<button class="btn" id="next">ข้อถัดไป</button>`;
  return h+`</div></div>`;
}
function resultHtml(correct){
  let h=`<div class="card result"><h2>ผลคะแนน</h2><div class="score">${correct}<small> / ${MCQ.length}</small></div><ul class="review">`;
  MCQ.forEach((q,i)=>{const a=st.ans[i];
    const t=a===null?`<span class="tag skip">ยังไม่ตอบ</span>`:a===q.ans?`<span class="tag ok">ถูก</span>`:`<span class="tag no">ผิด</span>`;
    const d=a===null?`เฉลย ${LETTERS[q.ans]}`:a===q.ans?`ตอบ ${LETTERS[a]}`:`ตอบ ${LETTERS[a]} · เฉลย ${LETTERS[q.ans]}`;
    h+=`<li><b>ข้อ ${i+1}</b>${t}<span>${d}</span></li>`});
  return h+`</ul><div class="row"><button class="btn ghost" id="back">กลับไปดูข้อสอบ</button><button class="btn" id="again">ทำใหม่ทั้งหมด</button></div></div>`;
