const DATA=[{"id":1,"title":"ชุดที่ 1","sub":"รอบคัดเลือกภาค 1","level":"ทั่วไป","main":[{"q":"ข้อใดต่อไปนี้ ไม่ถือว่าเป็นสิทธิเกี่ยวกับทรัพย์สิน","o":["สิทธิยึดหน่วง","สิทธิเรียกร้องค่าสินไหมทดแทนจากผู้กระทำละเมิด","สิทธิการเช่าอสังหาริมทรัพย์","ผิดทุกข้อ"],"a":[3]},{"q":"คำว่า “เบี้ยปรับ” ตามประมวลกฎหมายแพ่งและพาณิชย์ไม่มีคำนิยามกำหนดความหมายไว้เป็นการเฉพาะ แต่เบี้ยปรับอาจมีความหมายในนัยของประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 379 ถึง 382 หมายถึง1) ข้อตกลงที่ลูกหนี้สัญญากับเจ้าหนี้ว่าจะใช้เงินจำนวนหนึ่งเป็นเบี้ยปรับเมื่อตนไม่ชำระหนี้หรือไม่ชำระหนี้ให้ถูกต้องสมควรเมื่อลูกหนี้ผิดนัด (มาตรา 379) 2) ข้อตกลงที่ลูกหนี้รับว่าจะชำระหนี้เงินหรือหนี้อย่างอื่นเมื่อลูกหนี้ผิดนัด (มาตรา 382) 3) ข้อตกลงที่สัญญากว่าจะชำระหนี้กระทำการ หรืองดเว้นกระทำการเมื่อตนไม่ชำระหนี้หรือไม่ชำระหนี้ให้ถูกต้องสมควรเมื่อลูกหนี้ผิดนัด (มาตรา 383 วรรคสอง) แนวว่า ข้อตกลงต่อไปนี้ ไม่ถือว่าเป็นเบี้ยปรับ","o":["ค่าตอบแทนเพิ่มตามประกาศของคณะกรรมการกิจการกระจายเสียง กิจการโทรทัศน์และกิจการโทรคมนาคมแห่งชาติที่กำหนดให้ผู้ผิดเงื่อนไขต้องเสียค่าตอบแทนเพิ่ม","ข้อตกลงที่เป็นเงื่อนไขตามหลักกฎหมาย ที่ระบุไว้ในสัญญาว่า ถ้าผู้สู้ราคาจากการขายทอดตลาดละเลยไม่ชำระราคา ให้จำเลยซึ่งเป็นผู้สู้ราคาในการขายทอดตลาดคนเดิมต้องรับผิดชำระราคาในส่วนที่ขาด","ค่าเสียหายที่ตกลงไว้ล่วงหน้า หรือที่ตกลงให้ชำระหนี้โดยทำการงาน กระทำการ หรืองดเว้นกระทำการ หรือให้ผลตอบแทนที่ตกลงว่าจะชำระเมื่อลูกหนี้ผิดนัด","ถูกก. และข."],"a":[1]},{"q":"การกระทำในข้อใดดังต่อไปนี้ของนายส้ม ถือว่าเป็นการกระทำโดยจงใจหรือประมาทเลินเล่อ อันถือเป็นการกระทำละเมิดต่อบุคคลอื่นตามประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 420","o":["การที่นายส้มผู้เป็นหุ้นส่วนในห้างหุ้นส่วนสามัญ เอ ไปขออายัดที่ดินของผู้เป็นหุ้นส่วนผู้จัดการของห้างหุ้นส่วนสามัญเอไว้ก่อน โดยเข้าใจว่าตนเองเป็นหุ้นส่วนคนหนึ่งและมีสิทธิต่าง ๆ ในฐานะเป็นหุ้นส่วนเพื่อไปฟ้องร้องให้เลิกหุ้นส่วนและชำระบัญชี","นายส้ม ซึ่งเป็นผู้ชำระบัญชีของบริษัท พ. ละเลยไม่แจ้งให้นายน้ำเงินซึ่งเป็นเจ้าหนี้ของบริษัท พ. ทราบถึงเรื่องที่บริษัท พ. จดทะเบียนเลิกบริษัท","นายส้มซึ่งเป็นลูกความของทนายนิทรา ก่อสภาทนาย ทนายนิทราทำหน้าที่ไม่ดี ทำให้ ูกจับกุมหรือปรากฏตัว","ภายใน 60 วัน นับแต่ถูกจับกุมหรือปรากฏตัว"],"a":[2]},{"q":"องค์คณะพิจารณาคดีของศาลเยาวชนและครอบครัว (Quorum) ข้อใดกล่าวถึงองค์ประกอบของ \"องค์คณะพิจารณาคดี\" ของศาลเยาวชนและครอบครัว ได้ถูกต้องตามกฎหมาย?","o":["ผู้พิพากษาอย่างน้อย 1 คน และผู้พิพากษาสมทบอย่างน้อย 2 คน","ผู้พิพากษาอย่างน้อย 2 คน และผู้พิพากษาสมทบอย่างน้อย 2 คน ซึ่งอย่างน้อยคนหนึ่งต้องเป็นสตรี","ผู้พิพากษาอย่างน้อย 2 คน และผู้พิพากษาสมทบอย่างน้อย 1 คน ซึ่งต้องเป็นสตรี","ผู้พิพากษาอย่างน้อย 3 คน โดยไม่จำเป็นต้องมีผู้พิพากษาสมทบ"],"a":[1]},{"q":"หลังจากพระองค์เจ้ารพีสิ้นพระชนม์แล้ว ได้มีการจัดตั้งทุนรพีพัฒนศักดิ์ขึ้น โดยมีวัตถุประสงค์ใด","o":["เป็นทุนรางวัลให้แก่นักศึกษาวิชากฎหมายผู้สอบไล่ได้คะแนนสูงสุดของแต่ละมหาวิทยาลัย","สนับสนุนทุนค่าเล่าเรียนให้แก่นักเรียนที่เรียนดีแต่ยากจนเข้าศึกษาวิชากฎหมายจนจบปริญญาตรี","สนับสนุนส่งนักกฎหมายไทยไปศึกษาต่อต่างประเทศ","จัดสรรเป็นทุนรางวัลในการแข่งขันตอบปัญหากฎหมายวันรพี"],"a":[2]},{"q":"พระองค์เจ้ารพีประสูติแต่เจ้าจอมมารดาใด และพระองค์ทรงเป็นต้นราชสกุลใด","o":["เจ้าจอมมารดาสลับ - ราชสกุลรพีพัฒนศักดิ์","เจ้าจอมมารดาตลับ - ราชสกุลรพีภัทร","เจ้าจอมมารดาสลับ - ราชสกุลรพีพัฒน์","เจ้าจอมมารดาตลับ - ราชสกุลรพีพัฒน์"],"a":[3]},{"q":"ความผิดฐานใดตามประมวลกฎหมายยาเสพติดที่ผู้กระทำความผิดสามารถขอเข้ารับการบำบัดรักษาในสถานพยาบาลยาเสพติดได้","o":["ฐานมียาเสพติดไว้ในครอบครอง","ฐานมียาเสพติดไว้ในครอบครองเพื่อเสพ","ฐานเสพยาเสพติด","ข้อ ข. และ ค. ถูก"],"a":[3]},{"q":"กรณีผู้กระทำความผิดเสพเมทแอมเฟตามีน (เสพยาบ้า) เข้ารับการบำบัดรักษา จนได้รับการรับรองเป็นหนังสือว่าผ่านการบำบัดรักษา ข้อใดถูกต้อง","o":["ผู้นั้นยังคงมีความผิดแต่ไม่ต้องรับโทษ","ถือว่าผู้นั้นไม่มีความผิด","ผู้นั้นยังต้องคุมประพฤติต่อไป","ไม่มีข้อใดถูก\n\n---"],"a":[1]}],"reserve":[{"q":"ข้อใดต่อไปนี้ ถูกต้องตามหลักกฎหมายในประมวลกฎหมายแพ่งและพาณิชย์","o":["สัญญาซื้อขายที่ดินที่คู่สัญญามีเจตนาไปจดทะเบียนต่อพนักงานเจ้าหน้าที่เป็นสัญญาซื้อขายเสร็จเด็ดขาดตกเป็นโมฆะตาม ป.พ.พ. มาตรา 456 วรรคหนึ่ง จำเลยผู้ขายจะต้องคืนเงินค่าที่ดินแก่ ส. ผู้ซื้อในฐานลาภมิควรได้","สัญญาให้สินเชื่อที่จำเลยทำกับโจทก์มีข้อตกลงเกี่ยวกับวิธีการชำระหนี้ โดยให้จำเลยเปิดบัญชีกระแสรายวันไว้กับโจทก์เพื่อการหักทอนหักกลบลบกัน สัญญาให้สินเชื่อกรณีนี้ จึงไม่เข้าลักษณะเป็นสัญญาบัญชีเดินสะพัด","หนี้ที่เกิดจากมูลสัญญา เมื่อลูกหนี้ผิดนัดไม่ชำระหนี้ เจ้าหนี้ย่อมมีสิทธิที่จะบังคับชำระหนี้ตาม ป.พ.พ. มาตรา 213 หรืออาจใช้สิทธิบอกเลิกสัญญาตาม มาตรา 386 ถึงมาตรา 388 ก็ได้ แล้วแต่เจ้าหนี้จะเลือก หาได้หมายความว่าหากโจทก์ไม่ได้บอกเลิกสัญญาแล้วจำเลยมีสิทธิไม่ต้องชำระหนี้ที่ค้างชำระแก่โจทก์ไม่ ดังนั้น เมื่อหนี้ที่โจทก์ฟ้องเรียกให้จำเลยชำระหนี้มีกำหนดเวลาแน่นอนตามวันแห่งปฏิทิน การที่จำเลยมิได้ชำระตามกำหนดเวลาดังกล่าว จำเลยจึงตกเป็นผู้ผิดนัดโดยมิพักต้องเตือนหรือบอกกล่าวอีกตาม ป.พ.พ. มาตรา 204 วรรคสอง","ถูกทุกข้อ"],"a":[3]},{"q":"ข้อใดดังต่อไปนี้ ไม่ถือว่าเป็นสัญญาเพื่อประโยชน์แก่บุคคลภายนอก ตามประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 374 ที่บัญญัติว่า ถ้าคู่สัญญาฝ่ายหนึ่งทำสัญญาตกลงว่าจะชำระหนี้แก่บุคคลภายนอกไซร้ ท่านว่าบุคคลภายนอกมีสิทธิจะเรียกชำระหนี้จากลูกหนี้โดยตรง...","o":["บันทึกข้อตกลงที่นายหล่อกับบริษัท อ. ทำข้อตกลงต่อท้ายสัญญาจะซื้อจะขายให้นายหล่อชำระหนี้แก่ นาย ข. แทนบริษัท อ.","การตกลงกันระหว่างจำเลยที่ 1 กับจำเลยที่ 4 ให้จำเลยที่ 4 จ่ายเงินค่าก่อสร้างตามสัญญาจ้าง ทั้งสองฉบับให้แก่โจทก์ผู้เป็นเจ้าหนี้จำเลยที่ 1","บันทึกที่ธนาคารทำขึ้นมีข้อความว่าจะให้ความสะดวกแก่การผ่านเช็คของลูกหนี้ในการชำระหนี้ แก่บุคคลภายนอก","ถูกทั้งข้อ ก. และ ข."],"a":[2]},{"q":"กรณีศาลสั่งให้ส่งทรัพย์สินที่ริบแล้วไม่ส่งภายในกำหนด ศาลสั่งกักขังจนกว่าจะปฏิบัติตามคำสั่งเป็นเวลาในข้อใดถูกต้อง","o":["เป็นเวลา 1 ปี","เป็นเวลา 2 ปี","เป็นเวลา 3 ปี","ถูกทั้งข้อ ก. และ ข."],"a":[0]},{"q":"ข้อใดต่อไปนี้ กล่าวถูกต้องตามหลักกฎหมาย เรื่อง การค้ำประกันด้วยบุคคลตามประมวลกฎหมายแพ่งและพาณิชย์","o":["ปัจจุบันการที่เจ้าหนี้จะมีอำนาจฟ้องผู้ค้ำประกันได้ เจ้าหนี้ต้องมีหนังสือบอกกล่าวเกี่ยวกับจำนวนหนี้ ภาระหนี้ไปยังผู้ค้ำประกันภายใน 60 วัน นับแต่วันที่ลูกหนี้ผิดนัด","บทบัญญัติใหม่เรื่องข้อตกลงที่ผู้ค้ำประกันไม่ต้องร่วมรับผิดอย่างลูกหนี้ร่วมตามมาตรา 681/1 ที่แก้ไขเพิ่มเติมตาม พ.ร.บ.แก้ไขเพิ่มเติมประมวลกฎหมายแพ่งและพาณิชย์ (ฉบับที่ 20) พ.ศ.2557 การพิจารณาว่าจะดูกฎหมายฉบับเดิมหรือฉบับแก้ไขใหม่ (ฉบับที่ 20) ต้องดูวันที่ทำสัญญาค้ำประกันว่าขณะทำสัญญาค้ำประกันเป็นวันที่กฎหมายฉบับใหม่ใช้บังคับหรือไม่","หนี้ตามสัญญาค้ำประกันเป็นหนี้อุปกรณ์ ผู้ค้ำประกันจะต้องรับผิดตามสัญญาค้ำประกันก็ต่อเมื่อลูกหนี้ไม่ชำระหนี้เงินกู้ซึ่งเป็นหนี้ประธาน หรือยังมีหนี้ประธานที่ผู้ให้กู้ยังไม่ได้รับชำระหนี้ ดังนั้น เมื่อหนี้เงินกู้ที่เป็นหนี้ประธานระงับ ย่อมไม่มีหนี้ที่ผู้ค้ำประกันจะต้องรับผิดอีก","ถูกทุกข้อ"],"a":[3]},{"q":"ศาลจังหวัดเชียงใหม่ พิพากษาว่า นาย ข. กระทำความผิดฐานจำหน่ายเมทแอมเฟตามีนอันเป็นการกระทำเพื่อการค้า ตามประมวลกฎหมายยาเสพติด มาตรา 90, 145 วรรคสอง (1) ฐานพยายามฆ่าเจ้าพนักงานซึ่งกระทำการตามหน้าที่ ตามประมวลกฎหมายอาญา มาตรา 289 (2) ประกอบมาตรา 80 ฐานมีอาวุธปืนไว้ในครอบครองโดยไม่ได้รับใบอนุญาต และฐานพาอาวุธปืนติดตัวไปในเมือง หมู่บ้าน หรือทางสาธารณะโดยไม่ได้รับใบอนุญาต ตามพระราชบัญญัติอาวุธปืน เครื่องกระสุนปืน วัตถุระเบิด ดอกไม้เพลิง และสิ่งเทียมอาวุธปืน พ.ศ. 2490 มาตรา 7, 8 ทวิ วรรคหนึ่ง, 72 วรรคหนึ่ง, 72 ทวิ วรรคสอง นาย ข. ประสงค์จะอุทธรณ์คำพิพากษาของศาลจังหวัดเชียงใหม่ ว่า นาย ข. ไม่ได้กระทำความผิดทุกฐานความผิดที่ศาลจังหวัดเชียงใหม่พิพากษา นาย ข. ต้องยื่นอุทธรณ์คำพิพากษาต่อศาลใด","o":["ศาลอาญาคดีทุจริตและประพฤติมิชอบภาค 5","ศาลอุทธรณ์ภาค 5","ศาลอุทธรณ์","ศาลอุทธรณ์คดีทุจริตและประพฤติมิชอบกลาง\n\n---"],"a":[2]}]},{"id":2,"title":"ชุดที่ 2","sub":"รอบคัดเลือกภาค 2","level":"ทั่วไป","main":[{"q":"ข้อใดต่อไปนี้ไม่ถูกต้องเกี่ยวกับการเพิกถอนการฉ้อฉล","o":["การร้องขอเพิกถอนนั้น ห้ามมิให้ฟ้องร้องเมื่อพ้น 1 ปี นับแต่เวลาที่เจ้าหนี้ได้รู้ต้นเหตุอันเป็นมูลให้เพิกถอน","ลูกหนี้ทำนิติกรรมกับผู้ได้ลาภงอกโดยลูกหนี้รู้ว่านิติกรรมนั้นทำให้เจ้าหนี้ต้องเสียเปรียบ หากนิติกรรมนั้นมีค่าตอบแทน และผู้ได้ลาภงอกไม่รู้เท่าถึงข้อความจริงอันเป็นทางให้เจ้าหนี้ต้องเสียเปรียบนั้นด้วย เจ้าหนี้จะฟ้องขอให้เพิกถอนนิติกรรมนั้นไม่ได้","ลูกหนี้ทำนิติกรรมกับผู้ได้ลาภงอกโดยลูกหนี้ฝ่ายเดียวรู้ว่านิติกรรมนั้นทำให้เจ้าหนี้ต้องเสียเปรียบ หากนิติกรรมนั้นเป็นการให้โดยเสน่หา แม้ผู้ได้ลาภงอกไม่รู้เท่าถึงข้อความจริงอันเป็นทางให้เจ้าหนี้ต้องเสียเปรียบนั้นด้วย เจ้าหนี้สามารถฟ้องขอให้เพิกถอนนิติกรรมนั้นได้","หากลูกหนี้ทำนิติกรรมโอนทรัพย์สินบางส่วนให้แก่ผู้ได้ลาภงอก แม้ทรัพย์สินของลูกหนี้ที่เหลืออยู่จะเพียงพอชำระหนี้แก่เจ้าหนี้ เจ้าหนี้ก็สามารถฟ้องขอให้เพิกถอนนิติกรรมการโอนดังกล่าวได้ เพราะทรัพย์สินทั้งหมดของลูกหนี้ต้องเป็นประกันการชำระหนี้แก่เจ้าหนี้"],"a":[3]},{"q":"กรณีใดต่อไปนี้ผู้ให้สามารถถอนคืนการให้ได้","o":["ผู้ให้มีฐานะดี แต่เมื่อลองใจขอสิ่งของจากผู้รับการให้ ผู้รับกลับบอกปัดไม่ยอมให้สิ่งของแก่ผู้ให้","ผู้รับกับผู้ให้คบหาเป็นแฟนกัน ระหว่างนั้นผู้ให้ยกจักรยานยนต์ให้ผู้รับ ต่อมาผู้รับมีแฟนใหม่และจะจดทะเบียนสมรสกับแฟนใหม่ ผู้ให้จึงขอรถจักรยานยนต์คืน แต่ผู้รับไม่ยอมคืนให้","ผู้รับบอกแก่บุคคลภายนอกว่า ผู้ให้ไม่มีศีลธรรม ไม่ยุติธรรม หน้าด้านหน้ามึน","ผู้รับขายทรัพย์สินให้แก่บุคคลภายนอกเพราะเห็นว่าได้ราคาดี ทำให้ผู้ให้เสียความรู้สึก"],"a":[2]},{"q":"ข้อใดไม่ถูกต้อง","o":["ผู้ไร้ความสามารถไม่สามารถเป็นตัวแทนทำการแทนตัวการได้","จำนำย่อมระงับไปเมื่อหนี้ซึ่งจำนำเป็นประกันระงับสิ้นไป","จำนำย่อมระงับไปหากผู้รับจำนำยอมให้ทรัพย์จำนำกลับคืนไปสู่ครอบครองของผู้จำนำ","สิ่งปลูกสร้างอันผู้มีสิทธิในที่ดินของผู้อื่นใช้สิทธินั้นปลูกลงในที่ดินนั้น สิ่งปลูกสร้างนั้นไม่เป็นส่วนควบของที่ดิน"],"a":[0]},{"q":"ข้อใดไม่ถูกต้อง","o":["เจ้าของที่ดินที่ถูกที่ดินแปลงอื่นล้อมอยู่ เมื่อขอทางจำเป็นตาม ป.พ.พ. มาตรา 1349 เจ้าของที่ดินดังกล่าวต้องใช้ค่าทดแทนแก่เจ้าของที่ดินที่ล้อมอยู่","หากมีรากไม้รุกเข้ามาจากที่ดินข้างเคียง เจ้าของที่ดินต้องบอกกล่าวให้ผู้ครอบครองที่ดินข้างเคียงตัดภายในเวลาอันสมควรก่อน เมื่อผู้ครอบครองที่ดินข้างเคียงไม่ตัด เจ้าของที่ดินสามารถตัดได้","บุคคลใดครอบครองสังหาริมทรัพย์ของบุคคลอื่นโดยความสงบและโดยเปิดเผยด้วยเจตนาเป็นเจ้าของติดต่อกันเป็นเวลา 5 ปี บุคคลนั้นได้กรรมสิทธิ์ในสังหาริมทรัพย์นั้น","สิทธิเก็บกินมีได้เฉพาะแต่ในอสังหาริมทรัพย์เท่านั้น"],"a":[1]},{"q":"นายแดงดื่มสุรากับเพื่อนจนเมา ระหว่างที่นายแดงกำลังรอเรือที่ท่าเรือเพื่อที่จะกลับบ้าน นายแดงเกิดคึกคะนอง จึงยิงปืนเข้าไปในกลุ่มคนที่นั่งโดยสารในเรือซึ่งอยู่ห่างออกไปจากท่าเรือประมาณ 2 เมตร 2 นัด กระสุนปืนถูกที่หัวเรือ 1 นัด และถูกนายดำซึ่งนั่งห่างหัวเรือประมาณ 1 เมตร อีก 1 นัด กระสุนปืนตัดบริเวณไขสันหลังนายดำขาด นายดำเป็นอัมพาตตั้งแต่เอวลงไป มีพลเมืองดีช่วยนำตัวนายดำส่งโรงพยาบาล นายเขียวซึ่งเป็นอาจารย์แพทย์รักษาเนื้อนายดำด้วยวิธีการผ่าตัดได้ทันท่วงทีทำให้นายดำไม่ถึงแก่ความตายแต่ระหว่างนายดำพักฟื้นที่โรงพยาบาล นายเขียวมอบหมายให้นายขาวแพทย์ฝึกหัดที่เป็นลูกศิษย์ของตนมาช่วยดูแลนายดำ แต่นายขาวดูแลนายดำไม่ดี ไม่รักษานายดำตามมาตรฐานแพทย์ที่ควรจะเป็น ทำให้บาดแผลของนายดำติดเชื้ออย่างรุนแรง เป็นเหตุให้นายดำถึงแก่ความตายหลังจากเกิดเหตุ 9 เดือนเศษ ดังนี้ นายแดงมีความผิดฐานใด","o":["ฐานพยายามฆ่าผู้อื่น","ฐานมิได้มีเจตนาฆ่า แต่ทำร้ายผู้อื่นจนเป็นเหตุให้ผู้นั้นถึงแก่ความตาย","ฐานกระทำโดยประมาทเป็นเหตุให้ผู้อื่นถึงแก่ความตาย","ฐานฆ่าผู้อื่น"],"a":[3]},{"q":"นายหนึ่งอายุ 17 ปี ฆ่าผู้อื่นโดยไตร่ตรองไว้ก่อน ข้อใดถูกต้อง","o":["ต้องระวางโทษประหารชีวิต","ต้องระวางโทษจำคุกตลอดชีวิต","ต้องระวางโทษจำคุก 50 ปี","ต้องระวางโทษปรับสถานเดียว"],"a":[2]},{"q":"การกระทำของบุคคลใดดังต่อไปนี้เป็นความผิดอาญาอันยอมความได้","o":["นายแดงโพสต์ข้อความลงในเฟซบุ๊กของตนเองโดยตั้งเป็นสาธารณะกล่าวหานายดำว่ามีภริยาน้อย ทั้ง ๆ ที่รู้อยู่แล้วว่า ข้อความที่กล่าวหานายดำนั้นไม่เป็นความจริง","นายเขียวรับซื้อรถจักรยานจากนายเหลืองบิดาบุญธรรมของตน โดยที่รู้อยู่แล้วว่านายเหลืองไปลักรถจักรยานคันดังกล่าวมาจากนายขาว พี่ชายร่วมบิดามารดาเดียวกันกับนายเขียว","นายชมพูอายุ 18 ปี ใช้กำลังลวนลามจับไปที่หน้าอกนางสาวฟ้าอายุ 16 ปี ซึ่งเป็นรุ่นน้องที่โรงเรียนที่ไม่รู้จักกันมาก่อน โดยที่นางสาวฟ้าไม่ยินยอม แต่ไม่สามารถขัดขืนภายในห้องนอนของนางสาวฟ้าซึ่งเป็นที่ลับตาคน เป็นเหตุให้นางสาวฟ้าได้รับบาดเจ็บฟกช้ำต้องพักรักษาตัว 7 วัน บาดแผลจึงหายเป็นปกติ","ถูกทุกข้อ"],"a":[3]},{"q":"นายแดงเห็นคนเดินเข้าไปในบริเวณบ้านของนายขาวซึ่งเป็นเพื่อนของตนในเวลากลางคืน จึงไปแอบดูอยู่ที่หลังพุ่มไม้ข้างรั้วบ้านของนายขาว นายขาวเดินมาเปิดประตูหน้าต่างมองเห็นเงาคนก็เข้าใจว่านายแดงเป็นคนร้ายที่จะเข้ามาลักทรัพย์ในบ้านของตน จึงใช้ปืนยิงนายแดง 1 นัด กระสุนปืนไม่ถูกนายแดงแต่ไปถูกนายชายซึ่งเดินผ่านมาถึงแก่ความตาย นายขาวมีความผิดฐานใด","o":["มีความผิดฐานพยายามฆ่านายแดงแต่สำคัญผิดในข้อเท็จจริงและกระทำโดยประมาทเป็นเหตุให้นายชายถึงแก่ความตาย","มีความผิดฐานพยายามฆ่านายแดงและกระทำโดยประมาทเป็นเหตุให้นายชายถึงแก่ความตายโดยสำคัญผิดในข้อเท็จจริง","มีความผิดฐานพยายามฆ่านายแดงแต่สำคัญผิดในข้อเท็จจริง และกระทำโดยประมาทเป็นเหตุให้นายชายถึงแก่ความตาย แต่ไม่ต้องรับโทษเพราะเป็นการป้องกันพอสมควรแก่เหตุ","มีความผิดฐานพยายามฆ่านายแดงแต่เป็นการป้องกันเกินสมควรแก่เหตุโดยสำคัญผิด และมีความผิดฐานฆ่านายชายโดยเจตนาและเป็นการป้องกันเกินสมควรแก่เหตุต่อนายชาย"],"a":[3]},{"q":"ข้อใดต่อไปนี้ไม่ถูกต้อง","o":["ผู้พิพากษาต้องมีอายุไม่ต่ำกว่า 25 ปีบริบูรณ์","ผู้พิพากษาสมทบเป็นข้าราชการฝ่ายตุลาการศาลยุติธรรม","ผู้พิพากษาอาวุโสไม่สามารถดำรงตำแหน่งในทางบริหารได้","ดะโต๊ะยุติธรรมต้องมีอายุไม่น้อยกว่า 30 ปี"],"a":[1]},{"q":"ข้อใดเป็นคำฟ้องที่ไม่ได้รับการยกเว้น การชำระค่าขึ้นศาลและค่าฤชาธรรมเนียมในคดีครอบครัว","o":["คำฟ้องเรียกค่าอุปการะเลี้ยงดู","คำฟ้องเรียกค่าทดแทน","คำฟ้องเรียกค่าเลี้ยงชีพ","*(ในเอกสารต้นฉบับไม่มีข้อความในตัวเลือก ง.)*"],"a":[1]},{"q":"ผู้ใดมีอำนาจวินิจฉัยในกรณีมีปัญหาว่าคดีใดจะอยู่ในอำนาจของศาลเยาวชนและครอบครัวหรือไม่","o":["ประธานศาลอุทธรณ์คดีชำนัญพิเศษ","อธิบดีผู้พิพากษาศาลเยาวชนและครอบครัวกลาง","ผู้พิพากษาหัวหน้าศาลเยาวชนและครอบครัว","ประธานศาลฎีกา"],"a":[0]},{"q":"ข้อใดคือพระนิพนธ์ทางกฎหมายของ พระเจ้าบรมวงศ์เธอ กรมหลวงราชบุรีดิเรกฤทธิ์","o":["ลักษณะพยานโดยย่อ","คำอธิบายประมวลกฎหมายแพ่งและพาณิชย์","กฎหมายทะเล","โค้ดอาญา"],"a":[3]},{"q":"บุคคลใดต่อไปนี้ ไม่ใช่หม่อม (ภริยา) ของพระเจ้าบรมวงศ์เธอ กรมหลวงราชบุรีดิเรกฤทธิ์","o":["หม่อมอ่อน","หม่อมแดง","หม่อมราชวงศ์สอางค์","หม่อมเจิม"],"a":[3]},{"q":"ผู้กระทำความผิดฐานผลิต นำเข้า ส่งออก จำหน่าย หรือมีไว้ในครอบครองซึ่งยาเสพติดให้โทษในประเภท 5 ในข้อใดที่กฎหมายมิได้บัญญัติให้ต้องระวางโทษหนักขึ้น","o":["การกระทำโดยมีอาวุธหรือใช้อาวุธ","การทำให้เกิดผลกระทบต่อความมั่นคงของรัฐหรือความปลอดภัยของประชาชนทั่วไป ม. 148","การกระทำโดยใช้กำลังประทุษร้าย","การจำหน่ายในบริเวณสถานศึกษา"],"a":[1]},{"q":"กรณีผู้กระทำความผิดที่ได้ให้ข้อมูลสำคัญและเป็นประโยชน์อย่างยิ่งในการปราบปรามการกระทำความผิดเกี่ยวกับยาเสพติดต่อเจ้าพนักงาน ป.ป.ส. หรือพนักงานฝ่ายสอบสวนซึ่งเป็นผู้จับกุม หรือพนักงานสอบสวนในคดีนั้น บุคคลใดเป็นผู้ยื่นคำร้องขอให้ศาลลงโทษน้อยกว่าอัตราที่กฎหมายกำหนดได้","o":["นิติกรศาล","พนักงานอัยการ หรือจำเลย","เลขาธิการ ป.ป.ส.","พนักงานสอบสวน\n\n---"],"a":[1]}],"reserve":[{"q":"ข้อใดไม่ถูกต้องเกี่ยวกับละเมิด","o":["นายจ้างต้องร่วมรับผิดกับลูกจ้างในผลแห่งละเมิดซึ่งลูกจ้างได้กระทำไปในทางการที่จ้าง","บิดามารดาต้องร่วมรับผิดกับผู้เยาว์ที่ทำละเมิดด้วยเสมอ แม้บิดามารดาได้ใช้ความระมัดระวังตามสมควรในการดูแลผู้เยาว์แล้วก็ตาม","เมื่อนายจ้างได้ชดใช้ค่าสินไหมทดแทนแก่บุคคลภายนอกเพราะเหตุที่ลูกจ้างไปทำละเมิด นายจ้างไล่เบี้ยเอาค่าสินไหมทดแทนคืนจากลูกจ้างได้","การฟ้องมูลละเมิดต้องฟ้องภายใน 1 ปี นับแต่วันที่ผู้เสียหายรู้ถึงการละเมิดและรู้ตัวผู้จะพึงต้องใช้ค่าสินไหมทดแทน หรือภายใน 10 ปี นับแต่วันทำละเมิด มิฉะนั้นขาดอายุความ"],"a":[1]},{"q":"ข้อใดไม่ถูกต้องเกี่ยวกับการเช่าทรัพย์","o":["กำหนดระยะเวลาการเช่าตลอดอายุของผู้ให้เช่าได้","เช่าสังหาริมทรัพย์นั้น ต้องมีหลักฐานเป็นหนังสือจึงจะฟ้องร้องบังคับคดีกันได้","เช่าอสังหาริมทรัพย์ ถ้าไม่มีหลักฐานเป็นหนังสือจะฟ้องร้องบังคับคดีกันไม่ได้","เช่าอสังหาริมทรัพย์กันมีกำหนดเวลากว่า 3 ปีขึ้นไป หากมิได้ จดทะเบียนกับพนักงานเจ้าหน้าที่ จะฟ้องร้องบังคับคดีได้เพียง 3 ปี เท่านั้น"],"a":[1]},{"q":"ข้อใดไม่ถูกต้องเกี่ยวกับการค้ำประกัน","o":["ข้อตกลงที่กำหนดให้ผู้ค้ำประกันที่เป็นบุคคลธรรมดา รับผิดอย่างเดียวกับลูกหนี้ร่วมเป็นโมฆะ","ข้อตกลงที่ให้ผู้ค้ำประกันซึ่งเป็นนิติบุคคลรับผิดอย่างลูกหนี้ร่วม ข้อตกลงดังกล่าวใช้บังคับได้","ในระหว่างผู้ค้ำประกันซึ่งเป็นบุคคลธรรมดาด้วยกัน ผู้ค้ำประกันเหล่านั้นมีความรับผิดอย่างลูกหนี้ร่วม","เมื่อลูกหนี้ผิดนัด ให้เจ้าหนี้มีหนังสือบอกกล่าวไปยังผู้ค้ำประกันภายใน 60 วัน นับแต่วันที่ลูกหนี้ผิดนัด หากเจ้าหนี้มีหนังสือบอกกล่าวไปยังผู้ค้ำประกันเมื่อพ้นกำหนดเวลาดังกล่าว ผู้ค้ำประกันหลุดพ้นจากความรับผิดทั้งปวง"],"a":[3]},{"q":"ข้อใดถูกต้องเกี่ยวกับความผิดเกี่ยวกับเพศ","o":["นายหนึ่งข่มขืนกระทำชำเรานางสาวสอง 3 ครั้ง ภายในวันเดียวกัน นายหนึ่งมีความผิดฐานกระทำชำเราอันมีลักษณะเป็นการโทรมหญิง","นายหนึ่งข่มขืนกระทำชำเรานางสาวสองในช่วงเวลากลางคืนที่บ้านของนางสาวสอง แล้วออกจากบ้านนางสาวสองไปโดยที่นางสาวสองยังคงอยู่ในบ้านของตนเองไม่ได้ออกไปไหน หลังจากนั้น 1 วัน พวกของนายหนึ่งกลับมาข่มขืนกระทำชำเรานางสาวสองที่บ้านของนางสาวสองอีก นายหนึ่งเป็นตัวการร่วมกับพวกกระทำความผิดฐานกระทำชำเราอันมีลักษณะเป็นการโทรมหญิง","นายหนึ่งข่มขืนกระทำชำเรานางสาวสอง โดยมีนายสามยืนดูต้นทาง นายหนึ่งมีความผิดฐานร่วมกระทำชำเราอันมีลักษณะเป็นการโทรมหญิง","นายหนึ่งข่มขืนกระทำชำเรานางสาวสองจนเสร็จกิจแล้วผละออกจากนางสาวสอง ทันใดนั้น พวกของนายหนึ่งซึ่งรออยู่นอกห้อง จึงเข้ามาข่มขืนกระทำชำเรานางสาวสองต่อ แต่ไม่สามารถสอดใส่อวัยวะเพศเข้าไปในอวัยวะเพศของนางสาวสองได้ นายหนึ่งมีความผิดฐานร่วมกระทำชำเราอันมีลักษณะเป็นการโทรมหญิง"],"a":[3]},{"q":"นายดำทำร้ายร่างกายนางแดงบาดเจ็บสาหัสจนหมดสติไปทิ้งไว้ที่เวลากลางคืน ซึ่งยากต่อการพบเห็นและช่วยเหลือ จนเป็นเหตุให้นางแดงถึงแก่ความตาย นายดำมีความผิดอาญาฐานใด","o":["ฐานประมาทจนเป็นเหตุให้ผู้อื่นถึงแก่ความตาย","ฐานฆ่าผู้อื่น","ฐานทำร้ายผู้อื่นจนเป็นเหตุให้ได้รับอันตรายสาหัส","ฐานมิได้มีเจตนาฆ่า แต่ทำร้ายผู้อื่นจนเป็นเหตุให้ผู้นั้นถึงแก่ความตาย"],"a":[1]},{"q":"ทุนรพีบุญนิธิ ที่เหล่านักกฎหมายร่วมกันจัดตั้งเพื่อเป็นอนุสรณ์ระลึกถึงพระเจ้าบรมวงศ์เธอ กรมหลวงราชบุรีดิเรกฤทธิ์ โดยให้ทุนไปเล่าเรียนวิชากฎหมายที่ประเทศอังกฤษ บุคคลใดต่อไปนี้ เป็นผู้รับทุน","o":["นายประมวล มคราภิรมย์","นายวัฒนา รัตนศักดิ์","นายวิกรม เมาลานนท์","นายหยุด แสงอุทัย"],"a":[1]},{"q":"กรณีจำเลยได้รับความยินยอมจากศาลให้เข้ารับการบำบัดรักษาแทนการดำเนินคดี แต่ต่อมาไม่ให้ความร่วมมือในการบำบัดรักษาจนครบถ้วนตามหลักเกณฑ์ วิธีการ และเงื่อนไขที่คณะกรรมการบำบัดรักษาและฟื้นฟูผู้ติดยาเสพติดกำหนด ศาลจะดำเนินการอย่างไร","o":["ศาลต้องสั่งยุติคดี","ศาลต้องยกคดีขึ้นพิจารณาพิพากษาต่อไป","ศาลต้องสั่งให้ส่งตัวจำเลยไปบำบัดรักษาซ้ำอีกครั้งไม่ว่าจำเลยจะยินยอมหรือไม่","ผิดทุกข้อ\n\n---"],"a":[1]}]},{"id":3,"title":"ชุดที่ 3","sub":"รอบคัดเลือกภาค 3","level":"ทั่วไป","main":[{"q":"ว่าที่ประธานศาลฎีกา คนที่ 52 ของประเทศไทย ที่จะเข้ารับตำแหน่ง ตั้งแต่ 1 ต.ค. 2569 เป็นต้นไป คือท่านใด","o":["นายอธิศักดิ์ ตันติวงศ์","นางอโนชา ชีวิตโสภณ","นายโชติวัฒน์ เหลืองประเสริฐ","นายวีระพงษ์ สุดาวงศ์"],"a":[3]},{"q":"ข้อใดต่อไปนี้ถูกต้อง","o":["โทษจำคุก 1 ปี 6 เดือน มีระยะเวลาจำคุกไม่เท่ากันกับ โทษจำคุก 18 เดือน","โทษจำคุก 6 เดือน บวกโทษจำคุก 3 เดือน ที่รอการลงโทษไว้ในคดีก่อน เป็นจำคุก 9 เดือน มีระยะเวลาจำคุกเท่ากันกับ โทษจำคุก 1 ปี กระทำความผิดซ้ำ ให้เพิ่มโทษกึ่งหนึ่ง เป็นจำคุก 1 ปี 6 เดือน รับสารภาพ ลดโทษให้กึ่งหนึ่ง ลงจำคุก 9 เดือน","โทษจำคุก 3 เดือน เปลี่ยนเป็นโทษกักขัง 3 เดือน แทนตามประมวลกฎหมายอาญา มาตรา 23 มีระยะเวลาเท่ากันกับ โทษกักขัง 3 เดือน เปลี่ยนเป็นโทษจำคุก 3 เดือน ตามประมวลกฎหมายอาญา มาตรา 24","ถูกทุกข้อ"],"a":[3]},{"q":"ลุงป้อมขอยืมนาฬิการาคาแพงของเพื่อนมาใส่ ต่อมาภายหลังลุงป้อมแอบเอานาฬิการาคาแพงดังกล่าวไปขาย เมื่อเพื่อนทวงถามเพื่อจะเอานาฬิกาคืน ลุงป้อมออกอุบายว่านาฬิกายังอยู่และขอยืมใช้ต่อ เพื่อนหลงเชื่อ ยอมให้ยืมต่อ ลุงป้อมจึงเอาเงินที่ได้จากการขายนาฬิกาไปใช้จนหมด ลุงป้อมมีความผิดฐานใด","o":["ลักทรัพย์","ยักยอก","รับของโจร","ฉ้อโกง"],"a":[1]},{"q":"ความผิดในข้อใด เป็นความผิดอันยอมความได้","o":["ความผิดฐานทำร้ายร่างกาย ตามประมวลกฎหมายอาญา มาตรา 295 ระหว่างบุคคลในครอบครัว","ความผิดฐานข่มขืนกระทำชำเรา ตามประมวลกฎหมายอาญา มาตรา 276 ระหว่างคู่สมรส","ความผิดฐานกรรโชกทรัพย์ ตามประมวลกฎหมายอาญา มาตรา 337 ระหว่างพี่น้องร่วมบิดามารดาเดียวกัน","ความผิดฐานฉ้อโกง ที่เป็นการฉ้อโกงประชาชน ตามประมวลกฎหมายอาญา มาตรา 343"],"a":[0]},{"q":"ทนายจิตตรี ฉายาทนายปีศาจ เป็นพยานเข้าเบิกความเท็จในคดีแพ่ง โดยก่อนเบิกความไม่สาบานตนตามกฎหมาย ศาลชั้นต้นหลงเชื่อและพิพากษาให้ฝ่ายทนายจิตตรีชนะคดี โดยอาศัยพยานหลักฐานอื่นไม่ได้นำคำเบิกความเท็จมาใช้พิจารณาชี้ขาดประเด็นแห่งคดี ทนายเมฆ ทนายของคู่ความฝ่ายตรงข้ามอุทธรณ์คำพิพากษา ศาลอุทธรณ์พิจารณาแล้วเห็นว่า กระบวนพิจารณาในศาลชั้นต้นไม่ชอบด้วยกฎหมาย จึงพิพากษาให้เพิกถอนกระบวนพิจารณาในศาลชั้นต้นและให้สืบพยานใหม่ทั้งหมด ทนายเมฆเห็นว่าทนายจิตตรีกระทำความผิดฐานเบิกความเท็จ ควรฟ้องให้ได้รับโทษให้เข็ดหลาบ ส่วนทนายจิตตรี ท้าทายให้ฟ้องโดยเห็นว่าตนเองไม่มีความผิด จากกรณีดังกล่าว ความเห็นฝ่ายใดถูกมากกว่ากัน","o":["ทนายเมฆถูก เพราะแม้ทนายจิตตรีจะเบิกความโดยไม่ได้สาบานตนก็ตาม แต่ถือว่าเบิกความเท็จในการพิจารณาคดีแล้ว ซึ่งไม่ว่าในคดีแพ่งหรือคดีอาญาก็เป็นความผิดทั้งสิ้น","ทนายเมฆถูก เพราะทนายจิตตรีเบิกความเท็จจนทำให้ศาลหลงเชื่อพิพากษาให้ฝ่ายทนายจิตตรีชนะคดี","ทนายจิตตรีถูก เพราะศาลไม่ได้นำคำเบิกความเท็จของทนายจิตตรีไปใช้ในการวินิจฉัยชี้ขาดประเด็นแห่งคดี","ทนายจิตตรีถูก เพราะคำเบิกความเท็จถูกศาลอุทธรณ์เพิกถอนกระบวนพิจารณาและให้สืบพยานใหม่ทั้งหมด"],"a":[2]},{"q":"นางพุทธรักษาหมั้นนางสาวลำใยบุตรสาวของนางทุเรียนเพื่อให้แต่งงานกับนายมะม่วงลูกชายของตน โดยมอบเงินสด 5,000 บาท และทำสัญญากู้ 50,000 บาท ไว้ให้แก่นางทุเรียน ต่อมานายมะม่วงไม่ยอมแต่งงานกับนางสาวลำใย นางทุเรียนจึงเอาสัญญากู้ 50,000 บาท มาฟ้องให้นางพุทธรักษารับผิด แต่นางพุทธรักษาปฏิเสธและฟ้องแย้งเรียกเงินสดคืน 5,000 บาท ดังนี้ ข้อใดถูกต้อง","o":["สัญญากู้เป็นข้อตกลงที่บังคับได้ตามกฎหมาย เมื่อฝ่ายผู้หมั้นผิดสัญญาฝ่ายผู้รับหมั้นจึงฟ้องเรียกเงินตามสัญญากู้ได้ และไม่ต้องคืนเงินสด 5,000 บาท","สัญญากู้เป็นเพียงสัญญาจะให้ทรัพย์สินเป็นของหมั้นกันในวันข้างหน้ายังไม่ได้มีการมอบทรัพย์สินให้แก่กันอย่างแท้จริง จึงไม่ใช่ของหมั้น นางทุเรียนฟ้องเรียกเงินตามสัญญากู้ไม่ได้ แต่เงินสด 5,000 บาท เป็นของหมั้นตกเป็นสิทธิแก่ผู้รับหมั้น จึงไม่ต้องคืนแก่ฝ่ายผู้หมั้น","คู่สัญญาตามสัญญากู้ไม่ใช่คู่หมั้นที่ทำการหมั้น จึงไม่ใช่สัญญาหมั้น นางทุเรียนเรียกเงินตามสัญญากู้ไม่ได้ และนางทุเรียนต้องคืนเงิน 5,000 บาท แก่นางพุทธรักษา เพราะเป็นลาภมิควรได้","นางทุเรียนฟ้องบังคับตามสัญญากู้ไม่ได้ แต่ฟ้องให้นายมะม่วงแต่งงานกับนางสาวลำใยได้ และไม่ต้องคืนเงินสด 5,000 บาท"],"a":[1]},{"q":"นายดำปลูกสร้างห้องครัวในที่ดินของตนเองและได้ทำรั้วล้อมรอบแนวเขตที่ดินของตน ต่อมานายแดงซึ่งเป็นเจ้าของที่ดินข้างเคียงต้องการขายที่ดิน จึงทำการรังวัดสอบเขตที่ดินของตนจึงทราบว่าบางส่วนของห้องครัวและรั้วของนายดำรุกล้ำเข้ามาในแนวเขตที่ดินของนายแดง ซึ่งนายดำก็ไม่รู้มาก่อนว่าบางส่วนของห้องครัวและรั้วที่ตนทำขึ้นรุกล้ำเข้าไปในแนวเขตที่ดินของนายแดง ดังนี้","o":["นายแดงฟ้องให้นายดำรื้อถอนบางส่วนของห้องครัวและรั้วที่รุกล้ำเข้ามาในเขตที่ดินของตนได้ เพราะเป็นแดนกรรมสิทธิ์ของนายแดง","นายดำไม่ต้องรื้อถอนบางส่วนของห้องครัว แต่ต้องเสียเงินให้แก่นายแดงเป็นค่าใช้ที่ดินและจดทะเบียนเป็นภาระจำยอม และนายดำต้องรื้อรั้วที่รุกล้ำเข้าไปในเขตที่ดินของนายแดง","นายดำไม่ต้องรื้อถอนบางส่วนของห้องครัวและรั้ว แต่ต้องเสียเงินให้แก่นายแดงเป็นค่าที่ดินและให้นายแดงจดทะเบียนโอนกรรมสิทธิ์ที่ดินให้","นายดำไม่ต้องรื้อถอนบางส่วนของห้องครัวและรั้ว แต่ต้องเสียเงินให้แก่นายแดงเป็นค่าใช้ที่ดินและจดทะเบียนเป็นภาระจำยอม"],"a":[1]},{"q":"เช้าวันลอยกระทง ครูวันเพ็ญซึ่งเป็นครูประจำชั้น เห็นเด็กนักเรียนห้อง ป. 5/4 นำไม้กระบอกพลุมาเล่นกัน เกรงว่าจะเกิดอันตราย ครูวันเพ็ญจึงได้นำเอากระบอกพลุ นำมาทำลายและห้ามไม่ให้เล่นกันต่อไป ตอนหยุดพักกลางวันเด็กชายต้น อายุ 10 ปี ได้เล่นกระบอกพลุที่นอกห้องเรียนไปโดนนัยน์ตาเด็กชายไม้ ทำให้ตาบอด นางจำปีมารดาของเด็กชายไม้จึงนำคดีมาฟ้องเรียกค่าเสียหายจากเด็กชายต้นและครูวันเพ็ญ","o":["เด็กชายต้นไม่ต้องรับผิดเนื่องจากยังเป็นเด็ก ครูวันเพ็ญต้องรับผิดชดใช้ค่าเสียหายเนื่องจากเหตุละเมิดเกิดขึ้นในระหว่างที่อยู่ในความดูแลของตน","เด็กชายต้นต้องรับผิดเนื่องจากเป็นผู้ก่อเหตุละเมิด ครูวันเพ็ญต้องร่วมรับผิดเพราะเป็นครูผู้ดูแล","เด็กชายต้นต้องรับผิดเนื่องจากเป็นผู้ก่อเหตุละเมิด ครูวันเพ็ญไม่ต้องร่วมรับผิดเนื่องจากได้ใช้ความระมัดระวังตามสมควรแล้ว","นางจำปีฟ้องคดีไม่ได้ เนื่องจากเด็กชายต้นยังเป็นเด็กต้องขออนุญาตผู้อำนวยการสถานพินิจก่อน"],"a":[2]},{"q":"นายแอ๊ดซื้อที่ดินจากนายอ๊อด โดยนายอ๊อดพาไปชี้ให้ดูที่ดินของผู้อื่นซึ่งอยู่ติดกับถนนลาดยาง แต่นายอ๊อดจดทะเบียนโอนกรรมสิทธิ์ที่ดินของตนเองซึ่งเป็นที่ดินที่อยู่ห่างไกลถนน และมีราคาต่ำกว่าที่นายแอ๊ดชำระราคามาก สัญญาซื้อขายที่ดินนี้ผลเป็นอย่างไร","o":["สัญญาซื้อขายสมบูรณ์เพราะแสดงเจตนาคำเสนอคำสนองถูกต้องตรงกัน","สัญญาซื้อขายเกิดจากการแสดงเจตนาของนายแอ๊ดโดยสำคัญผิดในคุณสมบัติของทรัพย์สิน สัญญาซื้อขายจึงเป็นโมฆียะ","นายแอ๊ดแสดงเจตนาซื้อที่ดินโดยสำคัญผิดในสาระสำคัญแห่งนิติกรรม สัญญาซื้อขายจึงตกเป็นโมฆะ","สัญญาซื้อขายยังไม่เกิดขึ้น เพราะนายแอ๊ดแสดงเจตนาจะซื้อที่ดินแปลงซึ่งอยู่ติดกับถนนลาดยาง"],"a":[2]},{"q":"นายกร อายุ 17 ปี ถูกเจ้าพนักงานตำรวจจับกุมในข้อหา \"แข่งรถในทางโดยไม่ได้รับอนุญาต\" อันเป็นความผิดต่อ พ.ร.บ. จราจรทางบกฯ ในชั้นสอบสวนต่อหน้าที่ปรึกษากฎหมายของนายกร นายกรยืนยันว่าตนเองไม่ต้องการให้นักจิตวิทยา นักสังคมสงเคราะห์ หรือพนักงานอัยการ (สหวิชาชีพ) เข้าร่วมรับฟังการสอบปากคำ พนักงานสอบสวนจึงทำการสอบสวนและบันทึกคำให้การรับสารภาพของนายกรไว้โดยลำพัง โดยไม่มีการขู่เข็ญหรือให้คำมั่นสัญญาใดๆ ดังนี้ คำให้การรับสารภาพในชั้นสอบสวนดังกล่าวสามารถนำมาใช้เป็นพยานหลักฐานพิสูจน์ความผิดของนายกรในชั้นศาลได้หรือไม่","o":["ใช้ไม่ได้ เพราะการสอบสวนเด็กอายุไม่เกิน 18 ปี พนักงานสอบสวนจะทำโดยลำพังไม่ได้เด็ดขาดไม่ว่ากรณีใดๆ","ใช้ไม่ได้ เพราะพนักงานสอบสวนไม่ได้จัดหาทนายความให้ตาม ป.วิ.อ. มาตรา 134/1","ใช้ได้ เพราะเป็นคดีความผิดซึ่งกฎหมายมิได้บังคับว่าพนักงานสอบสวนต้องจัดให้มีบุคคลดังกล่าว และเมื่อผู้ต้องหาซึ่งเป็นเด็กไม่ได้ร้องขอ พนักงานสอบสวนย่อมทำการสอบสวนไปได้โดยลำพัง","ใช้ได้ แต่ศาลจะรับฟังลงโทษนายกรได้ก็ต่อเมื่อมีบิดามารดามาให้การรับรองคำให้การรับสารภาพนั้นในชั้นศาลอีกครั้ง"],"a":[2]},{"q":"ข้อใดต่อไปนี้ผิด","o":["จำเลย มีอายุ 14 ปี จำเลยและมารดามีที่อยู่ตามทะเบียนบ้านอยู่จังหวัดนครราชสีมา แต่ทำงานรับจ้างที่จังหวัดนนทบุรี จะกลับมาเยี่ยมมารดาที่บ้านเป็นครั้งคราว เมื่อจำเลยกระทำความผิดอาญา พนักงานอัยการยื่นฟ้องจำเลยที่ศาลเยาวชนและครอบครัวจังหวัดนนทบุรีได้","ถ้าเด็กหรือเยาวชนกระทำความผิดอาญาร่วมกับผู้ใหญ่ให้แยกฟ้องเด็กหรือเยาวชนต่อศาลเยาวชนและครอบครัว","พนักงานอัยการฟ้องเด็กหรือเยาวชนที่กระทำความผิดอาญาร่วมกับผู้ใหญ่ที่ศาลจังหวัดนนทบุรี โดยไม่ได้แยกฟ้อง ศาลจังหวัดนนทบุรีรับฟ้องไว้แล้ว แต่ต่อมามีคำสั่งให้โอนคดีเด็กหรือเยาวชน ไปยังศาลเยาวชนและครอบครัวที่มีเขตอำนาจ","ขณะกระทำผิดจำเลยอายุ 21 ปี ถูกฟ้องที่ศาลจังหวัดบุรีรัมย์ ศาลคำนึงถึงร่างกาย สภาพจิต สติปัญญาและนิสัยแล้ว เห็นว่าจำเลยมีสภาพเช่นเดียวกับเยาวชนจึงมีคำสั่งให้โอนคดีไปยังศาลเยาวชนและครอบครัวจังหวัดบุรีรัมย์ได้"],"a":[3]},{"q":"ข้อใดที่กฎหมายสันนิษฐานว่ามียาเสพติดไว้ในครอบครองเพื่อเสพ","o":["มีเมทแอมเฟตามีนไว้ในครอบครอง 5 เม็ด","มีโคเคนไว้ในครอบครองน้ำหนักสุทธิไม่เกิน 250 มิลลิกรัม","มีเมทแอมเฟตามีนไว้ในครอบครองน้ำหนักสุทธิไม่เกิน 200 มิลลิกรัม","มีเฮโรอีนไว้ในครอบครองน้ำหนักสุทธิไม่เกิน 300 มิลลิกรัม"],"a":[3]},{"q":"ข้อใดถูกต้องเกี่ยวกับกฎหมายยาเสพติด","o":["ในข้อหามียาเสพติดไว้ในครอบครองเพื่อเสพ ศาลมีอำนาจส่งตัวจำเลยไปบำบัดรักษาได้แม้จำเลยไม่ยินยอม","ในข้อหามียาเสพติดไว้ในครอบครองที่ไม่ใช่มีไว้เพื่อเสพ หากมีจำนวนเล็กน้อย ศาลมีอำนาจส่งตัวจำเลยไปบำบัดรักษาได้","ในคดียาเสพติดศาลจะเปลี่ยนโทษจำคุกเป็นวิธีการเพื่อความปลอดภัยตามประมวลกฎหมายอาญาไม่ได้","นายแสบเคยได้รับโทษจำคุกแต่พ้นโทษแล้ว ต่อมาถูกจับข้อหาครอบครองซึ่งยาเสพติดเพื่อเสพ ศาลสอบถามแล้วนายแสบสำนึกในการกระทำและตกลงเข้ารับการบำบัดรักษาอาการติดยาเสพติด พนักงานอัยการไม่ค้าน ศาลสามารถส่งตัวนายแสบไปบำบัดรักษาได้"],"a":[3]},{"q":"ผู้ใดไม่ใช่ข้าราชการฝ่ายตุลาการศาลยุติธรรมตามพระราชบัญญัติระเบียบข้าราชการฝ่ายตุลาการศาลยุติธรรม พ.ศ. 2543","o":["ข้าราชการตุลาการ","ข้าราชการศาลยุติธรรม","ผู้พิพากษาสมทบ","ผู้อำนวยการสำนักงานประจำศาล"],"a":[2]},{"q":"พระเจ้าบรมวงศ์เธอ พระองค์เจ้ารพีพัฒนศักดิ์ กรมหลวงราชบุรีดิเรกฤทธิ์ ทรงสำเร็จการศึกษาวิชากฎหมายจากสถาบันใด และทรงใช้เวลาศึกษาเรียนนานเท่าใด","o":["วิทยาลัยไครสต์เชิร์ช มหาวิทยาลัยออกซฟอร์ด เป็นเวลา 3 ปี","โรงเรียนกฎหมายแห่งกรุงลอนดอน เป็นเวลา 3 ปี","วิทยาลัยทรินิตี้ มหาวิทยาลัยเคมบริดจ์ เป็นเวลา 4 ปี","วิทยาลัยไครสต์เชิร์ช มหาวิทยาลัยออกซฟอร์ด เป็นเวลา 2 ปี"],"a":[0]},{"q":"พระเจ้าบรมวงศ์เธอ กรมหลวงราชบุรีดิเรกฤทธิ์ ทรงสิ้นพระชนม์ ณ ประเทศใด และด้วยสาเหตุใด","o":["ประเทศเยอรมนี ด้วยพระโรคทุพพลภาพตามพระชนมายุ","ประเทศอังกฤษ ด้วยพระโรคหทัย","ประเทศฝรั่งเศส ด้วยพระโรคมะเร็งในพระอันตะ","ประเทศฝรั่งเศส ด้วยพระวัณโรค ที่พระวักกะ\n\n---"],"a":[3]}],"reserve":[{"q":"การกระทำความผิดที่เป็นการกระทำเพื่อป้องกันสิทธิของตนหรือของผู้อื่น และกระทำพอสมควรแก่เหตุ การกระทำนั้นไม่มีความผิดตามประมวลกฎหมายอาญา มาตรา 68 ข้อใดไม่สามารถเป็นเหตุอ้างว่า เป็นการป้องกันโดยชอบด้วยกฎหมาย","o":["ถูกคนวิกลจริตทำร้าย","สมัครใจเข้าวิวาทต่อสู้","ถูกตำรวจเข้าจับกุมตามหมายจับ","ถูกทั้ง ข. และ ค."],"a":[3]}]},{"id":4,"title":"ชุดที่ 4","sub":"รอบคัดเลือกภาค 4","level":"ทั่วไป","main":[{"q":"คำกล่าวข้อใด ถูกต้อง","o":["นายไก่อายุ 19 ปี ทำพินัยกรรมโดยไม่ได้รับความยินยอมจากบิดามารดา พินัยกรรมเป็นโมฆียะ","นายดีเดินทางไปกับเรือบรรทุกน้ำมัน เรือถูกยิงจมในทะเลอ่าวเปอร์เซีย เมื่อวันที่ 1 มกราคม 2567 ไม่พบศพ ไม่กลับมาบ้าน ไม่ติดต่อใคร ญาติสืบหาไม่พบ เมื่อวันที่ 20 สิงหาคม 2569 ญาติร้องขอต่อศาลให้นายดีเป็นคนสาบสูญยังไม่ได้","นายเก่งกับนางสาวน้ำปิงนักเรียนชั้นมัธยมศึกษาปีที่ 5 อายุ 17 ปี ไม่สามารถจดทะเบียนสมรสต่อนายทะเบียนได้โดยบิดามารดายินยอม ต้องร้องขอให้ศาลอนุญาตเสียก่อน","นางสาวเอฟอายุ 17 ปี มารดาของนางสาวเอฟจะขายรถยนต์ของนางสาวเอฟ ต้องยื่นคำร้องขอให้ศาลอนุญาตเสียก่อน"],"a":[2]},{"q":"คำกล่าวข้อใด ผิด","o":["นายกุ้งทำสัญญากู้ยืมเงินนางปู 100,000 บาท ไม่ได้กำหนดอัตราดอกเบี้ยกันไว้ นางปูมีสิทธิติดอกเบี้ยอัตราร้อยละ 3 ต่อปี","นายกุ้งเป็นหนี้พนันผลฟุตบอลโลกนายหมึก จึงทำสัญญากู้ยืมเงินและลงชื่อมอบให้นายหมึก แต่นายหมึกไม่ยอมลงลายมือชื่อ ต่อมานายกุ้งไม่ชำระเงิน นายหมึกฟ้องบังคับตามสัญญากู้เงินได้ เพราะสัญญากู้มีลายมือชื่อผู้กู้ก็เพียงพอแล้ว","นายกุ้งเป็นคนไร้ความสามารถ ผู้อนุบาลอนุญาตให้ซื้อรถยนต์ไฟฟ้าราคา 700,000 บาท การซื้อขายรถยนต์เป็นโมฆียะ","นายดีหายไปจากภูมิลำเนาครบ 5 ปี วันที่ 1 มกราคม 2569 ศาลมีคำสั่งให้เป็นคนสาบสูญวันที่ 1 สิงหาคม 2569 ถือว่านายดีถึงแก่ความตายวันที่ 1 มกราคม 2569"],"a":[1]},{"q":"คดีใดต่อไปนี้ได้รับการยกเว้นไม่ต้องชำระค่าฤชาค่าธรรมเนียม","o":["ฟ้องขอให้แบ่งสินสมรส และฟ้องเรียกค่าอุปการะเลี้ยงดู","ฟ้องเรียกค่าอุปการะเลี้ยงดู และฟ้องเรียกค่าทดแทน","ฟ้องเรียกค่าเลี้ยงชีพ และฟ้องขอให้รับรองบุตร","ฟ้องขอให้รับรองบุตร และฟ้องเรียกค่าอุปการะเลี้ยงดู"],"a":[1]},{"q":"การแสดงเจตนาในข้อใดมีผลเป็นโมฆียะ","o":["การแสดงเจตนาลวงโดยสมรู้กับคู่กรณีอีกฝ่ายหนึ่ง","การแสดงเจตนาโดยสำคัญผิดในสิ่งซึ่งเป็นสาระสำคัญแห่งนิติกรรม","การแสดงเจตนาหมั้นของบุคคลอายุ 17 ปี โดยบิดามารดาอนุญาต","การแสดงเจตนาเพราะถูกข่มขู่"],"a":[3]},{"q":"ในการทำคำฟ้องของพนักงานอัยการ หากจำเลยถูกฟ้องคดีอาญาหลายศาลหรือหลายคดีแยกกัน การที่ศาลจะสามารถพิพากษาให้ “นับโทษจำคุกในคดีหลังต่อจากโทษจำคุกในคดีก่อน” ได้นั้น มีเงื่อนไขสำคัญที่สุดในทางวิธีพิจารณาความอาญาอย่างไร","o":["ศาลสามารถสั่งนับโทษต่อได้เองทันทีหากตรวจสอบพบว่าจำเลยมีคดีเก่าติดตัวอยู่","โจทก์ (อัยการหรือผู้เสียหาย) ต้องมีคำขอในคดีหลัง เพื่อขอให้นับโทษต่อจากคดีก่อน","คดีทั้งสองต้องเป็นความผิดฐานเดียวกัน และกระทำผิดในวันเวลาเดียวกันเท่านั้น","การนับโทษต่อจะทำได้เฉพาะกรณีที่คดีแรกศาลสั่ง “รอการลงโทษ” ไว้เท่านั้น"],"a":[1]},{"q":"ในประมวลกฎหมายยาเสพติดปัจจุบัน หากศาลสั่งริบทรัพย์สินที่เกี่ยวเนื่องกับการกระทำความผิดร้ายแรงเกี่ยวกับยาเสพติด แต่ปรากฏว่าทรัพย์สินนั้นถูกโอนย้าย ซ่อนเร้น หรือไม่สามารถติดตามเอาคืนมาได้ กฎหมายกำหนดให้ศาลมีอำนาจสั่งการอย่างไรที่เป็นการปฏิรูปแนวคิดการริบทรัพย์สินแบบเก่า","o":["ให้ยกเลิกการริบทรัพย์สินชิ้นนั้น และเปลี่ยนเป็นสั่งลงโทษจำคุกจำเลยเพิ่มขึ้นอีกไม่เกิน 5 ปี แทน","สั่งให้จำเลยส่งมอบทรัพย์สินอื่นของจำเลยที่มีมูลค่าเท่ากับทรัพย์สินที่ต้องริบนั้นแทน (ริบทรัพย์สินตามมูลค่า)","สั่งยึดทรัพย์สินของทายาทหรือผู้สืบสันดานของจำเลยที่มีมูลค่าทดแทนกันได้ทันที","ให้ศาลจำหน่ายคดีในส่วนของการริบทรัพย์สินนั้นชั่วคราวจนกว่าจะตรวจพบทรัพย์สินชิ้นเดิม"],"a":[1]},{"q":"นายเออายุ 18 ปีบริบูรณ์ หมั้นกับนางสาวบีอายุ 17 ปีบริบูรณ์ โดยบิดามารดาของทั้งสองฝ่ายให้ความยินยอม การหมั้นของบุคคลทั้งสองจะมีผลตามกฎหมายอย่างไร","o":["มีผลเป็นโมฆียะ","มีผลเป็นโมฆะ","มีผลสมบูรณ์","ขึ้นอยู่กับดุลพินิจของศาล"],"a":[1]},{"q":"นายดำเคยถูกศาลพิพากษาจำคุกในความผิดฐาน “ลักทรัพย์” และพ้นโทษออกมาเรียบร้อยแล้ว ต่อมานายดำได้กระทำความผิดฐาน “ชิงทรัพย์” อีกครั้งภายในเวลา 5 ปี นับแต่วันพ้นโทษ การกระทำของนายดำเข้าหลักเกณฑ์ “การเพิ่มโทษ” ตามประมวลกฎหมายอาญาอย่างไร","o":["ศาลต้องเพิ่มโทษที่จะลงแก่นายดำอีกกึ่งหนึ่งของโทษที่ศาลกำหนดสำหรับความผิดครั้งหลัง","ศาลต้องเพิ่มโทษที่จะลงแก่นายดำอีกหนึ่งในสามของโทษที่ศาลกำหนดสำหรับความผิดครั้งหลัง","ศาลไม่สามารถเพิ่มโทษนายดำได้ เพราะความผิดครั้งแรกกับครั้งหลังเป็นคนละฐานความผิดกัน","ศาลต้องนำโทษจำคุกในคดีเก่าที่พ้นไปแล้ว มาบวกเพิ่มเข้ากับโทษในคดีใหม่โดยตรง"],"a":[1]},{"q":"ข้อใดต่อไปนี้เป็นสินส่วนตัว","o":["แหวนหมั้น ซึ่งสวมใส่ระหว่างสมรส","ดอกผลของสินส่วนตัว ที่เกิดขึ้นระหว่างสมรส","เงินรางวัลจากการถูกสลากกินแบ่งรัฐบาล ที่ได้มาระหว่างสมรส","เงินเดือน ที่ได้มาระหว่างสมรส"],"a":[0]},{"q":"พระองค์เจ้ารพีพัฒนศักดิ์ทรงยึดมั่นในคุณธรรมข้อใดเป็นอย่างยิ่ง ซึ่งถือเป็นแบบอย่างสำคัญสำหรับนักกฎหมายและผู้พิพากษาในปัจจุบัน","o":["ความซื่อสัตย์สุจริต โดยเฉพาะการไม่รับสินบนและไม่แสวงหาผลประโยชน์ส่วนตน","ความเมตตากรุณา ด้วยการให้อภัยแก่ผู้กระทำผิดเสมอ","ความกล้าหาญในการต่อสู้กับอิทธิพลจากต่างชาติ","ความฉลาดหลักแหลมในการเจรจาสนธิรักษาสัญญา Place-holder หรือสนธิสัญญากับชาติตะวันตก"],"a":[0]},{"q":"ในสมัยที่พระเจ้าบรมวงศ์เธอ พระองค์เจ้ารพีพัฒนศักดิ์ กรมหลวงราชบุรีดิเรกฤทธิ์ทรงดำรงตำแหน่งเสนาบดีกระทรวงเกษตราธิการ ทรงจัดตั้งหอทะเบียนที่ดินเพิ่มขึ้นอีก 9 แห่ง ข้อใดต่อไปนี้ไม่ใช่หอทะเบียนที่ดินที่พระองค์ทรงจัดตั้งเพิ่มขึ้นดังกล่าว","o":["หอทะเบียนที่ดินจังหวัดจันทบุรี","หอทะเบียนที่ดินจังหวัดนนทบุรี","หอทะเบียนที่ดินจังหวัดลพบุรี","หอทะเบียนที่ดินจังหวัดสระบุรี"],"a":[2]},{"q":"นายสมหมายเป็นลูกจ้างประจำของศูนย์ปฏิบัติการเร่งรัดพัฒนาชนบท กรมการเร่งรัดพัฒนาชนบท กระทรวงมหาดไทย ในตำแหน่งพนักงานขับเครื่องจักรกลขนาดหนัก ได้กระทำความผิดจำหน่ายโดยการขายเมทแอมเฟตามีน 500 เม็ด ให้แก่นายสมชายในราคา 15,000 บาท อันเป็นการกระทำเพื่อการค้า นายสมหมายจะต้องรับโทษอย่างไร ตามประมวลกฎหมายยาเสพติด","o":["1 เท่าของโทษที่กำหนดไว้สำหรับความผิดนั้น","2 เท่าของโทษที่กำหนดไว้สำหรับความผิดนั้น","3 เท่าของโทษที่กำหนดไว้สำหรับความผิดนั้น","4 เท่าของโทษที่กำหนดไว้สำหรับความผิดนั้น"],"a":[0]},{"q":"นายสมหมายอายุ 70 ปี เป็นบิดาของนายสมปองอายุ 40 ปี นายสมหมายจดทะเบียนยกที่ดินมีโฉนด 1 แปลง พร้อมบ้านให้แก่นายสมปองโดยเสน่หา บุคคลทั้งสองพักอาศัยอยู่ด้วยกันที่บ้านดังกล่าว ต่อมานายสมหมายและนายสมปองมีปากเสียงและทะเลาะกันบ่อยครั้ง นายสมหมายทนอยู่กับนายสมปองไม่ได้ จึงต้องการที่ดินและบ้านคืนจากนายสมปอง การกระทำของนายสมปองในข้อใดต่อไปนี้นายสมหมายจะเรียกถอนคืนการให้ที่ดินและบ้านจากนายสมปองไม่ได้","o":["นายสมปองทะเลาะกับนายสมหมาย นายสมปองบีบคอและจับผมนายสมหมายแล้วกระแทกหน้านายสมหมายกับพื้นเป็นแผลแตกที่ใต้คาง เป็นอันตรายแก่กายต้องรักษาตัวอยู่ในโรงพยาบาล 8 วัน","นายสมปองบอกกับนายสมหมายให้ออกจากบ้านไปอยู่ที่อื่น และด่านายสมหมายว่า “ไอ้แก่กูไม่นับมึงเป็นพ่อ ออกไปให้พ้น ไม่ไปถึงตายกูไม่รับรู้”","นายสมหมายบอกกับนายสมปองว่าได้นำที่ดินและบ้านที่ยกให้นายสมปองไปขายให้แก่ผู้อื่น นายสมปองจึงพูดกับนายสมหมายว่า “เฒ่าหัวหงอกหัวขาวนานตาย” และไปแจ้งความต่อเจ้าพนักงานตำรวจว่านายสมหมายนำที่ดินและบ้านที่ยกให้นายสมปองไปขายให้แก่ผู้อื่น","ไม่มีข้อใดถูก"],"a":[2]},{"q":"นายดำและนายแดงมีที่ดินเขตติดต่อกัน โดยมีรั้วคอนกรีตกั้นระหว่างเขตที่ดินของบุคคลทั้งสอง กิ่งของต้นมะม่วงขนาดใหญ่ที่ปลูกอยู่ในที่ดินของนายแดงได้ยื่นล้ำเข้ามาปกคลุมในที่ดินของนายดำ หากนายดำจะดำเนินการตามกฎหมายให้มีการตัดกิ่งมะม่วงที่ยื่นล้ำดังกล่าว ข้อใดต่อไปนี้กล่าวถูกต้อง","o":["นายดำสามารถตัดกิ่งมะม่วงส่วนที่ยื่นล้ำได้โดยไม่ต้องบอกกล่าวให้นายแดงเป็นผู้ตัดก่อน","นายดำสามารถตัดกิ่งมะม่วงส่วนที่ยื่นล้ำได้ก่อน แล้วบอกกล่าวให้นายแดงทราบในภายหลัง","นายดำบอกกล่าวนายแดงให้ตัดกิ่งมะม่วงส่วนที่ยื่นล้ำภายในเวลาอันสมควรแล้ว แต่นายแดงไม่ตัด นายดำสามารถตัดเองได้","นายดำบอกกล่าวนายแดงให้ตัดกิ่งมะม่วงส่วนที่ยื่นล้ำภายในเวลาอันสมควรแล้ว แต่นายแดงไม่ตัด นายดำจะตัดเองไม่ได้ต้องยื่นฟ้องนายแดงต่อศาลให้ตัดเท่านั้น"],"a":[2]},{"q":"นายสุขกับนางสมเป็นสามีภริยากัน บุคคลทั้งสองอยู่กินฉันสามีภริยามาหลายปี แต่ปัจจุบันนางสมสุขภาพไม่แข็งแรงไม่สามารถร่วมประเวณีกับนายสุขได้ นายสุขมีความพึงพอใจนางสาวสี อายุ 17 ปี ซึ่งเป็นคนรับใช้ภายในบ้าน จึงปรึกษากับนางสมว่าจะขอร่วมประเวณีกับนางสาวสี ให้นางสมพานางสาวสีเข้ามาในห้องนอน นางสมสงสารนายสุขที่ตนไม่อาจร่วมประเวณีได้จึงไปพานางสาวสีเข้ามาในห้องนอน นางสาวสีไม่ยินยอมร่วมประเวณีด้วย นายสุขได้ดึงตัวนางสาวสีลงบนเตียงนอน แล้วนายสุขและนางสมช่วยกันถอดเสื้อผ้าของนางสาวสีออกจนหมด นางสาวสีร้องขอความช่วยเหลือ นางสมจึงใช้มือปิดปากนางสาวสีไว้ และช่วยจับแขนทั้งสองข้างของนางสาวสีไว้เหนือศีรษะให้นายสุขกระทำชำเราโดยการสอดใส่อวัยวะเพศของนายสุขเข้าไปในอวัยวะเพศของนางสาวสีจนนายสุขสำเร็จความใคร่ การกระทำดังกล่าวของนายสุขเป็นความผิดฐานข่มขืนกระทำชำเรานางสาวสี ตามประมวลกฎหมายอาญา มาตรา 276 วรรคหนึ่ง ดังนี้ นางสมมีความผิดเกี่ยวกับการข่มขืนกระทำชำเรานางสาวสีของนายสุขอย่างไรหรือไม่","o":["นางสมมีความผิดเป็นผู้สนับสนุนนายสุขในการข่มขืนกระทำชำเรานางสาวสี","นางสมมีความผิดเป็นตัวการร่วมกับนายสุขในการข่มขืนกระทำชำเรานางสาวสี","นางสมมีความผิดเป็นผู้ใช้ให้นายสุขข่มขืนกระทำชำเรานางสาวสี","นางสมไม่มีความผิดเกี่ยวกับการข่มขืนกระทำชำเรานางสาวสีของนายสุข\n\n---"],"a":[1]}],"reserve":[{"q":"คำกล่าวใดถูกต้อง","o":["คำร้องขอให้บุตรผู้เยาว์เป็นคนสาบสูญอยู่ในอำนาจพิจารณาพิพากษาของศาลเยาวชนและครอบครัว","ตาม พ.ร.บ.ศาลเยาวชนฯ เด็ก หมายถึง บุคคลที่มีอายุยังไม่เกินสิบสองปีบริบูรณ์","นางมาลีแจ้งความขอให้ตำรวจจับกุมลูกชายอายุ 14 ปี หลอนยาบ้า วางเพลิงเผาบ้านแล้วหลบหนีไป ตำรวจต้องขอให้ศาลออกหมายจับเสียก่อน จึงจะจับกุมได้","หากเด็กหรือเยาวชนต้องโทษปรับ แล้วไม่ชำระค่าปรับ จะขอทำงานบริการสังคมแทนค่าปรับไม่ได้"],"a":[2]},{"q":"ตามเจตนารมณ์ของประมวลกฎหมายยาเสพติดปัจจุบัน ที่เน้นแนวคิด “ผู้เสพ คือผู้ป่วย” หากบุคคลใดครอบครองยาเสพติดให้โทษในปริมาณเล็กน้อยเพื่อเสพ และสมัครใจเข้ารับการบำบัดรักษา ผลในทางกฎหมายจะเป็นอย่างไร","o":["ยังคงต้องระวางโทษจำคุกตามกฎหมายเดิม แต่อาจได้รับการลดหย่อนผ่อนโทษกึ่งหนึ่งหลังบำบัดเสร็จ","ความผิดฐานครอบครองเพื่อเสพจะระงับไปทันทีตั้งแต่วันที่ถูกจับ โดยไม่ต้องผ่านกระบวนการบำบัด","หากบำบัดรักษาเป็นที่น่าพอใจและปฏิบัติตามเงื่อนไขครบถ้วน ให้ผู้นั้นพ้นจากความรับผิด หรือไม่มีความผิดฐานนั้น","กฎหมายตัดสิทธิไม่ให้ส่งตัวไปบำบัด หากเป็นยาเสพติดให้โทษในประเภท 1 โดยต้องส่งฟ้องศาลเพื่อจำคุกเท่านั้น"],"a":[2]},{"q":"นายสมชายเป็นบุคคลวิกลจริตซึ่งศาลสั่งให้เป็นคนไร้ความสามารถ ทำสัญญาซื้อขายรถยนต์กับนายสมหมาย โดยนายสมหมายไม่ทราบว่าขณะที่ทำสัญญานายสมชายวิกลจริตอยู่ สัญญาซื้อขายดังกล่าวจะมีผลตามกฎหมายอย่างไร","o":["มีผลเป็นโมฆะ","มีผลเป็นโมฆียะ","มีผลสมบูรณ์","ไม่มีข้อถูก"],"a":[1]},{"q":"ในศาลเยาวชนและครอบครัว คดีใดที่หากคู่ความไม่ประสงค์ให้มีผู้พิพากษาสมทบร่วมเป็นองค์คณะก็ไม่จำเป็นต้องมีผู้พิพากษาสมทบร่วมเป็นองค์คณะพิจารณาคดีก็ได้","o":["คดีฟ้องขอแบ่งสินสมรส","คดีอาญาที่จำเลยอายุไม่ถึง 18 ปี","คดีฟ้องหย่าและเรียกค่าอุปการะเลี้ยงดูบุตรผู้เยาว์","คดีร้องขอตั้งผู้ปกครองของผู้เยาว์"],"a":[0]},{"q":"คำอธิบายความหมายของตราสัญลักษณ์ศาลยุติธรรมข้อใดไม่ถูกต้อง","o":["พระมหามงกุฎครอบอยู่เหนืออุณาโลม หมายถึง พระบาทสมเด็จพระเจ้าอยู่หัว","ดอกบัว หมายถึง ความบริสุทธิ์ผุดผ่อง และทั้งหมดมี 9 ดอก หมายถึง สำนักงานศาลยุติธรรม","ตราดุลพ่าห์ตั้งอยู่บนพานสองชั้น มีพระแท่นรองรับพานอีกทอดหนึ่ง หมายถึง ความยุติธรรมตั้งอยู่บนรากฐานอันมั่นคง","ครุฑจับนาค หมายถึง แผ่นดิน"],"a":[1]},{"q":"แผนยุทธศาสตร์ศาลยุติธรรม พ.ศ. 2569 - 2572 (SMART) ข้อใดไม่ถูกต้อง","o":["S : Speedy Justice การอำนวยความยุติธรรมถูกต้องเป็นธรรมอย่างรวดเร็ว","M : Modern person thinking คิดอย่างคนสมัยใหม่","A : Accessibility for all ทุกคนเข้าถึงได้อย่างเสมอภาค","R : Ready for the future พร้อมมุ่งสู่อนาคต"],"a":[1]},{"q":"ตามประมวลกฎหมายอาญา มาตรา 2 วางหลักสำคัญไว้ว่า \"บุคคลจักต้องรับโทษในทางอาญาต่อเมื่อได้กระทำการอันกฎหมายที่ใช้ในขณะกระทำการนั้นบัญญัติเป็นความผิดและกำหนดโทษไว้\" จากหลักการนี้ ข้อใดเป็นการบังคับใช้กฎหมายอาญาที่ไม่ถูกต้อง","o":["ศาลไม่สามารถลงโทษบุคคลจากพฤติกรรมที่สังคมมองว่าไม่เหมาะสมได้ หากไม่มีกฎหมายบัญญัติไว้ชัดเจนว่าเป็นความผิด","หากกฎหมายที่ตราขึ้นมาใหม่ภายหลังการกระทำความผิด กำหนดโทษให้หนักขึ้นกว่ากฎหมายเดิม ศาลสามารถนำกฎหมายใหม่มาบังคับใช้ย้อนหลังได้เพื่อความเด็ดขาด","ในการตีความกฎหมายอาญา ศาลจะต้องตีความโดยเคร่งครัดตามตัวอักษร จะขยายความเพื่อลงโทษจำเลยไม่ได้","หากกฎหมายที่ตราขึ้นมาใหม่ภายหลังการกระทำความผิด กำหนดว่าการกระทำนั้นไม่เป็นความผิดอีกต่อไป ให้ผู้ที่ได้กระทำการนั้นพ้นจากการเป็นผู้กระทำความผิด"],"a":[1]},{"q":"นายแดงตั้งใจจะใช้อาวุธปืนยิงนายดำซึ่งเป็นศัตรูคู่อาฆาต แต่นายแดงยิงพลาด กระสุนปืนไม่ได้ถูกนายดำ แต่กลับแฉลบไปถูกนายขาวซึ่งเดินผ่านมาพอดี ทำให้นายขาวถึงแก่ความตายทันที ในทางกฎหมายอาญา นายแดงต้องรับผิดต่อชีวิตของนายขาวอย่างไร","o":["นายแดงรับผิดฐานกระทำโดยประมาทเป็นเหตุให้ผู้อื่นถึงแก่ความตาย เพราะนายแดงไม่ได้ตั้งใจและไม่เคยมีเรื่องโกรธเคืองกับนายขาวมาก่อน","นายแดงไม่มีความผิดฐานฆ่านายขาวเลย เพราะถือเป็นอุบัติเหตุที่เกิดจากการยิงพลาด","นายแดงต้องรับผิดฐานฆ่านายขาวโดยเจตนาตามหลัก \"เจตนาโอน\" แม้จะไม่ได้ตั้งใจยิงนายขาวโดยตรงก็ตาม","นายแดงรับผิดเพียงฐานพยายามฆ่านายดำเท่านั้น ส่วนกรณีของนายขาวให้ไปฟ้องร้องเรียกค่าเสียหายในทางแพ่งแทน"],"a":[2]},{"q":"ในกรณีที่ศาลพิพากษาลงโทษปรับ และผู้ต้องขังไม่มีเงินชำระค่าปรับ หากประสงค์จะขอ \"ทำงานบริการสังคมหรือทำงานสาธารณประโยชน์แทนค่าปรับ\" กฎหมายกำหนดเงื่อนไขและหลักเกณฑ์สำคัญไว้อย่างไร","o":["บุคคลธรรมดาและนิติบุคคลที่ไม่มีรายได้ สามารถยื่นคำร้องขอทำงานบริการสังคมแทนค่าปรับได้","ต้องเป็นความผิดที่มีโทษปรับสถานเดียวเท่านั้น หากมีโทษจำคุกด้วยจะไม่สามารถขอทำได้","เป็นสิทธิเฉพาะบุคคลธรรมดาและต้องยื่นคำร้องต่อศาลก่อนหรือในวันสั่งกักขังแทนค่าปรับ","หากศาลอนุญาตแล้ว ผู้ต้องโทษปรับไม่ยอมไปทำงาน ศาลไม่มีสิทธิสั่งกักขังอีก ต้องเปลี่ยนเป็นโทษจำคุกทันที"],"a":[2]},{"q":"ตามประมวลกฎหมายอาญา มาตรา 56 ศาลจะมีอำนาจดุลพินิจสั่ง “รอการลงโทษ” ได้ชั่วระยะเวลาหนึ่ง แก่จำเลยที่กระทำความผิดซึ่งศาลจะลงโทษจำคุกไม่เกินกี่ปี","o":["โทษจำคุกที่จะลงต้องไม่เกิน 1 ปี","โทษจำคุกที่จะลงต้องไม่เกิน 3 ปี","โทษจำคุกที่จะลงต้องไม่เกิน 5 ปี","โทษจำคุกที่จะลงต้องไม่เกิน 7 ปี"],"a":[2]},{"q":"ศาลเยาวชนและครอบครัวกลางพิพากษาลงโทษนายสมชายในความผิดฐานร่วมกันพยายามฆ่าผู้อื่นโดยไตร่ตรองไว้ก่อน ตามประมวลกฎหมายอาญา มาตรา 289 (4) ประกอบมาตรา 80 และมาตรา 83 ขณะกระทำความผิดนายสมชายอายุ 17 ปีเศษ จึงลดมาตราส่วนโทษให้กึ่งหนึ่งตามประมวลกฎหมายอาญา มาตรา 75 ประกอบมาตรา 18 วรรคสาม ถ้าความผิดสำเร็จตามประมวลกฎหมายอาญา มาตรา 289 (4) มีระวางโทษประหารชีวิต นายสมชายจะได้รับโทษจำคุกเท่าใด","o":["50 ปี","33 ปี 4 เดือน","25 ปี","16 ปี 8 เดือน"],"a":[3]},{"q":"พระเจ้าบรมวงศ์เธอ พระองค์เจ้ารพีพัฒนศักดิ์ กรมหลวงราชบุรีดิเรกฤทธิ์ ทรงได้รับพระกรุณาโปรดเกล้าโปรดกระหม่อม ให้เลื่อนพระอิสริยยศขึ้นเป็น \"กรมหลวง\" เมื่อใด","o":["วันที่ 9 พฤศจิกายน 2454","วันที่ 9 ธันวาคม 2454","วันที่ 11 พฤศจิกายน 2455","วันที่ 10 ธันวาคม 2456\n\n---"],"a":[2]}]},{"id":5,"title":"ชุดที่ 5","sub":"รอบคัดเลือกภาค 5","level":"ทั่วไป","main":[{"q":"อดัมเป็นเด็กกำพร้า บิดามารดาถึงแก่ความตายแล้ว มีพี่ชายร่วมบิดามารดาอยู่ 1 คน แต่แยกย้ายไปมีครอบครัวอยู่ต่างจังหวัด และไม่เคยติดต่ออดัมเลย อดัมมีย่าเป็นผู้เลี้ยงดูมาตั้งแต่เด็ก และลุงเป็นผู้ส่งเสียให้เล่าเรียนจนจบในระดับชั้นมหาวิทยาลัย อดัมไม่มีภรรยาและบุตร โดยมีรายได้จากการเป็นยูทูปเบอร์นำเที่ยวต่างประเทศเป็นเงินจำนวนมาก อดัมถึงแก่ความตายในระหว่างไปท่องเที่ยวต่างประเทศ ดังนี้ ผู้ใดมีสิทธิได้รับทรัพย์มรดกของอดัม","o":["พี่ชาย","ย่า","ลุง","ถูกทุกข้อ"],"a":[0]},{"q":"นายแสบดักจับนกแก้วป่าตัวหนึ่งเป็นสัตว์ป่าได้แล้ว นำมาเลี้ยงไว้บ้านจนเชื่อง ต่อมาวันหนึ่งนกแก้วบินหนีออกจากกรงหายไปในป่า นายแสบเห็นว่าไม่สามารถจับนกแก้วจึงไม่ได้ติดตามไป ต่อมานายสันจับนกแก้วตัวนี้ได้ในป่า นำมาเลี้ยงไว้ ภายหลังนายแสบมาหานายสันที่บ้าน นกแก้วเรียกร้องชื่อนายแสบ นายแสบจำได้ว่าเป็นนกแก้วของตน จึงจะเอานกแก้วกลับไป แต่นายสันไม่ยินยอม อ้างว่านกแก้วเป็นของตน ดังนี้ นกแก้วเป็นของผู้ใด","o":["นกแก้วเป็นของนายแสบ","นกแก้วเป็นของนายสัน","นกแก้วของนายแสบและนายสัน ต้องแบ่งกันคนละครึ่ง","ถูกทุกข้อ"],"a":[1]},{"q":"นาย ก ยกที่ดินให้เป็นทางสาธารณะ กว้าง 6 เมตร ตลอดแนว 100 เมตร ด้วยวาจา เพื่อเป็นถนนให้แก่ชาวบ้านที่อยู่ข้างในผ่านเข้าออก 8 ปีแล้ว แต่ไม่ได้จดทะเบียน ต่อมานาย ก ขายที่ดินให้ผู้ใหญ่บ้านโดยไม่ได้บอกว่าตนยกที่ดินดังกล่าวให้แก่สาธารณะ ต่อมาผู้ใหญ่บ้านรังวัดพบว่า ที่ดินดังกล่าวอยู่ในโฉนดของตนจึงปิดทาง อ้างว่ามีการให้ทางสาธารณะระหว่างผู้ใช้ทางกับนาย ก ผู้ใหญ่บ้านจะปิดทางได้หรือไม่ เพราะเหตุใด","o":["ปิดได้ เพราะเป็นบุคคลสิทธิ์ ผู้ใหญ่บ้านผู้ซื้อไม่ทราบข้อตกลงดังกล่าว การยกให้จึงไม่ผูกพันผู้ซื้อ","ปิดได้ เพราะทางที่อ้างว่ายกให้สาธารณะ ผู้ใหญ่บ้านไม่ทราบและไม่จดทะเบียนการยกให้","ปิดได้ เพราะทำการรังวัดที่ดิน ทางอยู่ในโฉนดที่ผู้ใหญ่บ้านซื้อแล้ว","ปิดไม่ได้ เพราะทางดังกล่าวนาย ก ยกให้เป็นทางสาธารณะแล้ว แม้จะไม่จดทะเบียนก็สมบูรณ์"],"a":[3]},{"q":"การแสดงเจตนาต่อบุคคลซึ่งมิได้อยู่เฉพาะหน้าให้ถือว่ามีผลตั้งแต่เมื่อใด","o":["เมื่อการแสดงเจตนานั้นส่งให้ผู้รับการแสดงเจตนา","เมื่อการแสดงเจตนานั้น ไปถึงผู้รับการแสดงเจตนา","เมื่อผู้การแสดงจากเจตนา ทราบการแสดงเจตนานั้น","เมื่อผู้รับการแสดงเจตนา เข้าใจการแสดงเจตนานั้น"],"a":[1]},{"q":"นายดำลักรถจักรยานยนต์ จำนวน 100,000 บาท ของนายขาว แล้วหลบหนีไป นายขาวจึงไปแจ้งความต่อพนักงานสอบสวน พนักงานสอบสวนต้องดำเนินการเพื่อให้ได้ตัวนายดำ มาดำเนินคดีเพื่อฟ้องต่อศาลภายในอายุความกี่ปี นับตั้งแต่กระทำความผิด","o":["1 ปี","10 ปี","15 ปี","20 ปี"],"a":[1]},{"q":"ลักทรัพย์ ตามประมวล ข้อใดไม่เป็นเหตุให้รับโทษหนักขึ้น","o":["สถานีรถไฟ","บริเวณที่มีอุบัติเหตุ","ทรัพย์ของเจ้าพนักงาน","ทรัพย์ของนายจ้าง"],"a":[2]},{"q":"ข้อหาใดไม่ต้องการเจตนาพิเศษ","o":["ทำให้เสียทรัพย์","ฉ้อโกง","ยักยอก","ลักทรัพย์"],"a":[0]},{"q":"กรณีใดกักขังแทนค่าปรับมิได้","o":["ปรับ 400B","ปรับ 500B","ปรับ 600B","ปรับ 800B"],"a":[0]},{"q":"นับตั้งแต่ศาลยุติธรรมแยกออกจากกระทรวงยุติธรรม วันที่ 20 สิงหาคม 2543 ศาลยุติธรรมมีหน่วยงานธุรการของศาลยุติธรรมที่เป็นอิสระ มีฐานะเป็นนิติบุคคล ข้อใดต่อไปนี้กล่าวถูกต้อง","o":["ศาลยุติธรรมมีเลขาธิการสำนักงานศาลยุติธรรมเป็นผู้พิพากษา เป็นผู้บังคับบัญชาหน่วยงานธุรการ ขึ้นตรงต่อประธานศาลฎีกา","ศาลยุต ณะแล้วเป็นสี่เลนก็ตาม และจะมีการตกลงกันให้ปิดกั้น ไม่อาจบังคับได้","ปิดถนนได้ เนื่องจากสภาพการใช้ถนนสาธารณะสิ้นสุดลง เพราะมีการใช้ถนนสี่เลนแทนแล้ว ไม่จำเป็นต้องหาเหตุผลใดมาอ้างอีก","ปิดถนนที่ภรรยากับนายหล่อยกให้ได้ เนื่องจากต่อมามีการตกลงกันแล้วว่าจะไม่ให้เป็นสาธารณะกับบุตรของนายหล่อ"],"a":[1]},{"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับ อัลพราโซแลม หรือที่เรียกว่ายาเสียสาว","o":["ยาเสพติดประเภท 1","ยาเสพติดประเภท 2","วัตถุออกฤทธิ์ในประเภท 1","วัตถุออกฤทธิ์ประเภท 2"],"a":[3]},{"q":"ในขณะที่นายเอกกำลังเดินเล่นเพื่อเลือกซื้อของภายในงานวัด นายเอกพบกับนายโท ซึ่งเป็นคู่อริโดยบังเอิญ นายเอกวิ่งไปชกที่ใบหน้านายโท ทำให้คิ้วนายโทแตก หลังจากที่นายเอกทำร้ายนายโทแล้ว นายเอกวิ่งหนี นายโทวิ่งไล่ตามนายเอกทัน นายโทจึงใช้อาวุธปืนจ้องเล็งนายเอกที่ศีรษะ หมายจะเอาชีวิต แต่ปรากฏว่ากระสุนถูกบริเวณหัวไหล่ซ้ายของนายเอก เป็นเหตุให้นายเอกได้รับบาดเจ็บ ต้องรักษาตัวประมาณ 23 วัน จากข้อเท็จจริง นายโทต้องรับผิดต่อนายเอกหรือไม่ อย่างไร","o":["นายโทมีความผิดฐานทำร้ายร่างกายเป็นเหตุให้ผู้อื่นได้รับอันตรายสาหัส","นายโทมีความผิดฐานทำร้ายร่างกายเป็นเหตุให้ผู้อื่นได้รับอันตรายแก่กาย จิตใจ","นายโทมีความผิดฐานพยายามฆ่าผู้อื่นโดยบันดาลโทสะ","นายโทไม่มีความผิดเนื่องจากเป็นการป้องกันตน"],"a":[2]}]},{"id":6,"title":"ชุดที่ 6","sub":"รอบคัดเลือกภาค 6","level":"ทั่วไป","main":[{"q":"นายโปรดกับนายปรานเป็นพี่น้องร่วมบิดามารดาเดียวกัน ทั้งสองได้รับมรดกเป็นที่ดินโฉนดเลขที่ 1713 จากมารดาโดยถือกรรมสิทธิ์ร่วมกัน นายโปรดอยู่กินฉันสามีภรรยากับนางสาวจงจิต โดยไม่ได้จดทะเบียนสมรสและไม่มีบุตรด้วยกัน แต่นายโปรดจดทะเบียนรับนางสาวปลื้มใจเป็นบุตรบุญธรรม ต่อมานายโปรดถึงแก่ความตายโดยไม่ได้ทำพินัยกรรม ทรัพย์มรดกมีเพียงที่ดินโฉนดเลขที่ 1713 บุคคลใดไม่มีสิทธิยื่นคำร้องต่อศาลขอให้ตั้งผู้จัดการมรดกของนายโปรด","o":["นายปราน","นางสาวจงจิต","นางสาวปลื้มใจ","พนักงานอัยการ"],"a":[1]},{"q":"ญาญ่าเช่าบ้านของณเดชน์ โดยทำสัญญาเป็นหนังสือ มีกำหนด 1 ปี ตกลงชำระค่าเช่าเป็นรายเดือน เดือนละ 6,000 บาท หลังทำสัญญาเช่าไปได้ 2 เดือน ญาญ่าไม่ชำระค่าเช่า ณเดชน์จะฟ้องร้องดำเนินคดีกับญาญ่าได้หรือไม่ เพราะเหตุใด","o":["ฟ้องได้ทันที เนื่องจากผู้เช่าผิดสัญญาไม่ชำระค่าเช่า","ฟ้องไม่ได้ เนื่องจากสัญญาเช่าอสังหาริมทรัพย์มิได้จดทะเบียนต่อพนักงานเจ้าหน้าที่","ฟ้องไม่ได้ เนื่องจากสัญญาเช่ามีกำหนดชำระค่าเช่าเป็นรายเดือน ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งต้องไม่น้อยกว่า 15 วัน","ฟ้องไม่ได้ เนื่องจากสัญญาเช่ามีกำหนดชำระค่าเช่าเป็นรายเดือน ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งต้องไม่น้อยกว่า 30 วัน"],"a":[2]},{"q":"การหมั้นจะกระทำได้เมื่อบุคคลมีอายุเท่าไหร่","o":["ฝ่ายชายและฝ่ายหญิงมีอายุ 17 ปีบริบูรณ์แล้ว","ฝ่ายชายและฝ่ายหญิงมีอายุ 18 ปีบริบูรณ์แล้ว","บุคคลทั้งสองฝ่ายมีอายุ 17 ปีบริบูรณ์แล้ว","บุคคลทั้งสองฝ่ายมีอายุ 18 ปีบริบูรณ์แล้ว"],"a":[3]},{"q":"ข้อใดไม่ใช่ทรัพยสิทธิ","o":["สิทธิเหนือพื้นดิน","สิทธิอาศัย","สิทธิตามสัญญาจะซื้อจะขาย","สิทธิเก็บกิน"],"a":[2]},{"q":"ข้อใดไม่ใช่ความผิดอันยอมความได้","o":["ความผิดฐานกรรโชก ตามประมวลกฎหมายอาญา มาตรา 337","ความผิดฐานฉ้อโกง ตามประมวลกฎหมายอาญา มาตรา 341","ความผิดฐานยักยอก ตามประมวลกฎหมายอาญา มาตรา 352","ความผิดฐานทำให้เสียทรัพย์ ตามประมวลกฎหมายอาญา มาตรา 358"],"a":[0]},{"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับความผิดลหุโทษ","o":["ความผิดลหุโทษ คือ ความผิดที่มีระวางโทษจำคุกไม่เกิน 1 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับ","ความผิดลหุโทษเป็นความผิดอันยอมความได้","ผู้ใดพยายามกระทำความผิดลหุโทษ ผู้นั้นไม่ต้องรับโทษ","ผู้สนับสนุนในความผิดลหุโทษ ไม่ต้องรับโทษ"],"a":[1]},{"q":"การกระทำความผิดครั้งหลังในข้อใดต่อไปนี้ ศาลรอการลงโทษให้ไม่ได้","o":["จำเลยกระทำความผิดฐานเสพแอมเฟตามีน ศาลพิพากษาจำคุก 6 เดือน แต่รอการลงโทษไว้ 2 ปี 5 ปี ต่อมาจำเลยกลับมากระทำความผิดซ้ำในฐานเดิมอีก ศาลพิพากษาจำคุก 6 เดือน","จำเลยกระทำความผิดฐานยักยอกทรัพย์ ศาลพิพากษาจำคุก 1 ปี ไม่รอการลงโทษ 3 ปีต่อมา จำเลยกระทำความผิดฐานลักทรัพย์อีก ศาลพิพากษาจำคุก 2 ปี","จำเลยกระทำความผิดฐานประมาทเป็นเหตุให้ผู้อื่นถึงแก่ความตาย ศาลพิพากษาจำคุก 2 ปี ไม่รอการลงโทษ 5 ปีต่อมาจำเลยกลับมากระทำความผิดฐานมีแอมเฟตามีนไว้ในครอบครอง ศาลพิพากษาจำคุก 5 ปี","จำเลยกระทำความผิดฐานพาอาวุธไปในเมืองหมู่บ้านหรือทางสาธารณะ ศาลพิพากษาปรับ 500 บาท หนึ่งเดือนต่อมาจำเลยกลับมากระทำความผิดฐานชิงทรัพย์และศาลพิพากษาจำคุก 5 ปี"],"a":[1]},{"q":"จำเลยส่งข้อความผ่านทางระบบอินเทอร์เน็ตถึงโจทก์หลายครั้ง ขู่เข็ญโจทก์ให้จ่ายเงินให้จำเลย มิเช่นนั้นจะเปิดเผยความลับรูปภาพและวิดีโอที่โจทก์ไปมีความสัมพันธ์ทางเพศกับชายอื่น ในขณะที่ยังไม่ได้หย่าขาดจากจำเลย โจทก์จึงยอมจ่ายเงินให้ไปดังนี้ การกระทำของจำเลยเป็นความผิดฐานใด","o":["กรรโชก","รีดเอาทรัพย์","ชิงทรัพย์","ลักทรัพย์โดยใช้กลอุบาย"],"a":[1]},{"q":"ข้อใดไม่ใช่ยุทธศาสตร์ศาลยุติธรรม พ.ศ. 2569 - 2572","o":["การอำนวยความยุติธรรมถูกต้องเป็นธรรม อย่างรวดเร็ว","นวัตกรรมสมัยใหม่ ทุกคนเข้าถึงได้อย่างเสมอภาค","การพัฒนาที่ยั่งยืน เพื่อความเชื่อถือในระดับสากล","ความเชื่อมั่นและศรัทธาของประชาชน"],"a":[2]},{"q":"คดีใดต่อไปนี้ ได้รับการยกเว้นไม่ต้องชำระค่าขึ้นศาลและค่าฤชาธรรมเนียมในการยื่นคำฟ้องหรือคำร้อง ตลอดจนการดำเนินกระบวนพิจารณาต่าง ๆ","o":["ฟ้องแบ่งสินสมรส, ฟ้องเรียกค่าอุปการะเลี้ยงดู","ฟ้องเรียกค่าอุปการะเลี้ยงดู, ฟ้องเรียกค่าเลี้ยงชีพ","ฟ้องเรียกค่าเลี้ยงชีพ, ร้องขอรับรองบุตร","ร้องขอให้เป็นคนไร้ความสามารถ, ฟ้องเรียกค่าอุปการะเลี้ยงดู"],"a":[1]},{"q":"คดีใดของศาลเยาวชนและครอบครัว ที่หากคู่ความไม่ประสงค์ให้มีผู้พิพากษาสมทบร่วมเป็นองค์คณะ ก็ไม่จำเป็นต้องมีผู้พิพากษาสมทบร่วมเป็นองค์คณะพิจารณาคดีก็ได้","o":["คดีอาญาที่มีข้อหาว่าเด็กและเยาวชนกระทำความผิด","คดีฟ้องแบ่งสินสมรส","คดีฟ้องหย่าและเรียกค่าอุปการะเลี้ยงดูบุตรผู้เยาว์","คดีร้องขอตั้งผู้ปกครองของผู้เยาว์"],"a":[1]},{"q":"ข้อใดไม่ใช่งานราชการและพระกรณียกิจของพระองค์เจ้ารพีพัฒนศักดิ์ฯ","o":["ทรงเป็นเนติบัณฑิตไทยคนแรก","ทรงสถาปนาโรงเรียนสอนกฎหมาย","ทรงช่วยร่างประมวลกฎหมายของไทยฉบับแรก","ทรงเป็นเสนาบดีกระทรวงยุติธรรม"],"a":[0]},{"q":"พระเจ้าบรมวงศ์เธอพระองค์เจ้ารพีพัฒนศักดิ์ฯ ทรงเข้าเป็นกรรมการตรวจตัดสินความฎีกาในคณะกรรมการชื่อว่า “ศาลกรรมการฎีกา” ในปีใด","o":["พ.ศ. 2440","พ.ศ. 2441","พ.ศ. 2442","พ.ศ. 2443"],"a":[1]},{"q":"นาย ก. และนาย ข. ร่วมกันรับเมทแอมเฟตามีน จำนวน 2,000 เม็ด จากบุคคลอื่นมาเก็บรักษาไว้ โดยมีข้อตกลงว่าจะนำเมทแอมเฟตามีนดังกล่าวออกจำหน่ายให้แก่ลูกค้ารายย่อยในภายหลัง ทั้งสองได้แบ่งเมทแอมเฟตามีนออกเป็นถุงย่อยพร้อมระบุราคาจำหน่ายไว้ และจัดทำบัญชีรายชื่อลูกค้าไว้ในโทรศัพท์มือถือ แต่ก่อนที่จะมีการส่งมอบเมทแอมเฟตามีนให้แก่บุคคลใด เจ้าพนักงานตำรวจได้เข้าจับกุมบุคคลทั้งสองและตรวจยึดเมทแอมเฟตามีนทั้งหมดไว้ได้ภายใต้ประมวลกฎหมายยาเสพติด พ.ศ. 2564 ข้อใดถูกต้องที่สุด","o":["นาย ก. และนาย ข. มีความผิดเพียงฐานมีเมทแอมเฟตามีนไว้ในครอบครองเพื่อจำหน่าย เนื่องจากยังไม่มีการส่งมอบยาเสพติดให้แก่บุคคลอื่น","นาย ก. และนาย ข. มีความผิดฐานจำหน่ายเมทแอมเฟตามีนแล้ว เนื่องจากประมวลกฎหมายยาเสพติดกำหนดให้คำว่า \"จำหน่าย\" หมายความรวมถึง \"มีไว้เพื่อจำหน่าย\" ด้วย","นาย ก. และนาย ข. มีความผิดฐานมีเมทแอมเฟตามีนไว้ในครอบครองเพื่อจำหน่าย และมีความผิดฐานจำหน่ายเมทแอมเฟตามีนอีกฐานหนึ่ง เป็นความผิดสองกรรมต่างกันต่างหากจากกัน","นาย ก. และนาย ข. ยังไม่มีความผิดฐานจำหน่ายเมทแอมเฟตามีน เพราะการจำหน่ายจะสมบูรณ์ต่อเมื่อมีการส่งมอบยาเสพติดให้แก่บุคคลอื่นแล้วเท่านั้น"],"a":[1]},{"q":"ประมวลกฎหมายยาเสพติด มีผลบังคับใช้ตั้งแต่เมื่อใด","o":["9 ธันวาคม 2564","1 มกราคม 2564","7 สิงหาคม 2564","8 พฤศจิกายน 2564"],"a":[0]}],"reserve":[{"q":"กรณีใดที่ผู้ให้ไม่สามารถเรียกถอนคืนการให้เพราะเหตุผู้รับประพฤติเนรคุณ","o":["ทำให้ผู้ให้เสียชื่อเสียง หรือหมิ่นประมาทผู้ให้ อย่างร้ายแรง","บอกปัดไม่ยอมให้สิ่งของจำเป็นเลี้ยงชีวิตแก่ผู้ให้ในเวลาที่ผู้ให้ยากไร้และผู้รับยังสามารถจะให้ได้","ประทุษร้ายต่อผู้ให้เป็นความผิดฐานอาญาอย่างร้ายแรงตามประมวลกฎหมายอาญา","ให้เป็นบำเหน็จสินจ้างโดยแท้"],"a":[3]},{"q":"กรณีที่ผู้เยาว์อายุ 19 ปี เข้าไปในเคหสถานของเด็กอายุ 14 ปี โดยได้รับความยินยอมจากเด็ก แต่ไม่ได้ขออนุญาตจากบิดามารดาหรือผู้ปกครอง และมีการกระทำที่ล่วงละเมิดทางเพศเกิดขึ้นภายในบ้านนั้น เมื่อมารดาของเด็กมาพบและแจ้งความดำเนินคดีในข้อหาพรากเด็กไปเพื่อการอนาจาร การกระทำดังกล่าวจะเป็นความผิดตามกฎหมายอาญาหรือไม่","o":["มีความผิดฐานพรากเด็ก ตามประมวลกฎหมายอาญา มาตรา 317","มีความผิดฐานพรากผู้เยาว์ ตามประมวลกฎหมายอาญา มาตรา 318","ไม่มีความผิดฐานพรากเด็ก เนื่องจากเด็กยินยอม","ไม่มีความผิด เนื่องจากเป็นการกระทำภายในบ้านของเด็กเอง"],"a":[2]},{"q":"อนันต์ดึงเอาสลากกินแบ่งรัฐบาลที่ยังไม่ได้ตรวจไปจากมือของจิตตรีโดยไม่ได้รับอนุญาต แต่จิตตรีก็ยินยอมปล่อยให้อันต์นำสลากกินแบ่งรัฐบาลของจิตตรีไปตรวจ โดยอนันต์ไม่ได้หลบหนี ต่อมาเมื่ออนันต์ได้รับสลากกินแบ่งรัฐบาลจากจิตตรีไปครอบครองแล้ว อนันต์กลับเอาสลากกินแบ่งรัฐบาลของจิตตรีไป พอจิตตรีทวงถามก็ไม่ยอมคืนให้ การกระทำของอนันต์มีความผิดอาญาฐานใด","o":["ฐานวิ่งราวทรัพย์","ฐานลักทรัพย์","ฐานยักยอก","ฐานฉ้อโกง"],"a":[2]},{"q":"ข้อใดมิใช่วิธีการเพื่อความปลอดภัยตามประมวลกฎหมายอาญา","o":["คุมตัวไว้ในสถานพยาบาล","เรียกประกันทัณฑ์บน","ห้ามประกอบอาชีพบางอย่าง","ติดอุปกรณ์อิเล็กทรอนิกส์ (EM)"],"a":[3]},{"q":"ข้อใดไม่อยู่ในอำนาจพิจารณาพิพากษาคดีของศาลเยาวชนและครอบครัว","o":["นายเอ อายุ 17 ปี ก่อเหตุลักทรัพย์นางบี แล้วหลบหนีไป ต่อมาถูกจับตัวได้ในขณะอายุ 25 ปี","นายซี อายุ 25 ปี ก่อเหตุทำร้ายร่างกายนายดี พ่อแท้ ๆ ของตัวเอง จนได้รับบาดเจ็บสาหัสปางตาย","นางสาวอี อายุ 15 ปี ถูกอดีตแฟนหนุ่มอายุ 19 ปี ของตนแอบนำภาพเปลือยของตนไปโพสต์ในโซเชียลมีเดีย จึงต้องการยื่นคำร้องต่อศาลเพื่อระงับการแพร่หลายและนำภาพเปลือยของตนออกจากระบบคอมพิวเตอร์","นายเอฟ ฟ้องนางจีกับนายเค ขอให้เพิกถอนการขายที่ดินระหว่างนางจีกับนายเค โดยที่ดินแปลงดังกล่าวเป็นที่ดินที่นางจีซื้อมาเองเพียงลำพังด้วยเงินส่วนตัวในระหว่างที่สมรสกับนายเอฟ"],"a":[2]}]},{"id":8,"title":"ชุดที่ 8","sub":"รอบคัดเลือกภาค 8","level":"ทั่วไป","main":[{"q":"นายสมชายซึ่งเป็นทายาทของผู้ตายต้องถูกกำจัดมิให้ได้รับมรดกในกรณีใด","o":["สมชายเป็นผู้จัดการมรดกของผู้ตาย จดทะเบียนโอนกรรมสิทธิ์ที่ดินของผู้ตายเป็นของตนเอง โดยไม่แบ่งให้ทายาทอื่น แล้วนำที่ดินไปจดทะเบียนจำนองประกันหนี้ภรรยาของตนเองไว้กับธนาคาร","สมชายครอบครองที่ดินพิพาท ซึ่งเป็นที่ดินไม่มีเอกสารสิทธิ์ในฐานะทายาทของผู้ตาย สมชายขายที่ดินส่วนหนึ่งให้แก่บุคคลอื่น ต่อมาผู้ตายทำพินัยกรรมยกที่ดินพิพาทให้แก่สมชาย","สมชายต้องคำพิพากษาของศาลจังหวัดสุราษฎร์ธานีให้จำคุก 10 ปี ฐานพยายามฆ่าผู้ตายเจ้ามรดก","สมชายรู้ว่าสมพรบุตรของตนฆ่าผู้ตายเจ้ามรดกแต่ปิดบังข้อเท็จจริงไว้ไม่ให้ใครรู้"],"a":[0]},{"q":"นายพลมีบ้านและพักอาศัยยังที่อยู่ตามทะเบียนบ้านที่จังหวัดสุราษฎร์ธานี แต่ก็ไป ๆ มา ๆ กับบ้านของตนอีก 1 หลัง ที่จังหวัดนครศรีธรรมราช และบ้านภริยาที่จังหวัดชุมพร ต่อมานายพล ถูกจำคุกในระหว่างพิจารณาคดีอาญาที่เรือนจำจังหวัดภูเก็ต ข้อใดต่อไปนี้ ไม่ถูกต้องเกี่ยวกับภูมิลำเนาของนายพล","o":["บ้านที่จังหวัดสุราษฎร์ธานีและจังหวัดชุมพร","บ้านที่จังหวัดสุราษฎร์ธานีและเรือนจำจังหวัดภูเก็ต","บ้านที่จังหวัดนครศรีธรรมราชและจังหวัดชุมพร","บ้านที่จังหวัดนครศรีธรรมราชและจังหวัดสุราษฎร์ธานี"],"a":[1]},{"q":"นายสมบูรณ์และนางสมศรีเป็นสามีภรรยาโดยจดทะเบียนโดยชอบด้วยกฎหมาย อยากทราบว่าการจัดการสินสมรสใด ดังต่อไปนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งสามารถจัดการได้ โดยไม่ต้องได้รับความยินยอมจากอีกฝ่ายหนึ่ง","o":["สมบูรณ์กู้ยืมเงินจากธนาคาร 10,000,000 บาท แล้วจดทะเบียนจำนองที่ดินสินสมรสเป็นประกัน","สมศรีให้เช่ารถยนต์ซึ่งเป็นสินสมรสเป็นเวลา 4 ปี ต่อมาสมศรีฟ้องคดีเรียกรถคืนจากผู้เช่าแล้วทำสัญญาประนีประนอมยอมความกัน","สมบูรณ์ฟ้องขับไล่ผู้บุกรุกที่ดินสินสมรส ต่อมาถอนฟ้องไปโดยยอมให้เงินค่าขนย้ายส่วนหนึ่งแก่จำเลยผู้บุกรุก","สมศรีนำที่ดินสินสมรสไปเป็นหลักทรัพย์ประกันตัวบิดาของตนที่ถูกดำเนินคดีอาญาต่อนักงานสอบสวน"],"a":[2]},{"q":"จำเลยกู้ยืมเงินโจทก์ 20,000 บาท โดยจำเลยตกลงเสียดอกเบี้ยร้อยละ 10 ต่อเดือน และรับเงินกู้เพียง 16,000 บาท เนื่องจากโจทก์หักไว้เป็นค่าดอกเบี้ยล่วงหน้า 2 เดือน และให้จำเลยเขียนสัญญากู้ว่าจำเลยกู้เงินโจทก์ 160,000 บาท ดังนี้ โจทก์จะนำสัญญากู้ดังกล่าวฟ้องให้จำเลยรับผิดได้หรือไม่ เพียงใด","o":["ฟ้องไม่ได้ เนื่องจากเป็นเอกสารปลอม","ฟ้องได้ แต่จำเลยต้องรับผิดเพียง 16,000 บาท เท่าที่ได้รับไป","ฟ้องไม่ได้ เนื่องจากเรียกดอกเบี้ยในอัตราเกินกว่าที่กฎหมายกำหนดเป็นโมฆะ ทำให้สัญญากู้เป็นโมฆะไปทั้งฉบับ","ฟ้องได้ แต่จำเลยต้องรับผิดในต้นเงิน 20,000 บาท พร้อมดอกเบี้ยตามกฎหมาย"],"a":[3]},{"q":"ผู้ตระเตรียมการเพื่อกระทำความผิดฐานใด ต้องระวางโทษเช่นเดียวกับการกระทำความผิดฐานพยายาม","o":["วางเพลิงเผาทรัพย์ผู้อื่น","ข่มขืนกระทำชำเรา","ฆ่าผู้อื่น","ปลอมเอกสารสิทธิหรือเอกสารราชการ"],"a":[0]},{"q":"ข้อใดไม่ถูกต้อง","o":["ในการเพิ่มโทษ มิให้เพิ่มขึ้นถึงประหารชีวิต จำคุกตลอดชีวิต หรือจำคุกเกินห้าสิบปี","ในการลดโทษประหารชีวิต ถ้าจะลดโทษกึ่งหนึ่ง ให้ลดเป็นโทษจำคุกตลอดชีวิตหรือโทษจำคุกตั้งแต่ยี่สิบห้าปีถึงห้าสิบปี","ในการลดโทษจำคุกตลอดชีวิต ให้เปลี่ยนโทษจำคุกตลอดชีวิตเป็นโทษจำคุกห้าสิบปี","ถ้าโทษจำคุกที่ผู้กระทำผิดจะต้องรับมีกำหนดเวลาไม่เกินสามเดือน ศาลจะกำหนดโทษให้น้อยลงอีกไม่ได้"],"a":[1]},{"q":"นาย ก. เป็นฝ่ายก่อเหตุภายในบ้านของนาย ข. และพวก แล้วนาย ก. ไปเอาอาวุธปืนที่บ้านย้อนกลับไปที่บ้านเกิดเหตุซึ่งมีนาย ข. นาย ค. และนาย ง. กับพวกอีกหลายคนหลบอยู่อยู่ภายในบ้าน นาย ก. ยิงปืนไปที่บริเวณบ้าน 4 นัด กระสุนปืน 1 นัด ถูกที่เสาหน้าบ้าน สูงจากพื้นประมาณ 125 เซนติเมตร อีก 1 นัด ถูกที่ตู้ใส่ของสูงจากพื้นประมาณ 35 เซนติเมตรและนาย ข. มีบาดแผลถูกของมีคมบริเวณแขนทั้งสองข้าง มีเลือดออก ซิบๆ เนื่องจากถูกกระจกกระเด็นใส่ นาย ก. มีความผิดฐานใดหรือไม่","o":["มีความผิดฐานทำร้ายร่างกายนาย ข. ตามประมวลกฎหมายอาญา มาตรา 295","มีความผิดฐานพยายามฆ่าผู้อื่นตามประมวลกฎหมายอาญา มาตรา 288 ประกอบมาตรา 80","มีความผิดฐานกระทำโดยประมาทเป็นเหตุให้นาย ข. ได้รับอันตรายแก่กายหรือจิตใจตามประมวลกฎหมายอาญา มาตรา 390","มีความผิดฐานทำร้ายร่างกายผู้อื่น ไม่ถึงกับเป็นเหตุให้เกิดอันตรายแก่กายหรือจิตใจ ตามประมวลกฎหมายอาญา มาตรา 391"],"a":[1]},{"q":"ข้อใด ไม่ถูกต้อง","o":["เด็กอายุไม่เกิน 10 ปี กระทำความผิด ไม่ต้องรับโทษ","เด็กอายุไม่เกิน 12 ปี กระทำความผิดไม่ต้องรับโทษ แต่ศาลมีอำนาจใช้วิธีการสำหรับเด็ก","บุคคลอายุกว่า 15 ปี แต่ต่ำกว่า 18 ปี กระทำความผิด อยู่ในดุลพินิจของศาลว่าสมควรจะพิพากษาลงโทษหรือไม่ โดยพิจารณาถึงความรู้สึกผิดชอบและสิ่งอื่นทั้งปวง","บุคคลอายุ 18 ปี แต่ยังไม่เกิน 20 ปี กระทำความผิดศาลต้องลดมาตราส่วนโทษให้หนึ่งในสามหรือกึ่งหนึ่ง"],"a":[1,3]},{"q":"ศาลฎีกามีรองประธานศาลฎีกากี่ท่าน มีประธานแผนกในศาลฎีกากี่ท่าน","o":["มีรองประธานศาลฎีกา 5 ท่าน มีประธานแผนก 11 ท่าน","มีรองประธานศาลฎีกา 5 ท่าน มีประธานแผนก 12 ท่าน","มีรองประธานศาลฎีกา 6 ท่าน มีประธานแผนก 12 ท่าน","มีรองประธานศาลฎีกา 6 ท่าน มีประธานแผนก 12 ท่าน *(ตัวเลือกซ้ำกับ ค ในต้นฉบับ)*"],"a":[2]},{"q":"ข้อใดกล่าวถึงแผนกคดีในศาลอุทธรณ์ภาค ไม่ถูกต้อง","o":["แผนกคดีเลือกตั้ง","แผนกคดีค้ามนุษย์","แผนกคดีผู้บริโภค","แผนกคดีสิ่งแวดล้อม"],"a":[1]},{"q":"กรณีมีปัญหาว่าคดีใดจะอยู่ในอำนาจของศาลเยาวชนและครอบครัวหรือไม่ ใครมีอำนาจวินิจฉัย","o":["อธิบดีผู้พิพากษาศาลเยาวชนและครอบครัวกลาง","ประธานศาลอุทธรณ์","ประธานศาลอุทธรณ์คดีชำนัญพิเศษ","ประธานศาลฎีกา"],"a":[2]},{"q":"พระองค์เจ้ารพีพัฒนศักดิ์เมื่อแรกได้รับแต่งตั้งเป็นเสนาบดีกระทรวงยุติธรรมมีบุคคลใดเป็นผู้กำกับดูแล","o":["กรมหลวงดำรงราชานุภาพ","เจ้าพระยาอภัยราชา","เจ้าพระยายมราช","กรมพระจันทบุรีนฤนาถ"],"a":[1]},{"q":"กรมหลวงราชบุรีดิเรกฤทธิ์มีพระดำริว่า “อำนาจพิจารณาพิพากษาคดีอยู่ใต้คอุ้มมือฝ่ายธุรการนั้น ใช้ไม่ได้ มีแต่จะเกิดภัยขึ้นเสมอ” เป็นที่มาของการปรับปรุงกิจการศาลในด้านใด","o":["ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายทหาร","ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายการเมือง","ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายบริหาร","ความเป็นอิสระจากสิทธิสภาพนอกอาณาเขต"],"a":[2]},{"q":"บุคคลดังต่อไปนี้ข้อใด ไม่ใช่ \"คณะกรรมการป้องกันและปราบปรามยาเสพติด\" เรียกโดยย่อว่า “คณะกรรมการ ป.ป.ส.” โดยตำแหน่งตามประมวลกฎหมายยาเสพติด มาตรา 4","o":["เลขาธิการสำนักงานศาลยุติธรรม","เลขาธิการคณะกรรมการอาชีวศึกษา","ปลัดกระทรวงกลาโหม","ปลัดกระทรวงแรงงาน"],"a":[2]},{"q":"ขณะเกิดเหตุความผิด จำเลยต้องด้วยบทกำหนดโทษตาม พ.ร.บ.ยาเสพติดให้โทษ พ.ศ.2522 มาตรา 66 วรรคสาม แต่ในระหว่างพิจารณาของศาลชั้นต้น ได้มีประมวลกฎหมายยาเสพติดออกมาใช้บังคับแทนกฎหมายเดิม และศาลชั้นต้นปรับบทลงโทษจำเลยตามประมวลกฎหมายยาเสพติด มาตรา 145 วรรคสาม (2) ลงโทษประหารชีวิต และปรับ 1,000,000 บาท คดีถึงที่สุดแล้ว จำเลยใช้สิทธิยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ตามประมวลกฎหมายอาญา มาตรา 3 (1) ข้อใดถูกต้อง","o":["จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ได้ ผู้พิพากษาศาลจังหวัดนายเดียว พิจารณาคดีนี้แล้วมีคำสั่งยกคำร้องขอให้กำหนดโทษใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ได้ ผู้พิพากษาศาลจังหวัดครบองค์คณะ พิจารณาคดีนี้แล้วมีคำสั่งให้กำหนดโทษจำเลยใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ไม่ได้ ผู้พิพากษาศาลจังหวัดครบองค์คณะ พิจารณาคดีนี้แล้วมีคำสั่งยกคำร้องขอให้กำหนดโทษใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ไม่ได้ ผู้พิพากษาศาลจังหวัดนายเดียว พิจารณาคดีนี้แล้วมีคำสั่งไม่รับคำร้องขอให้กำหนดโทษใหม่"],"a":[2]}],"reserve":[{"q":"บทกำหนดโทษตามประมวลกฎหมายยาเสพติด คำกล่าวใดถูกต้องตามกฎหมาย","o":["ผู้เปิดบัญชีธนาคารยินยอมให้ใช้บัญชีดังกล่าวของตนรับโอนเงินโดยรู้ว่าเป็นค่ายาเสพติดแล้วโอนเงินต่อเข้าบัญชีผู้ค้ายา เป็นความผิดฐานเป็นผู้ยอมให้ผู้อื่นใช้บัญชีของตนเพื่อประโยชน์ต่อการกระทำความผิดร้ายแรงเกี่ยวกับยาเสพติด ตามประมวลกฎหมายยาเสพติด มาตรา 129","ผู้เปิดบัญชีธนาคารยินยอมให้ใช้บัญชีดังกล่าวของตนรับโอนเงินโดยรู้ว่าเป็นค่ายาเสพติดแล้วโอนเงินต่อเข้าบัญชีผู้ค้ายา เป็นความผิดฐานเป็นผู้สนับสนุนหรือช่วยเหลือผู้กระทำความผิด ต้องระวางโทษเช่นเดียวกับตัวการ ตามประมวลกฎหมายยาเสพติด มาตรา 125 วรรคหนึ่ง (1)","ผู้ใดพยายามกระทำความผิดร้ายแรงเกี่ยวกับยาเสพติด ต้องระวางโทษตามที่กำหนดไว้สำหรับความผิดนั้นเช่นเดียวกับตัวการ","ผู้ใดซ่อนเร้นช่วยเหลือ ให้ที่พำนัก เพื่อช่วยผู้กระทำความผิดร้ายแรงเกี่ยวกับยาเสพติดให้พ้นจากการจับกุม ต้องระวางโทษตามที่กำหนดไว้สำหรับความผิดนั้นเช่นเดียวกับผู้กระทำความผิดสำเร็จ"],"a":[1]},{"q":"ข้อใดไม่ถูกต้อง","o":["จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 1 ปี โทษจำคุกให้รอการลงโทษไว้ 2 ปี คดีหลังศาลพิพากษาลงโทษจำคุก 6 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี","จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 2 ปี แต่คดียังไม่ถึงที่สุด คดีหลังศาลพิพากษาลงโทษจำคุก 1 ปี โทษจำคุกให้รอการลงโทษไว้ 2 ปี","จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 5 เดือน คดีหลังศาลพิพากษาลงโทษจำคุก 4 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี","จำเลยกระทำความผิดในคดีก่อนศาลพิพากษาลงโทษจำคุก 8 เดือน แต่ได้รับพระราชทานอภัยโทษลดโทษจำคุกจริง 5 เดือน คดีหลังศาลพิพากษาจำคุก 10 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี"],"a":[3]},{"q":"หน่วยงานใดในสำนักงานศาลยุติธรรม มีหน้าที่กำกับ ควบคุม ดูแล เกี่ยวกับ \"เจ้าพนักงานตำรวจศาล\"","o":["สำนักกิจการคดี","ศูนย์รักษาความปลอดภัย","สำนักการเจ้าหน้าที่","ศูนย์ควบคุมติดตามการปล่อยชั่วคราว"],"a":[1]},{"q":"คณะกรรมการตุลาการ (ก.ต.) และคณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในแต่ละชั้นศาลในสำนักงานศาลยุติธรรมมีกี่ท่าน","o":["คณะกรรมการตุลาการ (ก.ต.) ในศาลชั้นต้นมี 4 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในศาลชั้นต้นมี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในศาลชั้นต้นมี 2 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในศาลชั้นต้นมี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในชั้นศาลฎีกามี 4 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในชั้นศาลฎีกามี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในชั้นศาลฎีกามี 6 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในชั้นศาลฎีกามี 6 คน"],"a":[1]},{"q":"บุคคลใดไม่ใช่คณะกรรมการตรวจสอบทรัพย์สิน ตามประมวลกฎหมายยาเสพติด","o":["อธิบดีกรมบังคับคดี","อธิบดีกรมศุลกากร","อธิบดีกรมที่ดิน","อธิบดีกรมสรรพสามิต"],"a":[3]}]},{"id":9,"title":"ชุดที่ 9","sub":"รอบคัดเลือกภาค 9 (ปี 2567)","level":"ทั่วไป","main":[{"q":"สัญญาใดต่อไปนี้สามารถใช้บังคับกันได้","o":["สัญญาซื้อขายที่ดินภายในข้อกำหนดเวลาห้ามโอนตามกฎหมาย","สัญญาซื้อขายบ้านและที่ดิน โดยไม่มีเจตนาที่จะซื้อขายกันจริง แต่จดทะเบียนต่อพนักงานเจ้าหน้าที่","สัญญาซื้อขายที่ดินตามแบบแจ้งการครอบครองที่ดิน (ส.ค.1) โดยส่งมอบการครอบครองที่ดิน แต่ไม่ได้จดทะเบียนต่อพนักงานเจ้าหน้าที่","สัญญาซื้อขายที่ดินมีโฉนดที่ดิน โดยการส่งมอบการครอบครองที่ดิน แต่ไม่ได้จดทะเบียนต่อพนักงานเจ้าหน้าที่"],"a":[2]},{"q":"นายเอ เป็นสามีโดยชอบด้วยกฎหมายของนางบี ต่อมานายเอ สมคบกับนางบีโอนที่ดินซึ่งเป็นสินสมรสไปให้แก่นายซี อันเป็นการฉ้อฉลเจ้าหนี้ เพื่อไม่ให้นายดี เจ้าหนี้ส่วนตัวของนายเอฟ้องบังคับเอากับที่ดินดังกล่าว ต่อมานายดีได้มาฟ้องขอเพิกถอนการฉ้อฉลเจ้าหนี้ ข้อใดถูกต้องที่สุด","o":["นายดีไม่สามารถที่จะฟ้องขอเพิกถอนการฉ้อฉลได้ เนื่องจากที่ดินดังกล่าวเป็นสินสมรส","นายดีสามารถฟ้องเพิกถอนได้เพียงกึ่งหนึ่ง ตามส่วนการเป็นเจ้าของของนายเอ","นายดีสามารถฟ้องเพิกถอนได้ทั้งหมด เนื่องจากนายเอกับนางบีร่วมกันสมคบคิดฉ้อฉลเจ้าหนี้","นายดีไม่สามารถที่จะฟ้องขอเพิกถอนการฉ้อฉลได้ เพราะนายดียังไม่ได้เป็นเจ้าหนี้ตามคำพิพากษา"],"a":[1]},{"q":"ข้อใดไม่ใช่การสมรสสิ้นสุดลง","o":["คู่สมรสหย่ากัน","ความตายของคู่สมรสฝ่ายหนึ่ง","คู่สมรสสมัครใจแยกกันอยู่เกินสามปี","ศาลพิพากษาให้เพิกถอนการสมรส"],"a":[2]},{"q":"นิติกรรมใด มีผลเป็นโมฆียะ","o":["A ทำสัญญาขายบ้านกับ B โดยทำเป็นหนังสืออย่างเดียว","A ทำสัญญาขายรถกับ B โดย B รู้ว่ารถของนาย A สูญหายแล้ว","A ทำสัญญาจ้าง B สร้างบ้าน โดยสำคัญผิดว่า B เป็นช่างไม้มีฝีมือ แต่ที่จริงเป็นช่างปูน","A ทำสัญญาขายที่ดินกับ B โดยสำคัญผิดว่าเป็นสัญญาขายฝาก"],"a":[2]},{"q":"ข้อใดต่อไปนี้ ไม่ถือเป็นเคหสถาน","o":["สนามหน้าบ้านที่ไม่มีแนวรั้วกั้น","บ้านเช่าที่ไม่มีผู้เช่าอาศัย","ที่พักคนงานที่ใช้อาศัยระหว่างก่อสร้าง","ถนนหน้าบ้าน"],"a":[3]},{"q":"ข้อใดต่อไปนี้ ไม่ถือว่าเป็นการใช้กำลังประทุษร้าย","o":["กอดเอวและดึงเสื้อของเจ้าพนักงาน","มอมเหล้าให้หมดสติ","ฉีดยาเสพติดให้มึนงง","ดึงกระเป๋าถือยื้อแย่งกันจนกระเป๋าขาด"],"a":[3]},{"q":"นายเมรัยชอบดื่มสุรา เมื่อมีอาการมึนเมามักพูดจาหยาบคาย ดูถูก และข่มขู่นายแค้นเคืองเป็นประจำ นายแค้นเคืองนำเรื่องนี้ไปปรับทุกข์ให้นายอาสาฟัง แล้วพูดว่า “พวกมึงจัดการไอ้เมรัยที” นายอาสาจึงไปดักตีหัวนายเมรัย นายเมรัยล้มลงคอหักตาย เช่นนี้ การกระทำของนายแค้นเคืองเป็นความผิดฐานใด","o":["ฆ่าผู้อื่น","ทำร้ายร่างกายผู้อื่นจนเป็นเหตุให้ผู้นั้นถึงแก่ความตาย","ทำร้ายร่างกายผู้อื่น","*(ข้อความในภาพถูกบัง)* ...ผู้อื่นถึงแก่ความตาย"],"a":[1]},{"q":"นายยีดอก เป็นนายกเทศมนตรีเทศบาลบ้านบันเทิง ทราบมาว่านางสาวพุ่งทะยาน เป็นผู้สมัครสอบเพื่อบรรจุเป็นข้าราชการท้องถิ่น นายยีดอกจึงเข้าไปตีสนิทและเสนอเงื่อนไขแก่นางสาวพุ่งทะยานว่า นายยีดอกรู้จักกับคณะกรรมการคัดเลือกและประมวลผลสอบ หากนางสาวพุ่งทะยานอยากสอบได้ในลำดับต้น ๆ นายยีดอกสามารถคุยกับคณะกรรมการฯ ให้ช่วยเหลือได้ แต่นางสาวพุ่งทะยานจะต้องจ่ายเงินค่าดำเนินการเป็นเงิน 600,000 บาท ทั้ง ๆ ที่นายยีดอกไม่ได้รู้จักใครเลย นางสาวพุ่งทะยานอยากสอบได้ลำดับที่ 1 จึงนำเงินสดจำนวน 600,000 บาท มามอบให้นายยีดอกเป็นค่าดำเนินการ เช่นนี้ การกระทำของนายยีดอกเป็นความผิดฐานใด","o":["ฐานเป็นเจ้าพนักงานเรียก รับ หรือยอมจะรับทรัพย์สิน หรือประโยชน์อื่นใดสำหรับตนเองหรือผู้อื่นโดยมิชอบเพื่อกระทำการหรือไม่กระทำการอย่างใดในตำแหน่งฯ","ฐานฉ้อโกง","ฐานสนับสนุนเจ้าพนักงานเรียก รับ หรือยอมจะรับทรัพย์สินฯ","ฐานเป็นเจ้าพนักงานปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยมิชอบ"],"a":[1]},{"q":"ในปี พ.ศ. 2569 ครบรอบวันสถาปนาศาลยุติธรรมกี่ปี","o":["143 ปี","144 ปี","145 ปี","146 ปี"],"a":[1]},{"q":"ศาลที่มีอำนาจพิจารณาคดีเยาวชนและครอบครัว ตามพระราชบัญญัติศาลเยาวชนและครอบครัวและวิธีพิจารณาคดีเยาวชนและครอบครัว พ.ศ. 2553 คือศาลใด","o":["ศาลเยาวชนและครอบครัว","ศาลอุทธรณ์คดีชำนัญพิเศษ","ศาลฎีกา","ถูกทุกข้อ"],"a":[3]},{"q":"กรณีมีปัญหาว่าคดีใดจะอยู่ในอำนาจของศาลเยาวชนและครอบครัวหรือไม่ ไม่ว่าปัญหานั้นจะเกิดขึ้นในศาลเยาวชนและครอบครัว หรือศาลยุติธรรมอื่น ให้ศาลนั้นรอการพิจารณาพิพากษาคดีไว้ชั่วคราวแล้วเสนอปัญหานั้นให้ใครเป็นผู้วินิจฉัย","o":["ประธานศาลฎีกา","ประธานศาลอุทธรณ์","ประธานศาลอุทธรณ์คดีชำนัญพิเศษ","อธิบดีผู้พิพากษาศาลเยาวชนและครอบครัวกลาง"],"a":[2]},{"q":"ประวัติของพระองค์เจ้ารพีพัฒนศักดิ์ ข้อใดไม่ถูกต้อง","o":["ประสูติเมื่อวันพุธ ที่ 21 ตุลาคม 2417","เป็นพระราชโอรสพระองค์ที่ 14 ในพระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว","ทรงสำเร็จการศึกษาจากมหาวิทยาลัยออกซฟอร์ด ประเทศอังกฤษ","ได้รับพระกรุณาโปรดเกล้าฯ ให้เป็นเสนาบดีกระทรวงยุติธรรมเมื่อปี 2431"],"a":[3]},{"q":"ข้อใดไม่ใช่ตำแหน่งที่พระองค์เจ้ารพีพัฒนศักดิ์เคยทรงดำรง","o":["สภานายกพิเศษจัดการตั้งศาลในมณฑลอยุธยา","เสนาบดีกระทรวงเกษตราธิการ","ประธานศาลฎีกา","องคมนตรี"],"a":[2]},{"q":"ประมวลกฎหมายยาเสพติดมีผลใช้บังคับตั้งแต่เมื่อใด","o":["8 พฤศจิกายน 2564","9 พฤศจิกายน 2564","8 ธันวาคม 2564","9 ธันวาคม 2564"],"a":[3]},{"q":"ข้อใดไม่ใช่ยาเสพติดให้โทษในประเภท 2","o":["มอร์ฟีน (Morphine)","อาเซติค แอนไฮไดรต์ (Acetic Anhydride)","โคเคน (Cocaine)","ฝิ่นยา (Medicinal opium)"],"a":[1]}],"reserve":[{"q":"ข้อใดต่อไปนี้ถูกต้อง","o":["หนี้เงินนั้นให้คิดดอกเบี้ยในระหว่างเวลาผิดนัดในอัตราร้อยละ 7.5 ต่อปี","การซื้อขายเรือมีระวางไม่ถึงห้าตันไม่ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่","ผู้เยาว์จะทำการสมรสได้ต้องมีอายุไม่น้อยกว่าสิบห้าปีและต้องได้รับความยินยอมจากบิดา มารดา","การใดอันบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถได้กระทำลงการนั้นเป็นโมฆะ"],"a":[1]},{"q":"การซื้อทรัพย์สิน ซึ่งไม่ได้กำหนดตัวทรัพย์สินไว้แน่นอน กรรมสิทธิ์โอนไปยังผู้ซื้อเมื่อใด","o":["เมื่อทำสัญญาซื้อขาย","เมื่อได้หมาย นับ ชั่ง ตวง วัด","เมื่อมีการชำระราคากัน","เมื่อส่งมอบทรัพย์สินให้กัน"],"a":[1]}]}];

{"q":"รัฐวิสาหกิจแห่งหนึ่งทำสัญญากับบริษัทเอกชนเพื่อก่อสร้างและจัดจำหน่ายบ้านโครงการ \"บ้านเอื้ออาทร\" ให้ประชาชนผู้มีรายได้น้อยได้มีที่อยู่อาศัย ต่อมาเกิดข้อพิพาทเกี่ยวกับสัญญา สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางแพ่ง เพราะคู่สัญญาฝ่ายหนึ่งเป็นนิติบุคคลเอกชน","สัญญาทางปกครอง เพราะเป็นการจัดทำบริการสาธารณะ แม้คู่สัญญาฝ่ายหนึ่งเป็นรัฐวิสาหกิจก็ตาม","สัญญาทางแพ่ง เพราะรัฐวิสาหกิจมิใช่หน่วยงานทางปกครอง","สัญญาทางปกครองเฉพาะในส่วนที่เกี่ยวกับการโอนกรรมสิทธิ์บ้านเท่านั้น"],"a":[1]},
{"q":"หลักเกณฑ์สำคัญในการพิจารณาว่าสัญญาที่หน่วยงานของรัฐทำกับเอกชนเป็น \"สัญญาทางปกครอง\" คือข้อใด","o":["ดูที่สถานะของคู่สัญญาว่าเป็นหน่วยงานของรัฐหรือไม่","ดูที่มูลค่าหรือจำนวนเงินตามสัญญา","ดูที่ลักษณะของสัญญาว่าเป็นสัญญาสัมปทาน จัดทำบริการสาธารณะ จัดให้มีสิ่งสาธารณูปโภค หรือแสวงประโยชน์จากทรัพยากรธรรมชาติ","ดูที่ข้อกำหนดให้คู่สัญญาเลือกใช้กฎหมายไทยหรือไม่"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญากับบริษัทโทรคมนาคมเอกชนให้จัดบริการข้อมูลทางโทรศัพท์ให้แก่หน่วยงาน ตามแนวคำพิพากษาฎีกาที่ 56/2553 สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางปกครอง เพราะหน่วยงานของรัฐเป็นคู่สัญญา","สัญญาทางปกครอง เพราะกิจการโทรคมนาคมเป็นบริการสาธารณะ","สัญญาทางแพ่ง เพราะไม่มีลักษณะเป็นการจัดทำบริการสาธารณะ สัมปทาน หรือสาธารณูปโภค","สัญญาทางแพ่งเฉพาะส่วนค่าบริการ แต่ส่วนอื่นเป็นสัญญาทางปกครอง"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญาซื้อขายครุภัณฑ์ก่อสร้างจากบริษัทเอกชนเพื่อใช้ในสำนักงาน เมื่อมีข้อพิพาทเกิดขึ้น ข้อใดถูกต้องตามแนวฎีกาที่ 2/2563","o":["ข้อพิพาทอยู่ในอำนาจศาลปกครอง เพราะคู่สัญญาฝ่ายหนึ่งเป็นหน่วยงานของรัฐ","ข้อพิพาทอยู่ในอำนาจศาลยุติธรรม เพราะเป็นสัญญาทางแพ่งที่ไม่มีลักษณะจัดทำบริการสาธารณะ","ข้อพิพาทอยู่ในอำนาจศาลปกครองสูงสุด","ข้อพิพาทไม่อยู่ในอำนาจศาลใด ต้องระงับโดยอนุญาโตตุลาการเท่านั้น"],"a":[1]},
{"q":"ข้อพิพาทเกี่ยวกับสัญญาสัมปทาน สัญญาจัดทำบริการสาธารณะหรือจัดให้มีสิ่งสาธารณูปโภค หรือสัญญาแสวงประโยชน์จากทรัพยากรธรรมชาติ อยู่ในอำนาจพิจารณาพิพากษาของศาลใด","o":["ศาลยุติธรรม","ศาลรัฐธรรมนูญ","ศาลปกครอง","ศาลแขวง"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งออกคำสั่งทางปกครองที่กระทบสิทธิของนาย ก โดยไม่ได้เปิดโอกาสให้นาย ก ชี้แจงข้อเท็จจริงและโต้แย้งตามขั้นตอนอันเป็นสาระสำคัญที่กฎหมายกำหนด ตามแนวฎีกาที่ 526/2550 ผลของคำสั่งดังกล่าวคือข้อใด","o":["คำสั่งชอบด้วยกฎหมาย เพราะเจ้าหน้าที่มีอำนาจออกได้","คำสั่งไม่ชอบด้วยกฎหมาย และศาลมีอำนาจเพิกถอนได้","คำสั่งชอบด้วยกฎหมาย แต่เพิกถอนไม่ได้เพราะพ้นกำหนดเวลา","คำสั่งเป็นโมฆะเฉพาะส่วนที่เป็นโทษ แต่ส่วนอื่นยังสมบูรณ์"],"a":[1]},
{"q":"หลักการใดเป็นเหตุผลสำคัญที่ศาลเพิกถอนคำสั่งทางปกครองซึ่งออกโดยไม่ปฏิบัติตามขั้นตอนอันเป็นสาระสำคัญตามข้อ 6","o":["หลักความเสมอภาคระหว่างบุคคล","หลักความชอบด้วยกฎหมายของฝ่ายปกครอง ซึ่งรวมถึงความถูกต้องตามรูปแบบและขั้นตอนอันเป็นสาระสำคัญ","หลักความศักดิ์สิทธิ์แห่งการแสดงเจตนา","หลักสุจริตในการชำระหนี้"],"a":[1]},

{"q":"เจ้าพนักงานที่ดินออกคำสั่งเกี่ยวกับที่ดินโดยมิได้ตรวจสอบพยานหลักฐานของผู้ยื่นคำขอให้รอบคอบก่อน ตามแนวฎีกาที่ 19/2546 คดีพิพาทเกี่ยวกับคำสั่งดังกล่าวอยู่ในอำนาจศาลใด","o":["ศาลยุติธรรม ตามมาตรา 9 (3)","ศาลปกครอง ตามมาตรา 9 (1) (2) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","ศาลรัฐธรรมนูญ ตามมาตรา 210","คณะกรรมการวินิจฉัยชี้ขาดอำนาจหน้าที่ระหว่างศาล"],"a":[1]},
{"q":"นาย ค ได้รับความเสียหายเพราะพนักงานเจ้าหน้าที่ออกโฉนดที่ดินให้แก่ผู้อื่นโดยไม่ชอบ ทำให้นาย ค ต้องฟ้องเรียกค่าเสียหายจากหน่วยงานของรัฐ ตามแนวฎีกาที่ 37/2560 คดีนี้เป็นคดีประเภทใด","o":["คดีพิพาทเกี่ยวกับคำสั่งทางปกครอง ตามมาตรา 9 (1)","คดีพิพาทเกี่ยวกับสัญญาทางปกครอง ตามมาตรา 9 (4)","คดีละเมิด ตามมาตรา 9 (3) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","คดีละเมิดซึ่งอยู่ในอำนาจศาลยุติธรรม"],"a":[2]},
{"q":"คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของพระราชกฤษฎีกาที่คณะรัฐมนตรีออกโดยอาศัยอำนาจตามกฎหมาย ตามแนวฎีกาที่ 44/2560 ศาลใดมีอำนาจพิจารณาพิพากษา","o":["ศาลปกครองชั้นต้น","ศาลปกครองสูงสุด","ศาลยุติธรรม","ศาลรัฐธรรมนูญ"],"a":[1]},
{"q":"ตามมาตรา 11 แห่ง พ.ร.บ.จัดตั้งศาลปกครองและวิธีพิจารณาคดีปกครอง พ.ศ. 2542 คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของกฎประเภทใดที่ศาลปกครองสูงสุดมีอำนาจพิพากษาได้โดยตรง","o":["กฎกระทรวงที่รัฐมนตรีออกโดยลำพัง","พระราชกฤษฎีกาหรือกฎที่คณะรัฐมนตรีออก","ข้อบัญญัติท้องถิ่นขององค์การบริหารส่วนตำบล","ระเบียบภายในของหน่วยงานซึ่งไม่มีผลต่อบุคคลภายนอก"],"a":[1]},
{"q":"ตามหลักทั่วไปของการพิจารณาทางปกครอง ก่อนที่เจ้าหน้าที่จะออกคำสั่งทางปกครองที่กระทบสิทธิของคู่กรณี เจ้าหน้าที่ต้องปฏิบัติอย่างไร","o":["ต้องให้คู่กรณีได้ทราบข้อเท็จจริงและโต้แย้งแสดงพยานหลักฐานของตนก่อน","ต้องขออนุญาตศาลปกครองก่อนทุกครั้ง","ต้องรอให้คู่กรณีอุทธรณ์ก่อน","ไม่ต้องปฏิบัติอะไร เพราะเจ้าหน้าที่มีอำนาจเด็ดขาด"],"a":[0]},
{"q":"ข้อยกเว้นของหลักฟังความสองฝ่ายตามข้อ 13 คือข้อใด","o":["กรณีมีความจำเป็นรีบด่วน หรือเป็นประโยชน์สาธารณะ หรือมีกฎหมายเฉพาะกำหนดไว้","กรณีคู่กรณีเป็นนิติบุคคล","กรณีคำสั่งมีมูลค่าไม่เกินหนึ่งแสนบาท","ไม่มีข้อยกเว้นใด ๆ เลย"],"a":[0]},

{"q":"คำสั่งทางปกครองที่ให้ประโยชน์แก่คู่กรณี (เช่น ใบอนุญาต) ต่อมาปรากฏว่าออกโดยไม่ชอบด้วยกฎหมาย เมื่อเจ้าหน้าที่จะเพิกถอนคำสั่งดังกล่าว ต้องคำนึงถึงสิ่งใด","o":["ความเชื่อโดยสุจริตของผู้รับประโยชน์กับประโยชน์สาธารณะ และอาจให้ค่าทดแทนความเสียหายได้","ความประสงค์ของผู้บังคับบัญชาเท่านั้น","จำนวนผู้ได้รับผลกระทบเท่านั้น","ไม่ต้องคำนึงถึงสิ่งใด เพราะคำสั่งไม่ชอบด้วยกฎหมายต้องเพิกถอนเสมอ"],"a":[0]},
{"q":"การที่ศาลปกครองตรวจสอบความชอบด้วยกฎหมายของคำสั่งเพิกถอน น.ส.3 ก. ตามแนวฎีกาที่ 43/2562 แสดงว่าคำสั่งดังกล่าวเข้าลักษณะ \"คำสั่งทางปกครอง\" ตามมาตรา 5 แห่ง พ.ร.บ.วิธีปฏิบัติราชการทางปกครองฯ เพราะเหตุใด","o":["เป็นการใช้อำนาจตามกฎหมายของเจ้าหน้าที่ที่มีผลกระทบต่อสิทธิหรือหน้าที่ของบุคคล","เป็นการกระทำระหว่างเอกชนกับเอกชน","เป็นการออกกฎที่มีผลใช้บังคับเป็นการทั่วไป","เป็นการใช้อำนาจของฝ่ายนิติบัญญัติ"],"a":[0]},
{"q":"ตาม พ.ร.บ.ความรับผิดทางละเมิดของเจ้าหน้าที่ พ.ศ. 2539 เมื่อเจ้าหน้าที่กระทำละเมิดในการปฏิบัติหน้าที่ ผู้เสียหายฟ้องร้องได้อย่างไร","o":["ฟ้องเจ้าหน้าที่ผู้กระทำละเมิดโดยตรง","ฟ้องหน่วยงานของรัฐที่เจ้าหน้าที่สังกัดได้โดยตรง แต่ฟ้องเจ้าหน้าที่ไม่ได้","ฟ้องได้ทั้งหน่วยงานและเจ้าหน้าที่ในคดีเดียวกันเสมอ","ฟ้องได้เฉพาะเมื่อรัฐมนตรีว่าการกระทรวงอนุญาต"],"a":[1]},
{"q":"หน่วยงานของรัฐจะไล่เบี้ยจากเจ้าหน้าที่ผู้กระทำละเมิดได้ เฉพาะในกรณีใด","o":["ทุกกรณีที่เจ้าหน้าที่กระทำละเมิดในการปฏิบัติหน้าที่","กรณีเจ้าหน้าที่จงใจหรือประมาทเลินเล่ออย่างร้ายแรง","กรณีประมาทเลินเล่อเล็กน้อยเท่านั้น","กรณีเจ้าหน้าที่กระทำละเมิดนอกเวลาราชการ"],"a":[1]},
{"q":"นาย ง ถูกหน่วยงานของรัฐออกคำสั่งทางปกครองที่กระทบสิทธิของตน ตามหลักทั่วไป นาย ง จะฟ้องคดีต่อศาลปกครองได้ต้องดำเนินการอย่างไร","o":["ฟ้องได้ทันทีโดยไม่ต้องดำเนินการใดก่อน","ต้องยื่นอุทธรณ์หรือดำเนินการตามขั้นตอนทางปกครองที่กฎหมายกำหนดก่อน จึงจะฟ้องได้","ต้องให้สมาชิกสภาผู้แทนราษฎรฟ้องแทน","ต้องยื่นเรื่องต่อศาลรัฐธรรมนูญก่อนเสมอ"],"a":[1]}
