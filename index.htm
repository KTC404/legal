อกสู่ทางสาธารณะแล้วเป็นสี่เลนก็ตาม และจะมีการตกลงกันให้ปิดกั้น ไม่อาจบังคับได้","ปิดถนนได้ เนื่องจากสภาพการใช้ถนนสาธารณะสิ้นสุดลง เพราะมีการใช้ถนนสี่เลนแทนแล้ว ไม่จำเป็นต้องหาเหตุผลใดมาอ้างอีก","ปิดถนนที่ภรรยากับนายหล่อยกให้ได้ เนื่องจากต่อมามีการตกลงกันแล้วว่าจะไม่ให้เป็นสาธารณะกับบุตรของนายหล่อ"],"a":[1]},{"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับ อัลพราโซแลม หรือที่เรียกว่ายาเสียสาว","o":["ยาเสพติดประเภท 1","ยาเสพติดประเภท 2","วัตถุออกฤทธิ์ในประเภท 1","วัตถุออกฤทธิ์ประเภท 2"],"a":[3]},{"q":"ในขณะที่นายเอกกำลังเดินเล่นเพื่อเลือกซื้อของภายในงานวัด นายเอกพบกับนายโท ซึ่งเป็นคู่อริโดยบังเอิญ นายเอกวิ่งไปชกที่ใบหน้านายโท ทำให้คิ้วนายโทแตก หลังจากที่นายเอกทำร้ายนายโทแล้ว นายเอกวิ่งหนี นายโทวิ่งไล่ตามนายเอกทัน นายโทจึงใช้อาวุธปืนจ้องเล็งนายเอกที่ศีรษะ หมายจะเอาชีวิต แต่ปรากฏว่ากระสุนถูกบริเวณหัวไหล่ซ้ายของนายเอก เป็นเหตุให้นายเอกได้รับบาดเจ็บ ต้องรักษาตัวประมาณ 23 วัน จากข้อเท็จจริง นายโทต้องรับผิดต่อนายเอกหรือไม่ อย่างไร","o":["นายโทมีความผิดฐานทำร้ายร่างกายเป็นเหตุให้ผู้อื่นได้รับอันตรายสาหัส","นายโทมีความผิดฐานทำร้ายร่างกายเป็นเหตุให้ผู้อื่นได้รับอันตรายแก่กาย จิตใจ","นายโทมีความผิดฐานพยายามฆ่าผู้อื่นโดยบันดาลโทสะ","นายโทไม่มีความผิดเนื่องจากเป็นการป้องกันตน"],"a":[2]}]},{"id":6,"title":"ชุดที่ 6","sub":"รอบคัดเลือกภาค 6","level":"มัธยมศึกษา","main":[{"q":"นายโปรดกับนายปรานเป็นพี่น้องร่วมบิดามารดาเดียวกัน ทั้งสองได้รับมรดกเป็นที่ดินโฉนดเลขที่ 1713 จากมารดาโดยถือกรรมสิทธิ์ร่วมกัน นายโปรดอยู่กินฉันสามีภรรยากับนางสาวจงจิต โดยไม่ได้จดทะเบียนสมรสและไม่มีบุตรด้วยกัน แต่นายโปรดจดทะเบียนรับนางสาวปลื้มใจเป็นบุตรบุญธรรม ต่อมานายโปรดถึงแก่ความตายโดยไม่ได้ทำพินัยกรรม ทรัพย์มรดกมีเพียงที่ดินโฉนดเลขที่ 1713 บุคคลใดไม่มีสิทธิยื่นคำร้องต่อศาลขอให้ตั้งผู้จัดการมรดกของนายโปรด","o":["นายปราน","นางสาวจงจิต","นางสาวปลื้มใจ","พนักงานอัยการ"],"a":[1]},{"q":"ญาญ่าเช่าบ้านของณเดชน์ โดยทำสัญญาเป็นหนังสือ มีกำหนด 1 ปี ตกลงชำระค่าเช่าเป็นรายเดือน เดือนละ 6,000 บาท หลังทำสัญญาเช่าไปได้ 2 เดือน ญาญ่าไม่ชำระค่าเช่า ณเดชน์จะฟ้องร้องดำเนินคดีกับญาญ่าได้หรือไม่ เพราะเหตุใด","o":["ฟ้องได้ทันที เนื่องจากผู้เช่าผิดสัญญาไม่ชำระค่าเช่า","ฟ้องไม่ได้ เนื่องจากสัญญาเช่าอสังหาริมทรัพย์มิได้จดทะเบียนต่อพนักงานเจ้าหน้าที่","ฟ้องไม่ได้ เนื่องจากสัญญาเช่ามีกำหนดชำระค่าเช่าเป็นรายเดือน ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งต้องไม่น้อยกว่า 15 วัน","ฟ้องไม่ได้ เนื่องจากสัญญาเช่ามีกำหนดชำระค่าเช่าเป็นรายเดือน ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งต้องไม่น้อยกว่า 30 วัน"],"a":[2]},{"q":"การหมั้นจะกระทำได้เมื่อบุคคลมีอายุเท่าไหร่","o":["ฝ่ายชายและฝ่ายหญิงมีอายุ 17 ปีบริบูรณ์แล้ว","ฝ่ายชายและฝ่ายหญิงมีอายุ 18 ปีบริบูรณ์แล้ว","บุคคลทั้งสองฝ่ายมีอายุ 17 ปีบริบูรณ์แล้ว","บุคคลทั้งสองฝ่ายมีอายุ 18 ปีบริบูรณ์แล้ว"],"a":[3]},{"q":"ข้อใดไม่ใช่ทรัพยสิทธิ","o":["สิทธิเหนือพื้นดิน","สิทธิอาศัย","สิทธิตามสัญญาจะซื้อจะขาย","สิทธิเก็บกิน"],"a":[2]},{"q":"ข้อใดไม่ใช่ความผิดอันยอมความได้","o":["ความผิดฐานกรรโชก ตามประมวลกฎหมายอาญา มาตรา 337","ความผิดฐานฉ้อโกง ตามประมวลกฎหมายอาญา มาตรา 341","ความผิดฐานยักยอก ตามประมวลกฎหมายอาญา มาตรา 352","ความผิดฐานทำให้เสียทรัพย์ ตามประมวลกฎหมายอาญา มาตรา 358"],"a":[0]},{"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับความผิดลหุโทษ","o":["ความผิดลหุโทษ คือ ความผิดที่มีระวางโทษจำคุกไม่เกิน 1 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับ","ความผิดลหุโทษเป็นความผิดอันยอมความได้","ผู้ใดพยายามกระทำความผิดลหุโทษ ผู้นั้นไม่ต้องรับโทษ","ผู้สนับสนุนในความผิดลหุโทษ ไม่ต้องรับโทษ"],"a":[1]},{"q":"การกระทำความผิดครั้งหลังในข้อใดต่อไปนี้ ศาลรอการลงโทษให้ไม่ได้","o":["จำเลยกระทำความผิดฐานเสพแอมเฟตามีน ศาลพิพากษาจำคุก 6 เดือน แต่รอการลงโทษไว้ 2 ปี 5 ปี ต่อมาจำเลยกลับมากระทำความผิดซ้ำในฐานเดิมอีก ศาลพิพากษาจำคุก 6 เดือน","จำเลยกระทำความผิดฐานยักยอกทรัพย์ ศาลพิพากษาจำคุก 1 ปี ไม่รอการลงโทษ 3 ปีต่อมา จำเลยกระทำความผิดฐานลักทรัพย์อีก ศาลพิพากษาจำคุก 2 ปี","จำเลยกระทำความผิดฐานประมาทเป็นเหตุให้ผู้อื่นถึงแก่ความตาย ศาลพิพากษาจำคุก 2 ปี ไม่รอการลงโทษ 5 ปีต่อมาจำเลยกลับมากระทำความผิดฐานมีแอมเฟตามีนไว้ในครอบครอง ศาลพิพากษาจำคุก 5 ปี","จำเลยกระทำความผิดฐานพาอาวุธไปในเมืองหมู่บ้านหรือทางสาธารณะ ศาลพิพากษาปรับ 500 บาท หนึ่งเดือนต่อมาจำเลยกลับมากระทำความผิดฐานชิงทรัพย์และศาลพิพากษาจำคุก 5 ปี"],"a":[1]},{"q":"จำเลยส่งข้อความผ่านทางระบบอินเทอร์เน็ตถึงโจทก์หลายครั้ง ขู่เข็ญโจทก์ให้จ่ายเงินให้จำเลย มิเช่นนั้นจะเปิดเผยความลับรูปภาพและวิดีโอที่โจทก์ไปมีความสัมพันธ์ทางเพศกับชายอื่น ในขณะที่ยังไม่ได้หย่าขาดจากจำเลย โจทก์จึงยอมจ่ายเงินให้ไปดังนี้ การกระทำของจำเลยเป็นความผิดฐานใด","o":["กรรโชก","รีดเอาทรัพย์","ชิงทรัพย์","ลักทรัพย์โดยใช้กลอุบาย"],"a":[1]},{"q":"ข้อใดไม่ใช่ยุทธศาสตร์ศาลยุติธรรม พ.ศ. 2569 - 2572","o":["การอำนวยความยุติธรรมถูกต้องเป็นธรรม อย่างรวดเร็ว","นวัตกรรมสมัยใหม่ ทุกคนเข้าถึงได้อย่างเสมอภาค","การพัฒนาที่ยั่งยืน เพื่อความเชื่อถือในระดับสากล","ความเชื่อมั่นและศรัทธาของประชาชน"],"a":[2]},{"q":"คดีใดต่อไปนี้ ได้รับการยกเว้นไม่ต้องชำระค่าขึ้นศาลและค่าฤชาธรรมเนียมในการยื่นคำฟ้องหรือคำร้อง ตลอดจนการดำเนินกระบวนพิจารณาต่าง ๆ","o":["ฟ้องแบ่งสินสมรส, ฟ้องเรียกค่าอุปการะเลี้ยงดู","ฟ้องเรียกค่าอุปการะเลี้ยงดู, ฟ้องเรียกค่าเลี้ยงชีพ","ฟ้องเรียกค่าเลี้ยงชีพ, ร้องขอรับรองบุตร","ร้องขอให้เป็นคนไร้ความสามารถ, ฟ้องเรียกค่าอุปการะเลี้ยงดู"],"a":[1]},{"q":"คดีใดของศาลเยาวชนและครอบครัว ที่หากคู่ความไม่ประสงค์ให้มีผู้พิพากษาสมทบร่วมเป็นองค์คณะ ก็ไม่จำเป็นต้องมีผู้พิพากษาสมทบร่วมเป็นองค์คณะพิจารณาคดีก็ได้","o":["คดีอาญาที่มีข้อหาว่าเด็กและเยาวชนกระทำความผิด","คดีฟ้องแบ่งสินสมรส","คดีฟ้องหย่าและเรียกค่าอุปการะเลี้ยงดูบุตรผู้เยาว์","คดีร้องขอตั้งผู้ปกครองของผู้เยาว์"],"a":[1]},{"q":"ข้อใดไม่ใช่งานราชการและพระกรณียกิจของพระองค์เจ้ารพีพัฒนศักดิ์ฯ","o":["ทรงเป็นเนติบัณฑิตไทยคนแรก","ทรงสถาปนาโรงเรียนสอนกฎหมาย","ทรงช่วยร่างประมวลกฎหมายของไทยฉบับแรก","ทรงเป็นเสนาบดีกระทรวงยุติธรรม"],"a":[0]},{"q":"พระเจ้าบรมวงศ์เธอพระองค์เจ้ารพีพัฒนศักดิ์ฯ ทรงเข้าเป็นกรรมการตรวจตัดสินความฎีกาในคณะกรรมการชื่อว่า “ศาลกรรมการฎีกา” ในปีใด","o":["พ.ศ. 2440","พ.ศ. 2441","พ.ศ. 2442","พ.ศ. 2443"],"a":[1]},{"q":"นาย ก. และนาย ข. ร่วมกันรับเมทแอมเฟตามีน จำนวน 2,000 เม็ด จากบุคคลอื่นมาเก็บรักษาไว้ โดยมีข้อตกลงว่าจะนำเมทแอมเฟตามีนดังกล่าวออกจำหน่ายให้แก่ลูกค้ารายย่อยในภายหลัง ทั้งสองได้แบ่งเมทแอมเฟตามีนออกเป็นถุงย่อยพร้อมระบุราคาจำหน่ายไว้ และจัดทำบัญชีรายชื่อลูกค้าไว้ในโทรศัพท์มือถือ แต่ก่อนที่จะมีการส่งมอบเมทแอมเฟตามีนให้แก่บุคคลใด เจ้าพนักงานตำรวจได้เข้าจับกุมบุคคลทั้งสองและตรวจยึดเมทแอมเฟตามีนทั้งหมดไว้ได้ภายใต้ประมวลกฎหมายยาเสพติด พ.ศ. 2564 ข้อใดถูกต้องที่สุด","o":["นาย ก. และนาย ข. มีความผิดเพียงฐานมีเมทแอมเฟตามีนไว้ในครอบครองเพื่อจำหน่าย เนื่องจากยังไม่มีการส่งมอบยาเสพติดให้แก่บุคคลอื่น","นาย ก. และนาย ข. มีความผิดฐานจำหน่ายเมทแอมเฟตามีนแล้ว เนื่องจากประมวลกฎหมายยาเสพติดกำหนดให้คำว่า \"จำหน่าย\" หมายความรวมถึง \"มีไว้เพื่อจำหน่าย\" ด้วย","นาย ก. และนาย ข. มีความผิดฐานมีเมทแอมเฟตามีนไว้ในครอบครองเพื่อจำหน่าย และมีความผิดฐานจำหน่ายเมทแอมเฟตามีนอีกฐานหนึ่ง เป็นความผิดสองกรรมต่างกันต่างหากจากกัน","นาย ก. และนาย ข. ยังไม่มีความผิดฐานจำหน่ายเมทแอมเฟตามีน เพราะการจำหน่ายจะสมบูรณ์ต่อเมื่อมีการส่งมอบยาเสพติดให้แก่บุคคลอื่นแล้วเท่านั้น"],"a":[1]},{"q":"ประมวลกฎหมายยาเสพติด มีผลบังคับใช้ตั้งแต่เมื่อใด","o":["9 ธันวาคม 2564","1 มกราคม 2564","7 สิงหาคม 2564","8 พฤศจิกายน 2564"],"a":[0]}],"reserve":[{"q":"กรณีใดที่ผู้ให้ไม่สามารถเรียกถอนคืนการให้เพราะเหตุผู้รับประพฤติเนรคุณ","o":["ทำให้ผู้ให้เสียชื่อเสียง หรือหมิ่นประมาทผู้ให้ อย่างร้ายแรง","บอกปัดไม่ยอมให้สิ่งของจำเป็นเลี้ยงชีวิตแก่ผู้ให้ในเวลาที่ผู้ให้ยากไร้และผู้รับยังสามารถจะให้ได้","ประทุษร้ายต่อผู้ให้เป็นความผิดฐานอาญาอย่างร้ายแรงตามประมวลกฎหมายอาญา","ให้เป็นบำเหน็จสินจ้างโดยแท้"],"a":[3]},{"q":"กรณีที่ผู้เยาว์อายุ 19 ปี เข้าไปในเคหสถานของเด็กอายุ 14 ปี โดยได้รับความยินยอมจากเด็ก แต่ไม่ได้ขออนุญาตจากบิดามารดาหรือผู้ปกครอง และมีการกระทำที่ล่วงละเมิดทางเพศเกิดขึ้นภายในบ้านนั้น เมื่อมารดาของเด็กมาพบและแจ้งความดำเนินคดีในข้อหาพรากเด็กไปเพื่อการอนาจาร การกระทำดังกล่าวจะเป็นความผิดตามกฎหมายอาญาหรือไม่","o":["มีความผิดฐานพรากเด็ก ตามประมวลกฎหมายอาญา มาตรา 317","มีความผิดฐานพรากผู้เยาว์ ตามประมวลกฎหมายอาญา มาตรา 318","ไม่มีความผิดฐานพรากเด็ก เนื่องจากเด็กยินยอม","ไม่มีความผิด เนื่องจากเป็นการกระทำภายในบ้านของเด็กเอง"],"a":[2]},{"q":"อนันต์ดึงเอาสลากกินแบ่งรัฐบาลที่ยังไม่ได้ตรวจไปจากมือของจิตตรีโดยไม่ได้รับอนุญาต แต่จิตตรีก็ยินยอมปล่อยให้อนันต์นำสลากกินแบ่งรัฐบาลของจิตตรีไปตรวจ โดยอนันต์ไม่ได้หลบหนี ต่อมาเมื่ออนันต์ได้รับสลากกินแบ่งรัฐบาลจากจิตตรีไปครอบครองแล้ว อนันต์กลับเอาสลากกินแบ่งรัฐบาลของจิตตรีไป พอจิตตรีทวงถามก็ไม่ยอมคืนให้ การกระทำของอนันต์มีความผิดอาญาฐานใด","o":["ฐานวิ่งราวทรัพย์","ฐานลักทรัพย์","ฐานยักยอก","ฐานฉ้อโกง"],"a":[2]},{"q":"ข้อใดมิใช่วิธีการเพื่อความปลอดภัยตามประมวลกฎหมายอาญา","o":["คุมตัวไว้ในสถานพยาบาล","เรียกประกันทัณฑ์บน","ห้ามประกอบอาชีพบางอย่าง","ติดอุปกรณ์อิเล็กทรอนิกส์ (EM)"],"a":[3]},{"q":"ข้อใดไม่อยู่ในอำนาจพิจารณาพิพากษาคดีของศาลเยาวชนและครอบครัว","o":["นายเอ อายุ 17 ปี ก่อเหตุลักทรัพย์นางบี แล้วหลบหนีไป ต่อมาถูกจับตัวได้ในขณะอายุ 25 ปี","นายซี อายุ 25 ปี ก่อเหตุทำร้ายร่างกายนายดี พ่อแท้ ๆ ของตัวเอง จนได้รับบาดเจ็บสาหัสปางตาย","นางสาวอี อายุ 15 ปี ถูกอดีตแฟนหนุ่มอายุ 19 ปี ของตนแอบนำภาพเปลือยของตนไปโพสต์ในโซเชียลมีเดีย จึงต้องการยื่นคำร้องต่อศาลเพื่อระงับการแพร่หลายและนำภาพเปลือยของตนออกจากระบบคอมพิวเตอร์","นายเอฟ ฟ้องนางจีกับนายเค ขอให้เพิกถอนการขายที่ดินระหว่างนางจีกับนายเค โดยที่ดินแปลงดังกล่าวเป็นที่ดินที่นางจีซื้อมาเองเพียงลำพังด้วยเงินส่วนตัวในระหว่างที่สมรสกับนายเอฟ"],"a":[2]}]},{"id":8,"title":"ชุดที่ 8","sub":"รอบคัดเลือกภาค 8","level":"มัธยมศึกษา","main":[{"q":"นายสมชายซึ่งเป็นทายาทของผู้ตายต้องถูกกำจัดมิให้ได้รับมรดกในกรณีใด","o":["สมชายเป็นผู้จัดการมรดกของผู้ตาย จดทะเบียนโอนกรรมสิทธิ์ที่ดินของผู้ตายเป็นของตนเอง โดยไม่แบ่งให้ทายาทอื่น แล้วนำที่ดินไปจดทะเบียนจำนองประกันหนี้ภรรยาของตนเองไว้กับธนาคาร","สมชายครอบครองที่ดินพิพาท ซึ่งเป็นที่ดินไม่มีเอกสารสิทธิ์ในฐานะทายาทของผู้ตาย สมชายขายที่ดินส่วนหนึ่งให้แก่บุคคลอื่น ต่อมาผู้ตายทำพินัยกรรมยกที่ดินพิพาทให้แก่สมชาย","สมชายต้องคำพิพากษาของศาลจังหวัดสุราษฎร์ธานีให้จำคุก 10 ปี ฐานพยายามฆ่าผู้ตายเจ้ามรดก","สมชายรู้ว่าสมพรบุตรของตนฆ่าผู้ตายเจ้ามรดกแต่ปิดบังข้อเท็จจริงไว้ไม่ให้ใครรู้"],"a":[0]},{"q":"นายพลมีบ้านและพักอาศัยยังที่อยู่ตามทะเบียนบ้านที่จังหวัดสุราษฎร์ธานี แต่ก็ไป ๆ มา ๆ กับบ้านของตนอีก 1 หลัง ที่จังหวัดนครศรีธรรมราช และบ้านภริยาที่จังหวัดชุมพร ต่อมานายพล ถูกจำคุกในระหว่างพิจารณาคดีอาญาที่เรือนจำจังหวัดภูเก็ต ข้อใดต่อไปนี้ ไม่ถูกต้องเกี่ยวกับภูมิลำเนาของนายพล","o":["บ้านที่จังหวัดสุราษฎร์ธานีและจังหวัดชุมพร","บ้านที่จังหวัดสุราษฎร์ธานีและเรือนจำจังหวัดภูเก็ต","บ้านที่จังหวัดนครศรีธรรมราชและจังหวัดชุมพร","บ้านที่จังหวัดนครศรีธรรมราชและจังหวัดสุราษฎร์ธานี"],"a":[1]},{"q":"นายสมบูรณ์และนางสมศรีเป็นสามีภรรยาโดยจดทะเบียนโดยชอบด้วยกฎหมาย อยากทราบว่าการจัดการสินสมรสใด ดังต่อไปนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งสามารถจัดการได้ โดยไม่ต้องได้รับความยินยอมจากอีกฝ่ายหนึ่ง","o":["สมบูรณ์กู้ยืมเงินจากธนาคาร 10,000,000 บาท แล้วจดทะเบียนจำนองที่ดินสินสมรสเป็นประกัน","สมศรีให้เช่ารถยนต์ซึ่งเป็นสินสมรสเป็นเวลา 4 ปี ต่อมาสมศรีฟ้องคดีเรียกรถคืนจากผู้เช่าแล้วทำสัญญาประนีประนอมยอมความกัน","สมบูรณ์ฟ้องขับไล่ผู้บุกรุกที่ดินสินสมรส ต่อมาถอนฟ้องไปโดยยอมให้เงินค่าขนย้ายส่วนหนึ่งแก่จำเลยผู้บุกรุก","สมศรีนำที่ดินสินสมรสไปเป็นหลักทรัพย์ประกันตัวบิดาของตนที่ถูกดำเนินคดีอาญาต่อนักงานสอบสวน"],"a":[2]},{"q":"จำเลยกู้ยืมเงินโจทก์ 20,000 บาท โดยจำเลยตกลงเสียดอกเบี้ยร้อยละ 10 ต่อเดือน และรับเงินกู้เพียง 16,000 บาท เนื่องจากโจทก์หักไว้เป็นค่าดอกเบี้ยล่วงหน้า 2 เดือน และให้จำเลยเขียนสัญญากู้ว่าจำเลยกู้เงินโจทก์ 160,000 บาท ดังนี้ โจทก์จะนำสัญญากู้ดังกล่าวฟ้องให้จำเลยรับผิดได้หรือไม่ เพียงใด","o":["ฟ้องไม่ได้ เนื่องจากเป็นเอกสารปลอม","ฟ้องได้ แต่จำเลยต้องรับผิดเพียง 16,000 บาท เท่าที่ได้รับไป","ฟ้องไม่ได้ เนื่องจากเรียกดอกเบี้ยในอัตราเกินกว่าที่กฎหมายกำหนดเป็นโมฆะ ทำให้สัญญากู้เป็นโมฆะไปทั้งฉบับ","ฟ้องได้ แต่จำเลยต้องรับผิดในต้นเงิน 20,000 บาท พร้อมดอกเบี้ยตามกฎหมาย"],"a":[3]},{"q":"ผู้ตระเตรียมการเพื่อกระทำความผิดฐานใด ต้องระวางโทษเช่นเดียวกับการกระทำความผิดฐานพยายาม","o":["วางเพลิงเผาทรัพย์ผู้อื่น","ข่มขืนกระทำชำเรา","ฆ่าผู้อื่น","ปลอมเอกสารสิทธิหรือเอกสารราชการ"],"a":[0]},{"q":"ข้อใดไม่ถูกต้อง","o":["ในการเพิ่มโทษ มิให้เพิ่มขึ้นถึงประหารชีวิต จำคุกตลอดชีวิต หรือจำคุกเกินห้าสิบปี","ในการลดโทษประหารชีวิต ถ้าจะลดโทษกึ่งหนึ่ง ให้ลดเป็นโทษจำคุกตลอดชีวิตหรือโทษจำคุกตั้งแต่ยี่สิบห้าปีถึงห้าสิบปี","ในการลดโทษจำคุกตลอดชีวิต ให้เปลี่ยนโทษจำคุกตลอดชีวิตเป็นโทษจำคุกห้าสิบปี","ถ้าโทษจำคุกที่ผู้กระทำผิดจะต้องรับมีกำหนดเวลาไม่เกินสามเดือน ศาลจะกำหนดโทษให้น้อยลงอีกไม่ได้"],"a":[1]},{"q":"นาย ก. เป็นฝ่ายก่อเหตุภายในบ้านของนาย ข. และพวก แล้วนาย ก. ไปเอาอาวุธปืนที่บ้านย้อนกลับไปที่บ้านเกิดเหตุซึ่งมีนาย ข. นาย ค. และนาย ง. กับพวกอีกหลายคนหลบอยู่อยู่ภายในบ้าน นาย ก. ยิงปืนไปที่บริเวณบ้าน 4 นัด กระสุนปืน 1 นัด ถูกที่เสาหน้าบ้าน สูงจากพื้นประมาณ 125 เซนติเมตร อีก 1 นัด ถูกที่ตู้ใส่ของสูงจากพื้นประมาณ 35 เซนติเมตรและนาย ข. มีบาดแผลถูกของมีคมบริเวณแขนทั้งสองข้าง มีเลือดออก ซิบๆ เนื่องจากถูกกระจกกระเด็นใส่ นาย ก. มีความผิดฐานใดหรือไม่","o":["มีความผิดฐานทำร้ายร่างกายนาย ข. ตามประมวลกฎหมายอาญา มาตรา 295","มีความผิดฐานพยายามฆ่าผู้อื่นตามประมวลกฎหมายอาญา มาตรา 288 ประกอบมาตรา 80","มีความผิดฐานกระทำโดยประมาทเป็นเหตุให้นาย ข. ได้รับอันตรายแก่กายหรือจิตใจตามประมวลกฎหมายอาญา มาตรา 390","มีความผิดฐานทำร้ายร่างกายผู้อื่น ไม่ถึงกับเป็นเหตุให้เกิดอันตรายแก่กายหรือจิตใจ ตามประมวลกฎหมายอาญา มาตรา 391"],"a":[1]},{"q":"ข้อใด ไม่ถูกต้อง","o":["เด็กอายุไม่เกิน 10 ปี กระทำความผิด ไม่ต้องรับโทษ","เด็กอายุไม่เกิน 12 ปี กระทำความผิดไม่ต้องรับโทษ แต่ศาลมีอำนาจใช้วิธีการสำหรับเด็ก","บุคคลอายุกว่า 15 ปี แต่ต่ำกว่า 18 ปี กระทำความผิด อยู่ในดุลพินิจของศาลว่าสมควรจะพิพากษาลงโทษหรือไม่ โดยพิจารณาถึงความรู้สึกผิดชอบและสิ่งอื่นทั้งปวง","บุคคลอายุ 18 ปี แต่ยังไม่เกิน 20 ปี กระทำความผิดศาลต้องลดมาตราส่วนโทษให้หนึ่งในสามหรือกึ่งหนึ่ง"],"a":[1,3]},{"q":"ศาลฎีกามีรองประธานศาลฎีกากี่ท่าน มีประธานแผนกในศาลฎีกากี่ท่าน","o":["มีรองประธานศาลฎีกา 5 ท่าน มีประธานแผนก 11 ท่าน","มีรองประธานศาลฎีกา 5 ท่าน มีประธานแผนก 12 ท่าน","มีรองประธานศาลฎีกา 6 ท่าน มีประธานแผนก 12 ท่าน","มีรองประธานศาลฎีกา 6 ท่าน มีประธานแผนก 12 ท่าน *(ตัวเลือกซ้ำกับ ค ในต้นฉบับ)*"],"a":[2]},{"q":"ข้อใดกล่าวถึงแผนกคดีในศาลอุทธรณ์ภาค ไม่ถูกต้อง","o":["แผนกคดีเลือกตั้ง","แผนกคดีค้ามนุษย์","แผนกคดีผู้บริโภค","แผนกคดีสิ่งแวดล้อม"],"a":[1]},{"q":"กรณีมีปัญหาว่าคดีใดจะอยู่ในอำนาจของศาลเยาวชนและครอบครัวหรือไม่ ใครมีอำนาจวินิจฉัย","o":["อธิบดีผู้พิพากษาศาลเยาวชนและครอบครัวกลาง","ประธานศาลอุทธรณ์","ประธานศาลอุทธรณ์คดีชำนัญพิเศษ","ประธานศาลฎีกา"],"a":[2]},{"q":"พระองค์เจ้ารพีพัฒนศักดิ์เมื่อแรกได้รับแต่งตั้งเป็นเสนาบดีกระทรวงยุติธรรมมีบุคคลใดเป็นผู้กำกับดูแล","o":["กรมหลวงดำรงราชานุภาพ","เจ้าพระยาอภัยราชา","เจ้าพระยายมราช","กรมพระจันทบุรีนฤนาถ"],"a":[1]},{"q":"กรมหลวงราชบุรีดิเรกฤทธิ์มีพระดำริว่า “อำนาจพิจารณาพิพากษาคดีอยู่ใต้คอุ้มมือฝ่ายธุรการนั้น ใช้ไม่ได้ มีแต่จะเกิดภัยขึ้นเสมอ” เป็นที่มาของการปรับปรุงกิจการศาลในด้านใด","o":["ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายทหาร","ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายการเมือง","ความเป็นอิสระโดยไม่ถูกแทรกแซงจากฝ่ายบริหาร","ความเป็นอิสระจากสิทธิสภาพนอกอาณาเขต"],"a":[2]},{"q":"บุคคลดังต่อไปนี้ข้อใด ไม่ใช่ \"คณะกรรมการป้องกันและปราบปรามยาเสพติด\" เรียกโดยย่อว่า “คณะกรรมการ ป.ป.ส.” โดยตำแหน่งตามประมวลกฎหมายยาเสพติด มาตรา 4","o":["เลขาธิการสำนักงานศาลยุติธรรม","เลขาธิการคณะกรรมการอาชีวศึกษา","ปลัดกระทรวงกลาโหม","ปลัดกระทรวงแรงงาน"],"a":[2]},{"q":"ขณะเกิดเหตุความผิด จำเลยต้องด้วยบทกำหนดโทษตาม พ.ร.บ.ยาเสพติดให้โทษ พ.ศ.2522 มาตรา 66 วรรคสาม แต่ในระหว่างพิจารณาของศาลชั้นต้น ได้มีประมวลกฎหมายยาเสพติดออกมาใช้บังคับแทนกฎหมายเดิม และศาลชั้นต้นปรับบทลงโทษจำเลยตามประมวลกฎหมายยาเสพติด มาตรา 145 วรรคสาม (2) ลงโทษประหารชีวิต และปรับ 1,000,000 บาท คดีถึงที่สุดแล้ว จำเลยใช้สิทธิยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ตามประมวลกฎหมายอาญา มาตรา 3 (1) ข้อใดถูกต้อง","o":["จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ได้ ผู้พิพากษาศาลจังหวัดนายเดียว พิจารณาคดีนี้แล้วมีคำสั่งยกคำร้องขอให้กำหนดโทษใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ได้ ผู้พิพากษาศาลจังหวัดครบองค์คณะ พิจารณาคดีนี้แล้วมีคำสั่งให้กำหนดโทษจำเลยใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ไม่ได้ ผู้พิพากษาศาลจังหวัดครบองค์คณะ พิจารณาคดีนี้แล้วมีคำสั่งยกคำร้องขอให้กำหนดโทษใหม่","จำเลยยื่นคำร้องขอให้ศาลชั้นต้นกำหนดโทษใหม่ไม่ได้ ผู้พิพากษาศาลจังหวัดนายเดียว พิจารณาคดีนี้แล้วมีคำสั่งไม่รับคำร้องขอให้กำหนดโทษใหม่"],"a":[2]}],"reserve":[{"q":"บทกำหนดโทษตามประมวลกฎหมายยาเสพติด คำกล่าวใดถูกต้องตามกฎหมาย","o":["ผู้เปิดบัญชีธนาคารยินยอมให้ใช้บัญชีดังกล่าวของตนรับโอนเงินโดยรู้ว่าเป็นค่ายาเสพติดแล้วโอนเงินต่อเข้าบัญชีผู้ค้ายา เป็นความผิดฐานเป็นผู้ยอมให้ผู้อื่นใช้บัญชีของตนเพื่อประโยชน์ต่อการกระทำความผิดร้ายแรงเกี่ยวกับยาเสพติด ตามประมวลกฎหมายยาเสพติด มาตรา 129","ผู้เปิดบัญชีธนาคารยินยอมให้ใช้บัญชีดังกล่าวของตนรับโอนเงินโดยรู้ว่าเป็นค่ายาเสพติดแล้วโอนเงินต่อเข้าบัญชีผู้ค้ายา เป็นความผิดฐานเป็นผู้สนับสนุนหรือช่วยเหลือผู้กระทำความผิด ต้องระวางโทษเช่นเดียวกับตัวการ ตามประมวลกฎหมายยาเสพติด มาตรา 125 วรรคหนึ่ง (1)","ผู้ใดพยายามกระทำความผิดร้ายแรงเกี่ยวกับยาเสพติด ต้องระวางโทษตามที่กำหนดไว้สำหรับความผิดนั้นเช่นเดียวกับตัวการ","ผู้ใดซ่อนเร้นช่วยเหลือ ให้ที่พำนัก เพื่อช่วยผู้กระทำความผิดร้ายแรงเกี่ยวกับยาเสพติดให้พ้นจากการจับกุม ต้องระวางโทษตามที่กำหนดไว้สำหรับความผิดนั้นเช่นเดียวกับผู้กระทำความผิดสำเร็จ"],"a":[1]},{"q":"ข้อใดไม่ถูกต้อง","o":["จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 1 ปี โทษจำคุกให้รอการลงโทษไว้ 2 ปี คดีหลังศาลพิพากษาลงโทษจำคุก 6 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี","จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 2 ปี แต่คดียังไม่ถึงที่สุด คดีหลังศาลพิพากษาลงโทษจำคุก 1 ปี โทษจำคุกให้รอการลงโทษไว้ 2 ปี","จำเลยกระทำความผิดคดีก่อนศาลพิพากษาลงโทษจำคุก 5 เดือน คดีหลังศาลพิพากษาลงโทษจำคุก 4 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี","จำเลยกระทำความผิดในคดีก่อนศาลพิพากษาลงโทษจำคุก 8 เดือน แต่ได้รับพระราชทานอภัยโทษลดโทษจำคุกจริง 5 เดือน คดีหลังศาลพิพากษาจำคุก 10 เดือน โทษจำคุกให้รอการลงโทษไว้ 1 ปี"],"a":[3]},{"q":"หน่วยงานใดในสำนักงานศาลยุติธรรม มีหน้าที่กำกับ ควบคุม ดูแล เกี่ยวกับ \"เจ้าพนักงานตำรวจศาล\"","o":["สำนักกิจการคดี","ศูนย์รักษาความปลอดภัย","สำนักการเจ้าหน้าที่","ศูนย์ควบคุมติดตามการปล่อยชั่วคราว"],"a":[1]},{"q":"คณะกรรมการตุลาการ (ก.ต.) และคณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในแต่ละชั้นศาลในสำนักงานศาลยุติธรรมมีกี่ท่าน","o":["คณะกรรมการตุลาการ (ก.ต.) ในศาลชั้นต้นมี 4 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในศาลชั้นต้นมี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในศาลชั้นต้นมี 2 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในศาลชั้นต้นมี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในชั้นศาลฎีกามี 4 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในชั้นศาลฎีกามี 4 คน","คณะกรรมการตุลาการ (ก.ต.) ในชั้นศาลฎีกามี 6 คน คณะกรรมการบริหารศาลยุติธรรม (ก.บ.ศ.) ในชั้นศาลฎีกามี 6 คน"],"a":[1]},{"q":"บุคคลใดไม่ใช่คณะกรรมการตรวจสอบทรัพย์สิน ตามประมวลกฎหมายยาเสพติด","o":["อธิบดีกรมบังคับคดี","อธิบดีกรมศุลกากร","อธิบดีกรมที่ดิน","อธิบดีกรมสรรพสามิต"],"a":[3]}]},{"id":9,"title":"ชุดที่ 9","sub":"รอบคัดเลือกภาค 9 (ปี 2567)","level":"ทั่วไป","main":[{"q":"สัญญาใดต่อไปนี้สามารถใช้บังคับกันได้","o":["สัญญาซื้อขายที่ดินภายในข้อกำหนดเวลาห้ามโอนตามกฎหมาย","สัญญาซื้อขายบ้านและที่ดิน โดยไม่มีเจตนาที่จะซื้อขายกันจริง แต่จดทะเบียนต่อพนักงานเจ้าหน้าที่","สัญญาซื้อขายที่ดินตามแบบแจ้งการครอบครองที่ดิน (ส.ค.1) โดยส่งมอบการครอบครองที่ดิน แต่ไม่ได้จดทะเบียนต่อพนักงานเจ้าหน้าที่","สัญญาซื้อขายที่ดินมีโฉนดที่ดิน โดยการส่งมอบการครอบครองที่ดิน แต่ไม่ได้จดทะเบียนต่อพนักงานเจ้าหน้าที่"],"a":[2]},{"q":"นายเอ เป็นสามีโดยชอบด้วยกฎหมายของนางบี ต่อมานายเอ สมคบกับนางบีโอนที่ดินซึ่งเป็นสินสมรสไปให้แก่นายซี อันเป็นการฉ้อฉลเจ้าหนี้ เพื่อไม่ให้นายดี เจ้าหนี้ส่วนตัวของนายเอฟ้องบังคับเอากับที่ดินดังกล่าว ต่อมานายดีได้มาฟ้องขอเพิกถอนการฉ้อฉลเจ้าหนี้ ข้อใดถูกต้องที่สุด","o":["นายดีไม่สามารถที่จะฟ้องขอเพิกถอนการฉ้อฉลได้ เนื่องจากที่ดินดังกล่าวเป็นสินสมรส","นายดีสามารถฟ้องเพิกถอนได้เพียงกึ่งหนึ่ง ตามส่วนการเป็นเจ้าของของนายเอ","นายดีสามารถฟ้องเพิกถอนได้ทั้งหมด เนื่องจากนายเอกับนางบีร่วมกันสมคบคิดฉ้อฉลเจ้าหนี้","นายดีไม่สามารถที่จะฟ้องขอเพิกถอนการฉ้อฉลได้ เพราะนายดียังไม่ได้เป็นเจ้าหนี้ตามคำพิพากษา"],"a":[1]},{"q":"ข้อใดไม่ใช่การสมรสสิ้นสุดลง","o":["คู่สมรสหย่ากัน","ความตายของคู่สมรสฝ่ายหนึ่ง","คู่สมรสสมัครใจแยกกันอยู่เกินสามปี","ศาลพิพากษาให้เพิกถอนการสมรส"],"a":[2]},{"q":"นิติกรรมใด มีผลเป็นโมฆียะ","o":["A ทำสัญญาขายบ้านกับ B โดยทำเป็นหนังสืออย่างเดียว","A ทำสัญญาขายรถกับ B โดย B รู้ว่ารถของนาย A สูญหายแล้ว","A ทำสัญญาจ้าง B สร้างบ้าน โดยสำคัญผิดว่า B เป็นช่างไม้มีฝีมือ แต่ที่จริงเป็นช่างปูน","A ทำสัญญาขายที่ดินกับ B โดยสำคัญผิดว่าเป็นสัญญาขายฝาก"],"a":[2]},{"q":"ข้อใดต่อไปนี้ ไม่ถือเป็นเคหสถาน","o":["สนามหน้าบ้านที่ไม่มีแนวรั้วกั้น","บ้านเช่าที่ไม่มีผู้เช่าอาศัย","ที่พักคนงานที่ใช้อาศัยระหว่างก่อสร้าง","ถนนหน้าบ้าน"],"a":[3]},{"q":"ข้อใดต่อไปนี้ ไม่ถือว่าเป็นการใช้กำลังประทุษร้าย","o":["กอดเอวและดึงเสื้อของเจ้าพนักงาน","มอมเหล้าให้หมดสติ","ฉีดยาเสพติดให้มึนงง","ดึงกระเป๋าถือยื้อแย่งกันจนกระเป๋าขาด"],"a":[3]},{"q":"นายเมรัยชอบดื่มสุรา เมื่อมีอาการมึนเมามักพูดจาหยาบคาย ดูถูก และข่มขู่นายแค้นเคืองเป็นประจำ นายแค้นเคืองนำเรื่องนี้ไปปรับทุกข์ให้นายอาสาฟัง แล้วพูดว่า “พวกมึงจัดการไอ้เมรัยที” นายอาสาจึงไปดักตีหัวนายเมรัย นายเมรัยล้มลงคอหักตาย เช่นนี้ การกระทำของนายแค้นเคืองเป็นความผิดฐานใด","o":["ฆ่าผู้อื่น","ทำร้ายร่างกายผู้อื่นจนเป็นเหตุให้ผู้นั้นถึงแก่ความตาย","ทำร้ายร่างกายผู้อื่น","*(ข้อความในภาพถูกบัง)* ...ผู้อื่นถึงแก่ความตาย"],"a":[1]},{"q":"นายยีดอก เป็นนายกเทศมนตรีเทศบาลบ้านบันเทิง ทราบมาว่านางสาวพุ่งทะยาน เป็นผู้สมัครสอบเพื่อบรรจุเป็นข้าราชการท้องถิ่น นายยีดอกจึงเข้าไปตีสนิทและเสนอเงื่อนไขแก่นางสาวพุ่งทะยานว่า นายยีดอกรู้จักกับคณะกรรมการคัดเลือกและประมวลผลสอบ หากนางสาวพุ่งทะยานอยากสอบได้ในลำดับต้น ๆ นายยีดอกสามารถคุยกับคณะกรรมการฯ ให้ช่วยเหลือได้ แต่นางสาวพุ่งทะยานจะต้องจ่ายเงินค่าดำเนินการเป็นเงิน 600,000 บาท ทั้ง ๆ ที่นายยีดอกไม่ได้รู้จักใครเลย นางสาวพุ่งทะยานอยากสอบได้ลำดับที่ 1 จึงนำเงินสดจำนวน 600,000 บาท มามอบให้นายยีดอกเป็นค่าดำเนินการ เช่นนี้ การกระทำของนายยีดอกเป็นความผิดฐานใด","o":["ฐานเป็นเจ้าพนักงานเรียก รับ หรือยอมจะรับทรัพย์สิน หรือประโยชน์อื่นใดสำหรับตนเองหรือผู้อื่นโดยมิชอบเพื่อกระทำการหรือไม่กระทำการอย่างใดในตำแหน่งฯ","ฐานฉ้อโกง","ฐานสนับสนุนเจ้าพนักงานเรียก รับ หรือยอมจะรับทรัพย์สินฯ","ฐานเป็นเจ้าพนักงานปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยมิชอบ"],"a":[1]},{"q":"ในปี พ.ศ. 2569 ครบรอบวันสถาปนาศาลยุติธรรมกี่ปี","o":["143 ปี","144 ปี","145 ปี","146 ปี"],"a":[1]},{"q":"ศาลที่มีอำนาจพิจารณาคดีเยาวชนและครอบครัว ตามพระราชบัญญัติศาลเยาวชนและครอบครัวและวิธีพิจารณาคดีเยาวชนและครอบครัว พ.ศ. 2553 คือศาลใด","o":["ศาลเยาวชนและครอบครัว","ศาลอุทธรณ์คดีชำนัญพิเศษ","ศาลฎีกา","ถูกทุกข้อ"],"a":[3]},{"q":"กรณีมีปัญหาว่าคดีใดจะอยู่ในอำนาจของศาลเยาวชนและครอบครัวหรือไม่ ไม่ว่าปัญหานั้นจะเกิดขึ้นในศาลเยาวชนและครอบครัว หรือศาลยุติธรรมอื่น ให้ศาลนั้นรอการพิจารณาพิพากษาคดีไว้ชั่วคราวแล้วเสนอปัญหานั้นให้ใครเป็นผู้วินิจฉัย","o":["ประธานศาลฎีกา","ประธานศาลอุทธรณ์","ประธานศาลอุทธรณ์คดีชำนัญพิเศษ","อธิบดีผู้พิพากษาศาลเยาวชนและครอบครัวกลาง"],"a":[2]},{"q":"ประวัติของพระองค์เจ้ารพีพัฒนศักดิ์ ข้อใดไม่ถูกต้อง","o":["ประสูติเมื่อวันพุธ ที่ 21 ตุลาคม 2417","เป็นพระราชโอรสพระองค์ที่ 14 ในพระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว","ทรงสำเร็จการศึกษาจากมหาวิทยาลัยออกซฟอร์ด ประเทศอังกฤษ","ได้รับพระกรุณาโปรดเกล้าฯ ให้เป็นเสนาบดีกระทรวงยุติธรรมเมื่อปี 2431"],"a":[3]},{"q":"ข้อใดไม่ใช่ตำแหน่งที่พระองค์เจ้ารพีพัฒนศักดิ์เคยทรงดำรง","o":["สภานายกพิเศษจัดการตั้งศาลในมณฑลอยุธยา","เสนาบดีกระทรวงเกษตราธิการ","ประธานศาลฎีกา","องคมนตรี"],"a":[2]},{"q":"ประมวลกฎหมายยาเสพติดมีผลใช้บังคับตั้งแต่เมื่อใด","o":["8 พฤศจิกายน 2564","9 พฤศจิกายน 2564","8 ธันวาคม 2564","9 ธันวาคม 2564"],"a":[3]},{"q":"ข้อใดไม่ใช่ยาเสพติดให้โทษในประเภท 2","o":["มอร์ฟีน (Morphine)","อาเซติค แอนไฮไดรต์ (Acetic Anhydride)","โคเคน (Cocaine)","ฝิ่นยา (Medicinal opium)"],"a":[1]}],"reserve":[{"q":"ข้อใดต่อไปนี้ถูกต้อง","o":["หนี้เงินนั้นให้คิดดอกเบี้ยในระหว่างเวลาผิดนัดในอัตราร้อยละ 7.5 ต่อปี","การซื้อขายเรือมีระวางไม่ถึงห้าตันไม่ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่","ผู้เยาว์จะทำการสมรสได้ต้องมีอายุไม่น้อยกว่าสิบห้าปีและต้องได้รับความยินยอมจากบิดา มารดา","การใดอันบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถได้กระทำลงการนั้นเป็นโมฆะ"],"a":[1]},{"q":"การซื้อทรัพย์สิน ซึ่งไม่ได้กำหนดตัวทรัพย์สินไว้แน่นอน กรรมสิทธิ์โอนไปยังผู้ซื้อเมื่อใด","o":["เมื่อทำสัญญาซื้อขาย","เมื่อได้หมาย นับ ชั่ง ตวง วัด","เมื่อมีการชำระราคากัน","เมื่อส่งมอบทรัพย์สินให้กัน"],"a":[1]}]}];
DATA.push({"id":101,"title":"Four Corners กฎหมายมหาชน","sub":"แนวฎีกาศาลปกครอง (ฎ.62/2557, ฎ.56/2553, ฎ.2/2563, ฎ.526/2550, ฎ.43/2562, ฎ.19/2546, ฎ.37/2560, ฎ.44/2560)","level":"AI","main":[
{"q":"รัฐวิสาหกิจแห่งหนึ่งทำสัญญากับบริษัทเอกชนเพื่อก่อสร้างและจัดจำหน่ายบ้านโครงการ \"บ้านเอื้ออาทร\" ให้ประชาชนผู้มีรายได้น้อยได้มีที่อยู่อาศัย ต่อมาเกิดข้อพิพาทเกี่ยวกับสัญญา สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางแพ่ง เพราะคู่สัญญาฝ่ายหนึ่งเป็นนิติบุคคลเอกชน","สัญญาทางปกครอง เพราะเป็นการจัดทำบริการสาธารณะ แม้คู่สัญญาฝ่ายหนึ่งเป็นรัฐวิสาหกิจก็ตาม","สัญญาทางแพ่ง เพราะรัฐวิสาหกิจมิใช่หน่วยงานทางปกครอง","สัญญาทางปกครองเฉพาะในส่วนที่เกี่ยวกับการโอนกรรมสิทธิ์บ้านเท่านั้น"],"a":[1]},
{"q":"หลักเกณฑ์สำคัญในการพิจารณาว่าสัญญาที่หน่วยงานของรัฐทำกับเอกชนเป็น \"สัญญาทางปกครอง\" คือข้อใด","o":["ดูที่สถานะของคู่สัญญาว่าเป็นหน่วยงานของรัฐหรือไม่","ดูที่มูลค่าหรือจำนวนเงินตามสัญญา","ดูที่ลักษณะของสัญญาว่าเป็นสัญญาสัมปทาน จัดทำบริการสาธารณะ จัดให้มีสิ่งสาธารณูปโภค หรือแสวงประโยชน์จากทรัพยากรธรรมชาติ","ดูที่ข้อกำหนดให้คู่สัญญาเลือกใช้กฎหมายไทยหรือไม่"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญากับบริษัทโทรคมนาคมเอกชนให้จัดบริการข้อมูลทางโทรศัพท์ให้แก่หน่วยงาน ตามแนวคำพิพากษาฎีกาที่ 56/2553 สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางปกครอง เพราะหน่วยงานของรัฐเป็นคู่สัญญา","สัญญาทางปกครอง เพราะกิจการโทรคมนาคมเป็นบริการสาธารณะ","สัญญาทางแพ่ง เพราะไม่มีลักษณะเป็นการจัดทำบริการสาธารณะ สัมปทาน หรือสาธารณูปโภค","สัญญาทางแพ่งเฉพาะส่วนค่าบริการ แต่ส่วนอื่นเป็นสัญญาทางปกครอง"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญาซื้อขายครุภัณฑ์ก่อสร้างจากบริษัทเอกชนเพื่อใช้ในสำนักงาน เมื่อมีข้อพิพาทเกิดขึ้น ข้อใดถูกต้องตามแนวฎีกาที่ 2/2563","o":["ข้อพิพาทอยู่ในอำนาจศาลปกครอง เพราะคู่สัญญาฝ่ายหนึ่งเป็นหน่วยงานของรัฐ","ข้อพิพาทอยู่ในอำนาจศาลยุติธรรม เพราะเป็นสัญญาทางแพ่งที่ไม่มีลักษณะจัดทำบริการสาธารณะ","ข้อพิพาทอยู่ในอำนาจศาลปกครองสูงสุด","ข้อพิพาทไม่อยู่ในอำนาจศาลใด ต้องระงับโดยอนุญาโตตุลาการเท่านั้น"],"a":[1]},
{"q":"ข้อพิพาทเกี่ยวกับสัญญาสัมปทาน สัญญาจัดทำบริการสาธารณะหรือจัดให้มีสิ่งสาธารณูปโภค หรือสัญญาแสวงประโยชน์จากทรัพยากรธรรมชาติ อยู่ในอำนาจพิจารณาพิพากษาของศาลใด","o":["ศาลยุติธรรม","ศาลรัฐธรรมนูญ","ศาลปกครอง","ศาลแขวง"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งออกคำสั่งทางปกครองที่กระทบสิทธิของนาย ก โดยไม่ได้เปิดโอกาสให้นาย ก ชี้แจงข้อเท็จจริงและโต้แย้งตามขั้นตอนอันเป็นสาระสำคัญที่กฎหมายกำหนด ตามแนวฎีกาที่ 526/2550 ผลของคำสั่งดังกล่าวคือข้อใด","o":["คำสั่งชอบด้วยกฎหมาย เพราะเจ้าหน้าที่มีอำนาจออกได้","คำสั่งไม่ชอบด้วยกฎหมาย และศาลมีอำนาจเพิกถอนได้","คำสั่งชอบด้วยกฎหมาย แต่เพิกถอนไม่ได้เพราะพ้นกำหนดเวลา","คำสั่งเป็นโมฆะเฉพาะส่วนที่เป็นโทษ แต่ส่วนอื่นยังสมบูรณ์"],"a":[1]},
{"q":"หลักการใดเป็นเหตุผลสำคัญที่ศาลเพิกถอนคำสั่งทางปกครองซึ่งออกโดยไม่ปฏิบัติตามขั้นตอนอันเป็นสาระสำคัญตามข้อ 6","o":["หลักความเสมอภาคระหว่างบุคคล","หลักความชอบด้วยกฎหมายของฝ่ายปกครอง ซึ่งรวมถึงความถูกต้องตามรูปแบบและขั้นตอนอันเป็นสาระสำคัญ","หลักความศักดิ์สิทธิ์แห่งการแสดงเจตนา","หลักสุจริตในการชำระหนี้"],"a":[1]},
{"q":"เจ้าพนักงานที่ดินมีคำสั่งเพิกถอนหนังสือรับรองการทำประโยชน์ (น.ส.3 ก.) ที่นาย ข ถืออยู่ นาย ข เห็นว่าคำสั่งไม่ชอบด้วยกฎหมายจึงประสงค์จะฟ้องคดี ตามแนวฎีกาที่ 43/2562 ข้อใดถูกต้อง","o":["การเพิกถอน น.ส.3 ก. เป็นคำสั่งทางปกครองที่ศาลปกครองตรวจสอบความชอบด้วยกฎหมายได้","การเพิกถอน น.ส.3 ก. อยู่ในอำนาจศาลยุติธรรมเท่านั้น","นาย ข ฟ้องไม่ได้ เพราะ น.ส.3 ก. เป็นเพียงเอกสารสิทธิมิใช่กรรมสิทธิ์","ต้องฟ้องเป็นคดีแพ่งสามัญเท่านั้น"],"a":[0]},
{"q":"เจ้าพนักงานที่ดินออกคำสั่งเกี่ยวกับที่ดินโดยมิได้ตรวจสอบพยานหลักฐานของผู้ยื่นคำขอให้รอบคอบก่อน ตามแนวฎีกาที่ 19/2546 คดีพิพาทเกี่ยวกับคำสั่งดังกล่าวอยู่ในอำนาจศาลใด","o":["ศาลยุติธรรม ตามมาตรา 9 (3)","ศาลปกครอง ตามมาตรา 9 (1) (2) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","ศาลรัฐธรรมนูญ ตามมาตรา 210","คณะกรรมการวินิจฉัยชี้ขาดอำนาจหน้าที่ระหว่างศาล"],"a":[1]},
{"q":"นาย ค ได้รับความเสียหายเพราะพนักงานเจ้าหน้าที่ออกโฉนดที่ดินให้แก่ผู้อื่นโดยไม่ชอบ ทำให้นาย ค ต้องฟ้องเรียกค่าเสียหายจากหน่วยงานของรัฐ ตามแนวฎีกาที่ 37/2560 คดีนี้เป็นคดีประเภทใด","o":["คดีพิพาทเกี่ยวกับคำสั่งทางปกครอง ตามมาตรา 9 (1)","คดีพิพาทเกี่ยวกับสัญญาทางปกครอง ตามมาตรา 9 (4)","คดีละเมิด ตามมาตรา 9 (3) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","คดีละเมิดซึ่งอยู่ในอำนาจศาลยุติธรรม"],"a":[2]},
{"q":"คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของพระราชกฤษฎีกาที่คณะรัฐมนตรีออกโดยอาศัยอำนาจตามกฎหมาย ตามแนวฎีกาที่ 44/2560 ศาลใดมีอำนาจพิจารณาพิพากษา","o":["ศาลปกครองชั้นต้น","ศาลปกครองสูงสุด","ศาลยุติธรรม","ศาลรัฐธรรมนูญ"],"a":[1]},
{"q":"ตามมาตรา 11 แห่ง พ.ร.บ.จัดตั้งศาลปกครองและวิธีพิจารณาคดีปกครอง พ.ศ. 2542 คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของกฎประเภทใดที่ศาลปกครองสูงสุดมีอำนาจพิพากษาได้โดยตรง","o":["กฎกระทรวงที่รัฐมนตรีออกโดยลำพัง","พระราชกฤษฎีกาหรือกฎที่คณะรัฐมนตรีออก","ข้อบัญญัติท้องถิ่นขององค์การบริหารส่วนตำบล","ระเบียบภายในของหน่วยงานซึ่งไม่มีผลต่อบุคคลภายนอก"],"a":[1]},
{"q":"ตามหลักทั่วไปของการพิจารณาทางปกครอง ก่อนที่เจ้าหน้าที่จะออกคำสั่งทางปกครองที่กระทบสิทธิของคู่กรณี เจ้าหน้าที่ต้องปฏิบัติอย่างไร","o":["ต้องให้คู่กรณีได้ทราบข้อเท็จจริงและโต้แย้งแสดงพยานหลักฐานของตนก่อน","ต้องขออนุญาตศาลปกครองก่อนทุกครั้ง","ต้องรอให้คู่กรณีอุทธรณ์ก่อน","ไม่ต้องปฏิบัติอะไร เพราะเจ้าหน้าที่มีอำนาจเด็ดขาด"],"a":[0]},
{"q":"ข้อยกเว้นของหลักฟังความสองฝ่ายตามข้อ 13 คือข้อใด","o":["กรณีมีความจำเป็นรีบด่วน หรือเป็นประโยชน์สาธารณะ หรือมีกฎหมายเฉพาะกำหนดไว้","กรณีคู่กรณีเป็นนิติบุคคล","กรณีคำสั่งมีมูลค่าไม่เกินหนึ่งแสนบาท","ไม่มีข้อยกเว้นใด ๆ เลย"],"a":[0]},
{"q":"เจ้าหน้าที่ออกคำสั่งทางปกครองโดยมิได้แจ้งสิทธิอุทธรณ์และระยะเวลาอุทธรณ์ให้คู่กรณีทราบ ตามมาตรา 40 แห่ง พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง พ.ศ. 2539 ระยะเวลาอุทธรณ์จะขยายเป็นเท่าใด","o":["15 วัน","30 วัน","1 ปี","5 ปี"],"a":[2]},
{"q":"คำสั่งทางปกครองที่ให้ประโยชน์แก่คู่กรณี (เช่น ใบอนุญาต) ต่อมาปรากฏว่าออกโดยไม่ชอบด้วยกฎหมาย เมื่อเจ้าหน้าที่จะเพิกถอนคำสั่งดังกล่าว ต้องคำนึงถึงสิ่งใด","o":["ความเชื่อโดยสุจริตของผู้รับประโยชน์กับประโยชน์สาธารณะ และอาจให้ค่าทดแทนความเสียหายได้","ความประสงค์ของผู้บังคับบัญชาเท่านั้น","จำนวนผู้ได้รับผลกระทบเท่านั้น","ไม่ต้องคำนึงถึงสิ่งใด เพราะคำสั่งไม่ชอบด้วยกฎหมายต้องเพิกถอนเสมอ"],"a":[0]},
{"q":"การที่ศาลปกครองตรวจสอบความชอบด้วยกฎหมายของคำสั่งเพิกถอน น.ส.3 ก. ตามแนวฎีกาที่ 43/2562 แสดงว่าคำสั่งดังกล่าวเข้าลักษณะ \"คำสั่งทางปกครอง\" ตามมาตรา 5 แห่ง พ.ร.บ.วิธีปฏิบัติราชการทางปกครองฯ เพราะเหตุใด","o":["เป็นการใช้อำนาจตามกฎหมายของเจ้าหน้าที่ที่มีผลกระทบต่อสิทธิหรือหน้าที่ของบุคคล","เป็นการกระทำระหว่างเอกชนกับเอกชน","เป็นการออกกฎที่มีผลใช้บังคับเป็นการทั่วไป","เป็นการใช้อำนาจของฝ่ายนิติบัญญัติ"],"a":[0]},
{"q":"ตาม พ.ร.บ.ความรับผิดทางละเมิดของเจ้าหน้าที่ พ.ศ. 2539 เมื่อเจ้าหน้าที่กระทำละเมิดในการปฏิบัติหน้าที่ ผู้เสียหายฟ้องร้องได้อย่างไร","o":["ฟ้องเจ้าหน้าที่ผู้กระทำละเมิดโดยตรง","ฟ้องหน่วยงานของรัฐที่เจ้าหน้าที่สังกัดได้โดยตรง แต่ฟ้องเจ้าหน้าที่ไม่ได้","ฟ้องได้ทั้งหน่วยงานและเจ้าหน้าที่ในคดีเดียวกันเสมอ","ฟ้องได้เฉพาะเมื่อรัฐมนตรีว่าการกระทรวงอนุญาต"],"a":[1]},
{"q":"หน่วยงานของรัฐจะไล่เบี้ยจากเจ้าหน้าที่ผู้กระทำละเมิดได้ เฉพาะในกรณีใด","o":["ทุกกรณีที่เจ้าหน้าที่กระทำละเมิดในการปฏิบัติหน้าที่","กรณีเจ้าหน้าที่จงใจหรือประมาทเลินเล่ออย่างร้ายแรง","กรณีประมาทเลินเล่อเล็กน้อยเท่านั้น","กรณีเจ้าหน้าที่กระทำละเมิดนอกเวลาราชการ"],"a":[1]},
{"q":"นาย ง ถูกหน่วยงานของรัฐออกคำสั่งทางปกครองที่กระทบสิทธิของตน ตามหลักทั่วไป นาย ง จะฟ้องคดีต่อศาลปกครองได้ต้องดำเนินการอย่างไร","o":["ฟ้องได้ทันทีโดยไม่ต้องดำเนินการใดก่อน","ต้องยื่นอุทธรณ์หรือดำเนินการตามขั้นตอนทางปกครองที่กฎหมายกำหนดก่อน จึงจะฟ้องได้","ต้องให้สมาชิกสภาผู้แทนราษฎรฟ้องแทน","ต้องยื่นเรื่องต่อศาลรัฐธรรมนูญก่อนเสมอ"],"a":[1]}
],"reserve":[]});
DATA.push({id:102,title:'Claude Opus 5.5 กฎหมายมหาชน',sub:'กฎหมายมหาชน ระดับยาก',level:'AI',main:[
{q:'ใครเป็นผู้วางระบบแนวคิด "ลำดับชั้นของกฎหมาย" (Stufenbau der Rechtsordnung) เป็นคนแรก ก่อนที่ Hans Kelsen จะนำไปใช้ในทฤษฎีกฎหมายบริสุทธิ์',o:['Georg Jellinek','Adolf Julius Merkl','Paul Laband','Hermann Heller'],a:[1]},
{q:'ประโยค "ผู้ทรงอำนาจอธิปไตยคือผู้ที่ตัดสินใจในสภาวะยกเว้น" มาจากใคร และอยู่ในงานชิ้นใด',o:['Hans Kelsen – Allgemeine Staatslehre','Carl Schmitt – Politische Theologie','Rudolf Smend – Verfassung und Verfassungsrecht','Carl Schmitt – Der Begriff des Politischen'],a:[1]},
{q:'นักคิดคนใดเป็นผู้นำ "สำนักบอร์โดซ์" เสนอว่าบริการสาธารณะ (service public) คือหัวใจของกฎหมายปกครอง และปฏิเสธแนวคิดอำนาจอธิปไตยแบบอภิปรัชญา',o:['Maurice Hauriou','Raymond Carré de Malberg','Léon Duguit','Georges Vedel'],a:[2]},
{q:'คำวินิจฉัยของสภาแห่งรัฐฝรั่งเศสคดีใดยุติทฤษฎี "รัฐมนตรีผู้พิพากษา" (ministre-juge) และทำให้สภาแห่งรัฐมีเขตอำนาจทั่วไปในคดีปกครอง',o:['Blanco (1873)','Cadot (1889)','Terrier (1903)','Benjamin (1933)'],a:[1]},
{q:'ข้อใด "ไม่ใช่" หลักย่อยของหลักความได้สัดส่วน (Verhältnismäßigkeitsgrundsatz) ตามแนวคิดเยอรมัน',o:['หลักความเหมาะสม (Geeignetheit)','หลักความจำเป็น (Erforderlichkeit)','หลักความได้สัดส่วนในความหมายอย่างแคบ (Verhältnismäßigkeit im engeren Sinne)','หลักการคุ้มครองความเชื่อโดยสุจริต (Vertrauensschutz)'],a:[3]},
{q:'การกระทำใดน่าจะถือเป็น "การกระทำของรัฐบาล" (acte de gouvernement) ซึ่งศาลปกครองไม่รับตรวจสอบมากที่สุด',o:['มติคณะรัฐมนตรีอนุมัติให้ข้าราชการได้รับเงินช่วยเหลือพิเศษ','มติคณะรัฐมนตรีให้เสนอร่างพระราชบัญญัติต่อสภาผู้แทนราษฎร','คำสั่งนายกรัฐมนตรีให้ข้าราชการพลเรือนออกจากราชการ','ประกาศกระทรวงกำหนดหลักเกณฑ์การขออนุญาตประกอบกิจการ'],a:[1]},
{q:'ศาลรัฐธรรมนูญจะวินิจฉัยว่าพระราชกำหนดไม่เป็นไปตามมาตรา 172 วรรคหนึ่งได้ ต้องใช้คะแนนเสียงเท่าใด',o:['เสียงข้างมากของตุลาการที่ร่วมพิจารณา','ไม่น้อยกว่ากึ่งหนึ่งของตุลาการทั้งหมด','ไม่น้อยกว่าสองในสามของตุลาการทั้งหมด','ไม่น้อยกว่าสามในสี่ของตุลาการทั้งหมด'],a:[2]},
{q:'ในการแก้ไขเพิ่มเติมรัฐธรรมนูญ วาระที่สามต้องได้คะแนนเห็นชอบอย่างไร',o:['มากกว่ากึ่งหนึ่งของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สส. จากพรรคที่ไม่มีสมาชิกเป็นรัฐมนตรี ประธานสภา หรือรองประธานสภา เห็นชอบไม่น้อยกว่าร้อยละ 10 และ สว. ไม่น้อยกว่าหนึ่งในห้า','มากกว่ากึ่งหนึ่งของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สส. จากพรรคดังกล่าวเห็นชอบไม่น้อยกว่าร้อยละ 20 ของทุกพรรคดังกล่าวรวมกัน และ สว. ไม่น้อยกว่าหนึ่งในสาม','ไม่น้อยกว่าสองในสามของสมาชิกทั้งหมดของทั้งสองสภา','ไม่น้อยกว่าสามในห้าของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สว. ไม่น้อยกว่าหนึ่งในสาม'],a:[1]},
{q:'ระหว่างพิจารณาคดีแพ่ง คู่ความโต้แย้งว่าบทบัญญัติแห่งกฎหมายที่ศาลจะใช้ขัดต่อรัฐธรรมนูญ และยังไม่เคยมีคำวินิจฉัยในเรื่องนี้ ศาลยุติธรรมต้องทำอย่างไร',o:['จำหน่ายคดีชั่วคราวจนกว่าศาลรัฐธรรมนูญจะวินิจฉัย','ส่งความเห็นไปยังศาลรัฐธรรมนูญ ระหว่างนั้นพิจารณาคดีต่อไปได้ แต่ต้องรอการพิพากษาไว้ชั่วคราว','วินิจฉัยเองว่าขัดหรือไม่ แล้วจึงพิพากษาตามนั้น','ส่งเรื่องให้ผู้ตรวจการแผ่นดินเป็นผู้เสนอต่อศาลรัฐธรรมนูญ'],a:[1]},
{q:'ข้อใดถูกต้องเกี่ยวกับตุลาการศาลรัฐธรรมนูญ',o:['มี 9 คน วาระ 9 ปี พ้นตำแหน่งเมื่ออายุครบ 70 ปี','มี 9 คน วาระ 7 ปี ดำรงตำแหน่งได้วาระเดียว พ้นตำแหน่งเมื่ออายุครบ 75 ปี','มี 9 คน วาระ 7 ปี ดำรงตำแหน่งได้ไม่เกิน 2 วาระ พ้นตำแหน่งเมื่ออายุครบ 75 ปี','มี 15 คน วาระ 9 ปี ดำรงตำแหน่งได้วาระเดียว พ้นตำแหน่งเมื่ออายุครบ 70 ปี'],a:[1]},
{q:'ในกระบวนการจัดซื้อจัดจ้างของหน่วยงานรัฐ การกระทำใด "ไม่ใช่" คำสั่งทางปกครอง',o:['การสั่งไม่รับคำเสนอราคาของผู้ยื่นข้อเสนอ','การอนุมัติสั่งจ้าง','การสั่งยกเลิกกระบวนการพิจารณาคัดเลือก','การลงนามในสัญญาจ้างก่อสร้างอาคาร'],a:[3]},
{q:'ข้อใดถูกต้องเกี่ยวกับ "ญาติ" ที่ทำให้เจ้าหน้าที่ไม่อาจพิจารณาทางปกครองได้ตามมาตรา 13',o:['บุพการีหรือผู้สืบสันดานนับได้เพียงภายในสามชั้น','ญาติเกี่ยวพันทางแต่งงานนับได้เพียงสองชั้น','ญาติเกี่ยวพันทางแต่งงานนับได้เพียงสามชั้น','พี่น้องหรือลูกพี่ลูกน้องนับได้เพียงภายในสองชั้น'],a:[1]},
{q:'ผู้รับประโยชน์จากคำสั่งทางปกครองที่ไม่ชอบด้วยกฎหมาย "ยังอ้าง" ความเชื่อโดยสุจริตตามมาตรา 51 ได้ในกรณีใด',o:['ได้คำสั่งมาเพราะแสดงข้อความอันเป็นเท็จ','ให้ถ้อยคำไม่ถูกต้องหรือไม่ครบถ้วนในสาระสำคัญ','ไม่รู้ถึงความไม่ชอบด้วยกฎหมายเพราะประมาทเลินเล่อธรรมดา','ไม่รู้ถึงความไม่ชอบด้วยกฎหมายเพราะประมาทเลินเล่ออย่างร้ายแรง'],a:[2]},
{q:'เมื่อมีการอุทธรณ์คำสั่งทางปกครองตามมาตรา 44–45 ข้อใดถูกต้องเรื่องระยะเวลา',o:['เจ้าหน้าที่ต้องพิจารณาภายใน 15 วัน ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 30 วัน ขยายได้ไม่เกิน 60 วัน','เจ้าหน้าที่ต้องพิจารณาภายใน 30 วันนับแต่ได้รับอุทธรณ์ ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 30 วันนับแต่ได้รับรายงาน ขยายได้ไม่เกิน 30 วัน','เจ้าหน้าที่ต้องพิจารณาภายใน 30 วัน ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 60 วัน ขยายไม่ได้','เจ้าหน้าที่ต้องพิจารณาภายใน 90 วัน และไม่มีกำหนดเวลาสำหรับผู้มีอำนาจพิจารณาอุทธรณ์'],a:[1]},
{q:'ถ้าคำสั่งทางปกครองไม่ระบุกรณีที่อาจอุทธรณ์ วิธียื่น และระยะเวลาอุทธรณ์ ผลคือข้อใด',o:['คำสั่งนั้นเป็นโมฆะ','ระยะเวลาอุทธรณ์เริ่มนับใหม่เมื่อมีการแจ้งเพิ่มเติม แต่ถ้าไม่แจ้ง ระยะเวลาขยายเป็น 1 ปีนับแต่วันที่ได้รับคำสั่ง','ระยะเวลาอุทธรณ์ขยายเป็น 90 วัน','ผู้รับคำสั่งฟ้องศาลปกครองได้ทันทีโดยไม่ต้องอุทธรณ์ภายในฝ่ายปกครอง'],a:[1]},
{q:'คดีพิพาทเกี่ยวกับการกระทำละเมิดหรือความรับผิดอย่างอื่นของหน่วยงานทางปกครอง (มาตรา 9 วรรคหนึ่ง (3)) ต้องฟ้องภายในเวลาใด',o:['90 วันนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี','1 ปีนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี แต่ไม่เกิน 5 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี','1 ปีนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี แต่ไม่เกิน 10 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี','5 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี'],a:[2]},
{q:'คดีใดอยู่ในเขตอำนาจศาลปกครอง',o:['คดีพิพาทเรื่องคำสั่งลงโทษทางวินัยทหาร','คดีพิพาทเรื่องมติคณะกรรมการตุลาการศาลยุติธรรม (ก.ต.)','คดีพิพาทเรื่องคำสั่งลงโทษไล่ออกข้าราชการตำรวจ','คดีพิพาทเรื่องการประเมินภาษีอากร'],a:[2]},
{q:'ตามแนวคำวินิจฉัยของศาลปกครอง สัญญาใดมีแนวโน้ม "ไม่ใช่" สัญญาทางปกครองมากที่สุด',o:['สัญญาสัมปทานทางด่วน','สัญญาจ้างก่อสร้างถนนสาธารณะ','สัญญาซื้อเครื่องคอมพิวเตอร์มาใช้ในสำนักงานของกรม','สัญญาให้เอกชนเข้าแสวงประโยชน์จากแร่'],a:[2]},
{q:'นาย ก. เจ้าหน้าที่ของรัฐ ขับรถราชการไปปฏิบัติหน้าที่และชนนาย ข. โดย "ประมาทเลินเล่อธรรมดา" หน่วยงานชดใช้ค่าสินไหมทดแทนให้นาย ข. ไปแล้ว ข้อใดถูกต้อง',o:['หน่วยงานไล่เบี้ยนาย ก. ได้ภายใน 1 ปีนับแต่วันที่ชดใช้','หน่วยงานไล่เบี้ยนาย ก. ได้ภายใน 2 ปีนับแต่วันที่รู้ถึงการละเมิด','หน่วยงานไล่เบี้ยนาย ก. ไม่ได้','นาย ข. เลือกฟ้องนาย ก. เป็นการส่วนตัวแทนหน่วยงานได้'],a:[2]},

 h+='</div>';
 const hard=all.filter(q=>ST.q[q.k]&&ST.q[q.k][0]>0).map(q=>({q,r:ST.q[q.k]})).sort((x,y)=>x.r[1]/x.r[0]-y.r[1]/y.r[0]||y.r[0]-x.r[0]).slice(0,8);
 h+='<h2>ข้อที่ควรทบทวน (ตอบถูกน้อยสุด)</h2>'+(hard.length?`<div class="card"><table>${hard.map(({q,r})=>`<tr><td>${DATA[q.si].title} ${q.p==='r'?'สำรอง':''}ข้อ ${q.n}</td><td>${esc(q.q.slice(0,70))}…</td><td>${r[1]}/${r[0]}</td></tr>`).join('')}</table></div>`:'<p class="mu">ยังไม่มีข้อมูล เริ่มทำข้อสอบได้เลย</p>');
 h+='<h2>ประวัติล่าสุด</h2>'+(ST.att.length?`<div class="card"><table>${ST.att.slice(-10).reverse().map(a=>`<tr><td>${new Date(a.t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td><td>${a.w?'ฝึกข้อผิด':a.s<0?'สุ่มรวม':DATA[a.s].title+(a.p==='r'?' สำรอง':'')}</td><td>${a.sc}/${a.tt}</td><td>${pct(a.sc,a.tt)}%</td></tr>`).join('')}</table></div>`:'<p class="mu">ยังไม่มีประวัติ</p>');
 h+=`<h2>สถิติของข้อสอบ: การกระจายคำตอบที่ถูก</h2><div class="card">${dist.map((d,i)=>`<div class="hb"><span style="min-width:2.5em">ข้อ ${L[i]}</span><div class="bar"><div style="width:${pct(d,dn)}%"></div></div><span style="min-width:6em;text-align:right">${d} ข้อ (${pct(d,dn)}%)</span></div>`).join('')}<p class="mu" style="margin-bottom:0">รวม ${all.length} ข้อ จาก ${DATA.length} ชุด</p></div>
 <div class="row"><button class="btn" onclick="ask(this,()=>{ST={att:[],q:{},v:ST.v};save();render()})">🗑 ล้างสถิติ</button></div>`;
 $('#app').innerHTML=h}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#15171c';r.dataset.theme=d?'light':'dark'};
render();
</script></body></html>
