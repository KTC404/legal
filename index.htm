{q:'ใครเป็นผู้วางระบบแนวคิด "ลำดับชั้นของกฎหมาย" (Stufenbau der Rechtsordnung) เป็นคนแรก ก่อนที่ Hans Kelsen จะนำไปใช้ในทฤษฎีกฎหมายบริสุทธิ์',o:['Georg Jellinek','Adolf Julius Merkl','Paul Laband','Hermann Heller'],a:[1]},
{q:'ประโยค "ผู้ทรงอำนาจอธิปไตยคือผู้ที่ตัดสินใจในสภาวะยกเว้น" มาจากใคร และอยู่ในงานชิ้นใด',o:['Hans Kelsen – Allgemeine Staatslehre','Carl Schmitt – Politische Theologie','Rudolf Smend – Verfassung und Verfassungsrecht','Carl Schmitt – Der Begriff des Politischen'],a:[1]},
{q:'นักคิดคนใดเป็นผู้นำ "สำนักบอร์โดซ์" เสนอว่าบริการสาธารณะ (service public) คือหัวใจของกฎหมายปกครอง และปฏิเสธแนวคิดอำนาจอธิปไตยแบบอภิปรัชญา',o:['Maurice Hauriou','Raymond Carré de Malberg','Léon Duguit','Georges Vedel'],a:[2]},
{q:'คำวินิจฉัยของสภาแห่งรัฐฝรั่งเศสคดีใดยุติทฤษฎี "รัฐมนตรีผู้พิพากษา" (ministre-juge) และทำให้สภาแห่งรัฐมีเขตอำนาจทั่วไปในคดีปกครอง',o:['Blanco (1873)','Cadot (1889)','Terrier (1903)','Benjamin (1933)'],a:[1]},
{q:'ข้อใด "ไม่ใช่" หลักย่อยของหลักความได้สัดส่วน (Verhältnismäßigkeitsgrundsatz) ตามแนวคิดเยอรมัน',o:['หลักความเหมาะสม (Geeignetheit)','หลักความจำเป็น (Erforderlichkeit)','หลักความได้สัดส่วนในความหมายอย่างแคบ (Verhältnismäßigkeit im engeren Sinne)','หลักการคุ้มครองความเชื่อโดยสุจริต (Vertrauensschutz)'],a:[3]},
{q:'การกระทำใดน่าจะถือเป็น "การกระทำของรัฐบาล" (acte de gouvernement) ซึ่งศาลปกครองไม่รับตรวจสอบมากที่สุด',o:['มติคณะรัฐมนตรีอนุมัติให้ข้าราชการได้รับเงินช่วยเหลือพิเศษ','มติคณะรัฐมนตรีให้เสนอร่างพระราชบัญญัติต่อสภาผู้แทนราษฎร','คำสั่งนายกรัฐมนตรีให้ข้าราชการพลเรือนออกจากราชการ','ประกาศกระทรวงกำหนดหลักเกณฑ์การขออนุญาตประกอบกิจการ'],a:[1]},
{q:'ศาลรัฐธรรมนูญจะวินิจฉัยว่าพระราชกำหนดไม่เป็นไปตามมาตรา 172 วรรคหนึ่งได้ ต้องใช้คะแนนเสียงเท่าใด',o:['เสียงข้างมากของตุลาการที่ร่วมพิจารณา','ไม่น้อยกว่ากึ่งหนึ่งของตุลาการทั้งหมด','ไม่น้อยกว่าสองในสามของตุลาการทั้งหมด','ไม่น้อยกว่าสามในสี่ของตุลาการทั้งหมด'],a:[2]},
{q:'ในการแก้ไขเพิ่มเติมรัฐธรรมนูญ วาระที่สามต้องได้คะแนนเห็นชอบอย่างไร',o:['มากกว่ากึ่งหนึ่งของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สส. จากพรรคที่ไม่มีสมาชิกเป็นรัฐมนตรี ประธานสภา หรือรองประธานสภา เห็นชอบไม่น้อยกว่าร้อยละ 10 และ สว. ไม่น้อยกว่าหนึ่งในห้า','มากกว่ากึ่งหนึ่งของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สส. จากพรรคดังกล่าวเห็นชอบไม่น้อยกว่าร้อยละ 20 ของทุกพรรคดังกล่าวรวมกัน และ สว. ไม่น้อยกว่าหนึ่งในสาม','ไม่น้อยกว่าสองในสามของสมาชิกทั้งหมดของทั้งสองสภา','ไม่น้อยกว่าสามในห้าของสมาชิกทั้งหมดของทั้งสองสภา โดยมี สว. ไม่น้อยกว่าหนึ่งในสาม'],a:[1]},
{q:'ระหว่างพิจารณาคดีแพ่ง คู่ความโต้แย้งว่าบทบัญญัติแห่งกฎหมายที่ศาลจะใช้ขัดต่อรัฐธรรมนูญ และยังไม่เคยมีคำวินิจฉัยในเรื่องนี้ ศาลยุติธรรมต้องทำอย่างไร',o:['จำหน่ายคดีชั่วคราวจนกว่าศาลรัฐธรรมนูญจะวินิจฉัย','ส่งความเห็นไปยังศาลรัฐธรรมนูญ ระหว่างนั้นพิจารณาคดีต่อไปได้ แต่ต้องรอการพิพากษาไว้ชั่วคราว','วินิจฉัยเองว่าขัดหรือไม่ แล้วจึงพิพากษาตามนั้น','ส่งเรื่องให้ผู้ตรวจการแผ่นดินเป็นผู้เสนอต่อศาลรัฐธรรมนูญ'],a:[1]},
{q:'ข้อใดถูกต้องเกี่ยวกับตุลาการศาลรัฐธรรมนูญ',o:['มี 9 คน วาระ 9 ปี พ้นตำแหน่งเมื่ออายุครบ 70 ปี','มี 9 คน วาระ 7 ปี ดำรงตำแหน่งได้วาระเดียว พ้นตำแหน่งเมื่ออายุครบ 75 ปี','มี 9 คน วาระ 7 ปี ดำรงตำแหน่งได้ไม่เกิน 2 วาระ พ้นตำแหน่งเมื่ออายุครบ 75 ปี','มี 15 คน วาระ 9 ปี ดำรงตำแหน่งได้วาระเดียว พ้นตำแหน่งเมื่ออายุครบ 70 ปี'],a:[1]},
{q:'ในกระบวนการจัดซื้อจัดจ้างของหน่วยงานรัฐ การกระทำใด "ไม่ใช่" คำสั่งทางปกครอง',o:['การสั่งไม่รับคำเสนอราคาของผู้ยื่นข้อเสนอ','การอนุมัติสั่งจ้าง','การสั่งยกเลิกกระบวนการพิจารณาคัดเลือก','การลงนามในสัญญาจ้างก่อสร้างอาคาร'],a:[3]},
{q:'ข้อใดถูกต้องเกี่ยวกับ "ญาติ" ที่ทำให้เจ้าหน้าที่ไม่อาจพิจารณาทางปกครองได้ตามมาตรา 13',o:['บุพการีหรือผู้สืบสันดานนับได้เพียงภายในสามชั้น','ญาติเกี่ยวพันทางแต่งงานนับได้เพียงสองชั้น','ญาติเกี่ยวพันทางแต่งงานนับได้เพียงสามชั้น','พี่น้องหรือลูกพี่ลูกน้องนับได้เพียงภายในสองชั้น'],a:[1]},
{q:'ผู้รับประโยชน์จากคำสั่งทางปกครองที่ไม่ชอบด้วยกฎหมาย "ยังอ้าง" ความเชื่อโดยสุจริตตามมาตรา 51 ได้ในกรณีใด',o:['ได้คำสั่งมาเพราะแสดงข้อความอันเป็นเท็จ','ให้ถ้อยคำไม่ถูกต้องหรือไม่ครบถ้วนในสาระสำคัญ','ไม่รู้ถึงความไม่ชอบด้วยกฎหมายเพราะประมาทเลินเล่อธรรมดา','ไม่รู้ถึงความไม่ชอบด้วยกฎหมายเพราะประมาทเลินเล่ออย่างร้ายแรง'],a:[2]},
{q:'เมื่อมีการอุทธรณ์คำสั่งทางปกครองตามมาตรา 44–45 ข้อใดถูกต้องเรื่องระยะเวลา',o:['เจ้าหน้าที่ต้องพิจารณาภายใน 15 วัน ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 30 วัน ขยายได้ไม่เกิน 60 วัน','เจ้าหน้าที่ต้องพิจารณาภายใน 30 วันนับแต่ได้รับอุทธรณ์ ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 30 วันนับแต่ได้รับรายงาน ขยายได้ไม่เกิน 30 วัน','เจ้าหน้าที่ต้องพิจารณาภายใน 30 วัน ผู้มีอำนาจพิจารณาอุทธรณ์ต้องพิจารณาภายใน 60 วัน ขยายไม่ได้','เจ้าหน้าที่ต้องพิจารณาภายใน 90 วัน และไม่มีกำหนดเวลาสำหรับผู้มีอำนาจพิจารณาอุทธรณ์'],a:[1]},
{q:'ถ้าคำสั่งทางปกครองไม่ระบุกรณีที่อาจอุทธรณ์ วิธียื่น และระยะเวลาอุทธรณ์ ผลคือข้อใด',o:['คำสั่งนั้นเป็นโมฆะ','ระยะเวลาอุทธรณ์เริ่มนับใหม่เมื่อมีการแจ้งเพิ่มเติม แต่ถ้าไม่แจ้ง ระยะเวลาขยายเป็น 1 ปีนับแต่วันที่ได้รับคำสั่ง','ระยะเวลาอุทธรณ์ขยายเป็น 90 วัน','ผู้รับคำสั่งฟ้องศาลปกครองได้ทันทีโดยไม่ต้องอุทธรณ์ภายในฝ่ายปกครอง'],a:[1]},
{q:'คดีพิพาทเกี่ยวกับการกระทำละเมิดหรือความรับผิดอย่างอื่นของหน่วยงานทางปกครอง (มาตรา 9 วรรคหนึ่ง (3)) ต้องฟ้องภายในเวลาใด',o:['90 วันนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี','1 ปีนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี แต่ไม่เกิน 5 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี','1 ปีนับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี แต่ไม่เกิน 10 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี','5 ปีนับแต่วันที่มีเหตุแห่งการฟ้องคดี'],a:[2]},
{q:'คดีใดอยู่ในเขตอำนาจศาลปกครอง',o:['คดีพิพาทเรื่องคำสั่งลงโทษทางวินัยทหาร','คดีพิพาทเรื่องมติคณะกรรมการตุลาการศาลยุติธรรม (ก.ต.)','คดีพิพาทเรื่องคำสั่งลงโทษไล่ออกข้าราชการตำรวจ','คดีพิพาทเรื่องการประเมินภาษีอากร'],a:[2]},
{q:'ตามแนวคำวินิจฉัยของศาลปกครอง สัญญาใดมีแนวโน้ม "ไม่ใช่" สัญญาทางปกครองมากที่สุด',o:['สัญญาสัมปทานทางด่วน','สัญญาจ้างก่อสร้างถนนสาธารณะ','สัญญาซื้อเครื่องคอมพิวเตอร์มาใช้ในสำนักงานของกรม','สัญญาให้เอกชนเข้าแสวงประโยชน์จากแร่'],a:[2]},
{q:'นาย ก. เจ้าหน้าที่ของรัฐ ขับรถราชการไปปฏิบัติหน้าที่และชนนาย ข. โดย "ประมาทเลินเล่อธรรมดา" หน่วยงานชดใช้ค่าสินไหมทดแทนให้นาย ข. ไปแล้ว ข้อใดถูกต้อง',o:['หน่วยงานไล่เบี้ยนาย ก. ได้ภายใน 1 ปีนับแต่วันที่ชดใช้','หน่วยงานไล่เบี้ยนาย ก. ได้ภายใน 2 ปีนับแต่วันที่รู้ถึงการละเมิด','หน่วยงานไล่เบี้ยนาย ก. ไม่ได้','นาย ข. เลือกฟ้องนาย ก. เป็นการส่วนตัวแทนหน่วยงานได้'],a:[2]},
{q:'เมื่อศาลปกครองพิพากษาเพิกถอนกฎหรือคำสั่งทางปกครอง ข้อใดถูกต้องที่สุดตามมาตรา 72 วรรคสอง',o:['ต้องให้การเพิกถอนมีผลย้อนหลังไปถึงวันออกกฎหรือคำสั่งเสมอ','ต้องให้การเพิกถอนมีผลตั้งแต่วันที่มีคำพิพากษาเท่านั้น','ศาลกำหนดได้ว่าจะให้มีผลย้อนหลังหรือไม่ หรือมีผลในอนาคตถึงขณะใดขณะหนึ่ง และกำหนดเงื่อนไขได้','ศาลเพิกถอนได้เฉพาะคำสั่ง แต่เพิกถอนกฎไม่ได้'],a:[2]}
],reserve:[]});

DATA.push({id:106,title:'Claude Opus 5.5 – ข้อสอบรอบคัดเลือกกฎหมาย',sub:'ข้อสอบรอบคัดเลือกความรู้ทางกฎหมาย (45 ข้อ)',level:'Claude AI',main: [
    {"q":"ตามประมวลกฎหมายแพ่งและพาณิชย์ บุคคลพ้นจากภาวะผู้เยาว์และบรรลุนิติภาวะเมื่ออายุเท่าใด","o":["15 ปีบริบูรณ์","17 ปีบริบูรณ์","18 ปีบริบูรณ์","20 ปีบริบูรณ์","21 ปีบริบูรณ์"],"a":[3]},
    {"q":"นิติกรรมใดที่ไม่ได้ทำให้ถูกต้องตามแบบที่กฎหมายบังคับไว้ มีผลอย่างไร","o":["สมบูรณ์","โมฆียะ","โมฆะ","ไม่สมบูรณ์จนกว่าจะมีการให้สัตยาบัน","ใช้บังคับได้เฉพาะระหว่างคู่กรณี"],"a":[2]},
    {"q":"หากต้องเสียดอกเบี้ยแก่กันแต่ไม่ได้กำหนดอัตราไว้ และไม่มีกฎหมายกำหนดไว้เป็นอย่างอื่น ต้องใช้อัตราดอกเบี้ยเท่าใด","o":["ร้อยละ 3 ต่อปี","ร้อยละ 5 ต่อปี","ร้อยละ 7.5 ต่อปี","ร้อยละ 10 ต่อปี","ร้อยละ 15 ต่อปี"],"a":[0]},
    {"q":"สิทธิเรียกร้องที่กฎหมายไม่ได้กำหนดอายุความไว้โดยเฉพาะ มีอายุความกี่ปี","o":["1 ปี","2 ปี","5 ปี","10 ปี","20 ปี"],"a":[3]},
    {"q":"สิทธิเรียกร้องค่าเสียหายที่เกิดจากมูลละเมิด ขาดอายุความเมื่อพ้นระยะเวลาใด","o":["1 ปีนับแต่วันทำละเมิด","1 ปีนับแต่วันที่ผู้ต้องเสียหายรู้ถึงการละเมิดและรู้ตัวผู้จะพึงต้องใช้ค่าสินไหมทดแทน","2 ปีนับแต่วันที่ผู้ต้องเสียหายรู้ถึงการละเมิด","5 ปีนับแต่วันทำละเมิด","10 ปีนับแต่วันที่ผู้ต้องเสียหายรู้ถึงการละเมิด"],"a":[1]},

    {"q":"[ตอบ 2 คำตอบ] หน่วยงานใดเป็นองค์กรอิสระตามรัฐธรรมนูญ พ.ศ. 2560","o":["ศาลปกครอง","คณะกรรมการสิทธิมนุษยชนแห่งชาติ","คณะกรรมการตรวจเงินแผ่นดิน","คณะรัฐมนตรี","สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ (ป.ป.ท.)"],"a":[1,2]},
    {"q":"[ตอบ 2 คำตอบ] ข้อใดเป็นคุณสมบัติของผู้มีสิทธิเลือกตั้ง สส.","o":["มีอายุไม่ต่ำกว่า 20 ปีในวันเลือกตั้ง","มีอายุไม่ต่ำกว่า 18 ปีในวันเลือกตั้ง","สำเร็จการศึกษาไม่ต่ำกว่าปริญญาตรี","ถ้าแปลงสัญชาติเป็นไทย ต้องได้สัญชาติไทยมาแล้วไม่น้อยกว่า 3 ปี","มีชื่อในทะเบียนบ้านในเขตเลือกตั้งมาแล้วไม่น้อยกว่า 90 วันนับถึงวันเลือกตั้ง"],"a":[1,4]},
    {"q":"[ตอบ 2 คำตอบ] ข้อใดเป็นหน้าที่และอำนาจของศาลรัฐธรรมนูญ","o":["พิจารณาคดีละเมิดจากการใช้อำนาจทางปกครอง","พิจารณาวินิจฉัยว่ากฎหมายหรือร่างกฎหมายขัดหรือแย้งต่อรัฐธรรมนูญหรือไม่","พิจารณาคดีอาญาของผู้ดำรงตำแหน่งทางการเมือง","พิจารณาวินิจฉัยปัญหาเกี่ยวกับหน้าที่และอำนาจของสภาผู้แทนราษฎร วุฒิสภา คณะรัฐมนตรี หรือองค์กรอิสระ","พิจารณาคดีที่ทหารกระทำความผิดต่อกฎหมายอาญาทหาร"],"a":[1,3]},
    {"q":"[ตอบ 2 คำตอบ] ข้อใดถูกต้องตามพระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง พ.ศ. 2539","o":["โดยหลักแล้ว คำสั่งทางปกครองที่ทำเป็นหนังสือต้องจัดให้มีเหตุผลไว้ด้วย","คำสั่งทางปกครองต้องทำเป็นหนังสือเท่านั้น","คำสั่งทางปกครองมีผลตั้งแต่วันที่ออกคำสั่ง ไม่ว่าผู้รับจะได้รับแจ้งหรือไม่","คู่กรณีอุทธรณ์คำสั่งทางปกครองได้ภายใน 15 วันนับแต่วันที่ได้รับแจ้งคำสั่ง","การอุทธรณ์ทำให้การบังคับตามคำสั่งทางปกครองหยุดลงชั่วคราวเสมอ"],"a":[0,3]},
    {"q":"[ตอบ 2 คำตอบ] ผู้ใดมีสิทธิเสนอร่างพระราชบัญญัติตามรัฐธรรมนูญ พ.ศ. 2560","o":["สมาชิกวุฒิสภาจำนวนไม่น้อยกว่า 20 คน","ผู้มีสิทธิเลือกตั้งจำนวนไม่น้อยกว่า 5,000 คน","คณะรัฐมนตรี","ประธานศาลฎีกา โดยเสนอร่างพระราชบัญญัติเรื่องใดก็ได้","สมาชิกสภาผู้แทนราษฎรจำนวนไม่น้อยกว่า 20 คน"],"a":[2,4]}
  ],
  reserve: []
});

DATA.push({id:103,title:'Four Corners กฎหมายแพ่งและพาณิชย์',sub:'แนวฎีกาแพ่งและพาณิชย์ (10 ข้อ)',level:'Four Corners AI',main:[
{"q":"บริษัท ก. เชิญชวนผู้รับเหมาทั่วไปยื่นราคาก่อสร้าง บริษัท ข. ยื่นใบเสนอราคา 100 ล้านบาท ต่อมา ก. มีหนังสือแจ้งว่าคัดเลือก ข. เป็นผู้รับเหมา แต่ระบุเพิ่มเติมว่า \"ปริมาณงานและราคาเด็ดขาดอยู่ภายใต้บังคับการคิดคำนวณราคาใหม่โดยที่ปรึกษาของ ก.\" ข้อใดถูกต้อง","o":["หนังสือของ ก. เป็นคำสนองรับโดยสมบูรณ์ สัญญาเกิดตามราคา 100 ล้านบาท","หนังสือของ ก. เป็นคำสนองอันมีข้อความเพิ่มเติม/ข้อจำกัด ถือเป็นคำบอกปัดไม่รับคำเสนอบางส่วนและเป็นคำเสนอขึ้นใหม่ในตัว เมื่อ ข. ยอมรับ สัญญาเกิดตามข้อความในหนังสือนั้น","ประกาศเชิญชวนเป็นคำเสนอ สัญญาเกิดทันทีที่ ข. ยื่นราคา","หนังสือของ ก. ไม่มีผลผูกพันเพราะ ข. ยังมิได้ลงชื่อ"],"a":[1]},
{"q":"ผู้ขายทำหนังสือเสนอขายที่ดินระบุว่า \"ภายใน 180 วัน จะไม่เปลี่ยนแปลงราคาและไม่เสนอขายให้ผู้อื่น\" ก่อนครบกำหนดผู้ขายมีหนังสือเพิกถอนคำเสนอ แต่ผู้ซื้อได้มีหนังสือตอบรับพร้อมนัดโอนภายในกำหนดแล้ว ข้อใดถูกต้อง","o":["ผู้ขายถอนคำเสนอได้ เพราะยังไม่มีคำสนอง","คำเสนออันบ่งระยะเวลาให้ทำคำสนองไม่อาจถอนได้ภายในกำหนด เมื่อผู้ซื้อตอบรับแล้วสัญญาจึงเกิด การไม่ไปโอนกรรมสิทธิ์เป็นความผิดนัด","การเพิกถอนมีผลทันที คำเสนอสิ้นความผูกพัน","สัญญาเกิดต่อเมื่อจดทะเบียนโอนกรรมสิทธิ์เท่านั้น"],"a":[1]},
{"q":"ตัวแทนบริษัทประกันชีวิตหลอกผู้เอาประกันว่าเป็นการ \"ต่ออายุกรมธรรม์เดิม\" ทั้งที่ความเป็นจริงเป็นการทำกรมธรรม์ฉบับใหม่ ผู้เอาประกันหลงเชื่อลงชื่อในคำขอ สัญญาประกันชีวิตดังกล่าวมีผลอย่างไร","o":["สมบูรณ์ เพราะผู้เอาประกันลงลายมือชื่อแล้ว","โมฆียะ เพราะถูกกลฉ้อฉล ต้องบอกล้างภายใน 1 ปี","โมฆะ เพราะสำคัญผิดในสาระสำคัญถึงลักษณะของนิติกรรม","สมบูรณ์ แต่ผู้เอาประกันเรียกค่าเสียหายจากตัวแทนได้เท่านั้น"],"a":[2]},
{"q":"การแสดงเจตนาลวงที่จะทำให้นิติกรรมตกเป็นโมฆะตามมาตรา 118 ต้องปรากฏข้อเท็จจริงอย่างไร","o":["ผู้แสดงเจตนาฝ่ายเดียวไม่ประสงค์จะผูกพัน","คู่กรณีทั้งสองฝ่ายสมรู้ร่วมกันโดยไม่ประสงค์ให้นิติกรรมมีผลผูกพันกันจริง","ทำนิติกรรมเพื่อหลีกเลี่ยงภาษีอากร","มีพยานบุคคลยืนยันว่าทำเพื่ออำพราง"],"a":[1]},
{"q":"คู่สัญญาตกลงเบี้ยปรับไว้ว่า หากผิดนัดให้ชำระร้อยละ 0.2 ต่อวัน เมื่อคำนวณแล้วเบี้ยปรับสูงเกือบเท่าราคาสินค้า ข้อใดถูกต้อง","o":["ศาลต้องบังคับตามเบี้ยปรับที่ตกลงกันทุกกรณี เพราะเป็นสัญญา","ศาลลดเบี้ยปรับลงเป็นจำนวนพอสมควรได้ โดยพิเคราะห์ทางได้เสียของเจ้าหนี้ทุกอย่างอันชอบด้วยกฎหมาย","ศาลเพิ่มเบี้ยปรับให้สูงขึ้นได้ตามความเสียหายจริง","เบี้ยปรับที่สูงเกินส่วนทำให้สัญญาเป็นโมฆะ"],"a":[1]},
{"q":"อายุความฟ้องคดีละเมิด 1 ปี ตามมาตรา 448 วรรคหนึ่ง เริ่มนับแต่เมื่อใด","o":["วันที่ผู้ทำละเมิดลงมือกระทำการ","วันที่ผู้เสียหายรู้ว่าการกระทำนั้นผิดกฎหมาย","วันที่ความเสียหายเกิดขึ้นจริง อันเป็นวันที่ผู้เสียหายรู้ถึงการละเมิดและรู้ตัวผู้จะพึงต้องใช้ค่าสินไหมทดแทน","วันที่ผู้เสียหายยื่นฟ้องคดี"],"a":[2]},
{"q":"เครื่องบินซื้อมา 3.89 ล้านบาท เกิดอุบัติเหตุจากการละเมิดหลังจากใช้งานมา 1 ปี 9 เดือน ขณะเกิดเหตุราคาท้องตลาด 4.7 ล้านบาท แต่ต้องหักค่าเสื่อมราคา ค่าสินไหมทดแทนควรคำนวณจากฐานใด","o":["ราคาซื้อเดิม","ราคา ณ เวลาที่เกิดเหตุละเมิด หลังหักค่าเสื่อมราคาแล้ว","ราคาเครื่องบินใหม่ทดแทนเต็มจำนวน","ราคาที่เจ้าของทรัพย์กำหนดแต่เพียงฝ่ายเดียว"],"a":[1]},
{"q":"ผู้ขายทำสัญญาขายที่ดินและจดทะเบียนโอนกรรมสิทธิ์ให้ผู้ซื้อแล้ว แต่ผู้ซื้อยังมิได้ชำระราคา กรรมสิทธิ์ในที่ดินเป็นของใคร","o":["ยังเป็นของผู้ขายจนกว่าจะได้รับชำระราคา","ตกแก่ผู้ซื้อทันที เพราะการชำระราคาไม่ใช่เงื่อนไขการโอนกรรมสิทธิ์","ตกแก่ผู้ซื้อเมื่อส่งมอบโฉนดที่ดิน","ตกแก่ผู้ซื้อเมื่อชำระราคาครบถ้วน"],"a":[1]},
{"q":"ผู้เช่าซื้อผิดนัดชำระค่างวดหลายงวด แต่ผู้ให้เช่าซื้อยังคงรับชำระค่างวดต่อมาทุกครั้งโดยไม่ทักท้วง แล้วต่อมาผู้ให้เช่าซื้อประสงค์จะเลิกสัญญาและยึดรถคืน ต้องปฏิบัติอย่างไร","o":["เลิกสัญญาได้ทันที เพราะผู้เช่าซื้อผิดนัด","ต้องบอกกล่าวให้ชำระหนี้ภายในเวลาอันสมควรก่อนตามมาตรา 387 เพราะการรับชำระต่อมาแสดงว่ามิได้ถือเอาความผิดนัดเป็นสาระสำคัญ","ต้องฟ้องศาลให้เลิกสัญญาก่อนเสมอ","เลิกสัญญาไม่ได้อีกเลย"],"a":[1]},
{"q":"นายหน้าชี้ช่องให้ผู้ซื้อเข้าทำสัญญาซื้อขายที่ดินกับผู้ขายสำเร็จ ต่อมาผู้ซื้อผิดสัญญาไม่ชำระราคา ผู้ขายจึงปฏิเสธไม่จ่ายค่านายหน้า ข้อใดถูกต้อง","o":["ผู้ขายไม่ต้องจ่าย เพราะสัญญาไม่สำเร็จตามวัตถุประสงค์","ผู้ขายต้องจ่าย เพราะนายหน้าได้ปฏิบัติหน้าที่ครบถ้วนเมื่อสัญญาทำสำเร็จ ความผิดของผู้ซื้อไม่เกี่ยวกับนายหน้า","ผู้ขายต้องจ่ายเพียงครึ่งหนึ่งของค่านายหน้า","นายหน้าต้องคืนค่าบำเหน็จที่รับไว้แล้ว"],"a":[1]}
],reserve:[]});

DATA.push({id:104,title:'Four Corners กฎหมายอาญา',sub:'แนวฎีกาอาญา (10 ข้อ)',level:'Four Corners AI',main:[
{"q":"จำเลยเมาสุราหยิบปืนขึ้นขู่ผู้ตายกับพวกที่กำลังชกต่อยกันมิให้ยิงกัน แต่ปืนลั่นโดยประมาท กระสุนถูกผู้ตายถึงแก่ความตาย จำเลยจะอ้างการป้องกันโดยชอบด้วยกฎหมายได้หรือไม่","o":["ได้ เพราะเป็นการป้องกันภยันตรายอันใกล้จะถึงและพอสมควรแก่เหตุ","ไม่ได้ เพราะการป้องกันโดยชอบต้องเป็นการกระทำโดยเจตนา การกระทำโดยประมาทไม่ใช่การป้องกันโดยชอบ","ได้ เพราะจำเลยไม่มีเหตุโกรธเคืองผู้ตาย","ไม่ได้ เพราะจำเลยไม่มีสิทธิป้องกันบุคคลอื่น"],"a":[1]},
{"q":"จำเลยยิงปืนขู่ขึ้นฟ้า 3 นัดเพื่อช่วยเพื่อนบ้านที่ถูกรุมทำร้าย ถูกกลุ่มวัยรุ่นทุบหลังจนล้ม ปืนลั่น 1 นัด ถูกผู้สัญจรผ่านไปมาถึงแก่ความตาย จำเลยมีความผิดหรือไม่","o":["มีความผิดฐานฆ่าคนตายโดยไม่เจตนา มาตรา 291","มีความผิดฐานฆ่าผู้อื่นโดยเจตนาโดยพลาด มาตรา 60 ประกอบมาตรา 288","ไม่มีความผิด เพราะเป็นการป้องกันโดยชอบด้วยกฎหมาย แม้ผลพลาดไปถูกผู้อื่นก็ไม่มีความผิด","มีความผิดฐานป้องกันเกินสมควรแก่เหตุ มาตรา 69"],"a":[2]},
{"q":"เจ้าหน้าที่ประจำหน่วยเลือกตั้งถูกผู้สมัครใช้ปืนบังคับให้แก้ไขคะแนนเสียงในเอกสารแจ้งผลการเลือกตั้ง ผู้ถูกบังคับต้องรับโทษหรือไม่","o":["ต้องรับโทษ เพราะการแก้คะแนนเสียงเป็นความผิดร้ายแรง","ไม่ต้องรับโทษ เพราะเป็นการกระทำด้วยความจำเป็น อยู่ในบังคับซึ่งไม่อาจหลีกเลี่ยงหรือขัดขืนได้ และพอสมควรแก่เหตุ","ต้องรับโทษ แต่ศาลลดโทษกึ่งหนึ่ง","ไม่ต้องรับโทษ เพราะเป็นการป้องกันโดยชอบด้วยกฎหมาย"],"a":[1]},
{"q":"ข้อใดถือว่าเป็นการลงมือกระทำความผิดฐานพยายามฆ่าแล้ว","o":["เพียงชักปืนออกมา ปากกระบอกปืนยังไม่พ้นเอว","ยกปืนที่บรรจุกระสุนพร้อมจะยิงได้เล็งไปยังเป้าหมายโดยเจตนาจะยิง แม้ยังมิทันขึ้นนกปืน","เพียงเตรียมอาวุธและวางแผนการกระทำความผิด","เงื้อมีดขู่ในระยะที่ยังไม่อาจทำร้ายผู้เสียหายได้"],"a":[1]},
{"q":"ก. ใช้ให้ ข. ไปลักทรัพย์ของ ค. โดย ก. ไม่ได้ร่วมลงมือไปลักด้วย โจทก์บรรยายฟ้องเพียงว่า ก. กับ ข. ร่วมกันลักทรัพย์ ก. มีความผิดอย่างไร","o":["เป็นตัวการร่วมตามมาตรา 83","เป็นผู้ใช้ให้กระทำความผิดตามมาตรา 84","เป็นผู้สนับสนุนตามมาตรา 86 แม้ฟ้องมิได้กล่าวไว้ ศาลลงโทษฐานผู้สนับสนุนได้","ไม่มีความผิด เพราะมิได้ลงมือกระทำความผิด"],"a":[2]},
{"q":"ลูกจ้างนำรถยนต์ของนายจ้างไปใช้ส่วนตัวเพื่อรับญาติที่ต่างจังหวัดโดยตั้งใจจะนำมาคืน แต่รถเสียกลางทางจึงนำคืนไม่ได้ ต่อมานายจ้างได้รับรถคืนจากตำรวจ การกระทำของลูกจ้างเป็นความผิดฐานลักทรัพย์หรือไม่","o":["เป็นความผิด เพราะเอาทรัพย์ของผู้อื่นไปโดยทุจริต","ไม่เป็นความผิด เพราะไม่มีเจตนาตัดกรรมสิทธิ์ของเจ้าของทรัพย์ตลอดไป เพียงเอาทรัพย์ไปใช้ชั่วคราว","เป็นความผิดฐานยักยอกตามมาตรา 352","เป็นความผิดฐานฉ้อโกงตามมาตรา 341"],"a":[1]},
{"q":"จำเลยทำทีเป็นพูดโทรศัพท์แล้วหยิบโทรศัพท์มือถือของผู้เสียหายไปในขณะที่ผู้เสียหายกำลังให้บริการลูกค้าคนอื่นอยู่ เหตุเกิดเวลากลางคืนโดยร่วมกันสองคนขึ้นไป จำเลยมีความผิดฐานใด","o":["วิ่งราวทรัพย์ตามมาตรา 336 เพราะเป็นการฉกฉวยทรัพย์","ลักทรัพย์ตามมาตรา 335 (1) (7) เพราะเป็นการเอาไปในขณะที่ผู้เสียหายเผลอ มิใช่การฉกฉวยเอาซึ่งหน้า","ชิงทรัพย์ตามมาตรา 339","กรรโชกทรัพย์ตามมาตรา 337"],"a":[1]},
{"q":"จำเลยเปลี่ยนป้ายราคาโคมไฟจาก 1,785 บาท เป็นป้ายราคา 134 บาท แล้วนำไปชำระเงิน พนักงานเก็บเงินหลงเชื่อมอบโคมไฟให้ จำเลยมีความผิดฐานใด","o":["ลักทรัพย์ เพราะเอาทรัพย์ของผู้อื่นไปโดยทุจริต","ฉ้อโกง เพราะได้ทรัพย์ไปโดยเจ้าของยินยอมมอบให้อันเนื่องมาจากถูกหลอกลวง","ยักยอกตามมาตรา 352","กรรโชกทรัพย์ตามมาตรา 337"],"a":[1]},
{"q":"จำเลยใช้กำลังชกต่อยเตะภริยาจนถึงแก่ความตาย โดยไม่มีเจตนาฆ่าแต่ใช้กำลังรุนแรงเกินสมควร ศาลควรลงโทษจำเลยฐานใด","o":["ฆ่าผู้อื่นโดยเจตนา มาตรา 288","ฆ่าคนตายโดยไม่เจตนา มาตรา 290","ทำร้ายร่างกาย มาตรา 295","ฆ่าผู้อื่นโดยไตร่ตรองไว้ก่อน มาตรา 289 (4)"],"a":[1]},
{"q":"การข่มขืนกระทำชำเราจะถือว่าเป็นความผิดสำเร็จเมื่อใด","o":["เมื่อผู้กระทำสำเร็จความใคร่ (หลั่งน้ำอสุจิ)","เมื่ออวัยวะเพศของผู้กระทำล่วงล้ำเข้าไปในอวัยวะเพศของผู้เสียหายแล้ว แม้ไม่สำเร็จความใคร่","เมื่อเริ่มใช้กำลังประทุษร้ายหรือขู่เข็ญ","เมื่อผู้เสียหายตกอยู่ในภาวะที่ไม่สามารถขัดขืนได้"],"a":[1]}
],reserve:[]});

DATA.push({id:105,title:'Four Corners กฎหมายมหาชน (ชุด 2)',sub:'แนวฎีกาศาลปกครอง (10 ข้อ)',level:'Four Corners AI',main:[
{"q":"รัฐวิสาหกิจแห่งหนึ่งทำสัญญากับบริษัทเอกชนเพื่อก่อสร้างและจำหน่ายบ้านโครงการ \"บ้านเอื้ออาทร\" ให้ประชาชนผู้มีรายได้น้อยได้มีที่อยู่อาศัย ต่อมาเกิดข้อพิพาทเกี่ยวกับสัญญา สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางแพ่ง เพราะคู่สัญญาฝ่ายหนึ่งเป็นนิติบุคคลเอกชน","สัญญาทางปกครอง เพราะเป็นการจัดทำบริการสาธารณะ แม้คู่สัญญาฝ่ายหนึ่งเป็นรัฐวิสาหกิจก็ตาม","สัญญาทางแพ่ง เพราะรัฐวิสาหกิจมิใช่หน่วยงานทางปกครอง","สัญญาทางปกครองเฉพาะในส่วนที่เกี่ยวกับการโอนกรรมสิทธิ์บ้านเท่านั้น"],"a":[1]},
{"q":"หลักเกณฑ์สำคัญในการพิจารณาว่าสัญญาที่หน่วยงานของรัฐทำกับเอกชนเป็น \"สัญญาทางปกครอง\" คือข้อใด","o":["ดูที่สถานะของคู่สัญญาว่าเป็นหน่วยงานของรัฐหรือไม่","ดูที่มูลค่าหรือจำนวนเงินตามสัญญา","ดูที่ลักษณะของสัญญาว่าเป็นสัญญาสัมปทาน จัดทำบริการสาธารณะ จัดให้มีสิ่งสาธารณูปโภค หรือแสวงประโยชน์จากทรัพยากรธรรมชาติ","ดูที่ข้อกำหนดให้คู่สัญญาเลือกใช้กฎหมายไทยหรือไม่"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญากับบริษัทโทรคมนาคมเอกชนให้จัดบริการข้อมูลทางโทรศัพท์ให้แก่หน่วยงาน ตามแนวคำพิพากษาฎีกาที่ 56/2553 สัญญาดังกล่าวมีลักษณะเป็นสัญญาประเภทใด","o":["สัญญาทางปกครอง เพราะหน่วยงานของรัฐเป็นคู่สัญญา","สัญญาทางปกครอง เพราะกิจการโทรคมนาคมเป็นบริการสาธารณะ","สัญญาทางแพ่ง เพราะไม่มีลักษณะเป็นการจัดทำบริการสาธารณะ สัมปทาน หรือสาธารณูปโภค","สัญญาทางแพ่งเฉพาะส่วนค่าบริการ แต่ส่วนอื่นเป็นสัญญาทางปกครอง"],"a":[2]},
{"q":"หน่วยงานของรัฐแห่งหนึ่งทำสัญญาซื้อขายครุภัณฑ์ก่อสร้างจากบริษัทเอกชนเพื่อใช้ในสำนักงาน เมื่อมีข้อพิพาท ข้อใดถูกต้องตามแนวฎีกาที่ 2/2563","o":["ข้อพิพาทอยู่ในอำนาจศาลปกครอง เพราะคู่สัญญาฝ่ายหนึ่งเป็นหน่วยงานของรัฐ","ข้อพิพาทอยู่ในอำนาจศาลยุติธรรม เพราะเป็นสัญญาทางแพ่งที่ไม่มีลักษณะจัดทำบริการสาธารณะ","ข้อพิพาทอยู่ในอำนาจศาลปกครองสูงสุด","ข้อพิพาทไม่อยู่ในอำนาจศาลใด ต้องระงับโดยอนุญาโตตุลาการเท่านั้น"],"a":[1]},
{"q":"เจ้าหน้าที่ของหน่วยงานรัฐแห่งหนึ่งออกคำสั่งทางปกครองที่กระทบสิทธิของนาย ก โดยไม่ได้เปิดโอกาสให้นาย ก ชี้แจงข้อเท็จจริงและโต้แย้งตามขั้นตอนอันเป็นสาระสำคัญที่กฎหมายกำหนด ตามแนวฎีกาที่ 526/2550 ผลของคำสั่งดังกล่าวคือข้อใด","o":["คำสั่งชอบด้วยกฎหมาย เพราะเจ้าหน้าที่มีอำนาจออกได้","คำสั่งไม่ชอบด้วยกฎหมาย และศาลมีอำนาจเพิกถอนได้","คำสั่งชอบด้วยกฎหมาย แต่เพิกถอนไม่ได้เพราะพ้นกำหนดเวลา","คำสั่งเป็นโมฆะเฉพาะส่วนที่เป็นโทษ แต่ส่วนอื่นยังสมบูรณ์"],"a":[1]},
{"q":"เจ้าพนักงานที่ดินมีคำสั่งเพิกถอนหนังสือรับรองการทำประโยชน์ (น.ส.3 ก.) ที่นาย ข ถืออยู่ นาย ข เห็นว่าคำสั่งไม่ชอบด้วยกฎหมายจึงประสงค์จะฟ้องคดี ตามแนวฎีกาที่ 43/2562 ข้อใดถูกต้อง","o":["การเพิกถอน น.ส.3 ก. เป็นคำสั่งทางปกครองที่ศาลปกครองตรวจสอบความชอบด้วยกฎหมายได้","การเพิกถอน น.ส.3 ก. อยู่ในอำนาจศาลยุติธรรมเท่านั้น","นาย ข ฟ้องไม่ได้ เพราะ น.ส.3 ก. เป็นเพียงเอกสารสิทธิมิใช่กรรมสิทธิ์","ต้องฟ้องเป็นคดีแพ่งสามัญเท่านั้น"],"a":[0]},
{"q":"เจ้าพนักงานที่ดินออกคำสั่งเกี่ยวกับที่ดินโดยมิได้ตรวจสอบพยานหลักฐานของผู้ยื่นคำขอให้รอบคอบก่อน ตามแนวฎีกาที่ 19/2546 คดีพิพาทเกี่ยวกับคำสั่งดังกล่าวอยู่ในอำนาจศาลใด","o":["ศาลยุติธรรม ตามมาตรา 9 (3)","ศาลปกครอง ตามมาตรา 9 (1) (2) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","ศาลรัฐธรรมนูญ ตามมาตรา 210","คณะกรรมการวินิจฉัยชี้ขาดอำนาจหน้าที่ระหว่างศาล"],"a":[1]},
{"q":"นาย ค ได้รับความเสียหายเพราะพนักงานเจ้าหน้าที่ออกโฉนดที่ดินให้แก่ผู้อื่นโดยไม่ชอบ ทำให้นาย ค ต้องฟ้องเรียกค่าเสียหายจากหน่วยงานของรัฐ ตามแนวฎีกาที่ 37/2560 คดีนี้เป็นคดีประเภทใด","o":["คดีพิพาทเกี่ยวกับคำสั่งทางปกครอง ตามมาตรา 9 (1)","คดีพิพาทเกี่ยวกับสัญญาทางปกครอง ตามมาตรา 9 (4)","คดีละเมิด ตามมาตรา 9 (3) แห่ง พ.ร.บ.จัดตั้งศาลปกครองฯ","คดีละเมิดซึ่งอยู่ในอำนาจศาลยุติธรรม"],"a":[2]},
{"q":"คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของพระราชกฤษฎีกาที่คณะรัฐมนตรีออกโดยอาศัยอำนาจตามกฎหมาย ตามแนวฎีกาที่ 44/2560 ศาลใดมีอำนาจพิจารณาพิพากษา","o":["ศาลปกครองชั้นต้น","ศาลปกครองสูงสุด","ศาลยุติธรรม","ศาลรัฐธรรมนูญ"],"a":[1]},
{"q":"ตามมาตรา 11 แห่ง พ.ร.บ.จัดตั้งศาลปกครองและวิธีพิจารณาคดีปกครอง พ.ศ. 2542 คดีพิพาทเกี่ยวกับความชอบด้วยกฎหมายของกฎประเภทใดที่ศาลปกครองสูงสุดมีอำนาจพิพากษาได้โดยตรง","o":["กฎกระทรวงที่รัฐมนตรีออกโดยลำพัง","พระราชกฤษฎีกาหรือกฎที่คณะรัฐมนตรีออก","ข้อบัญญัติท้องถิ่นขององค์การบริหารส่วนตำบล","ระเบียบภายในของหน่วยงานซึ่งไม่มีผลต่อบุคคลภายนอก"],"a":[1]}
],reserve:[]});

DATA.push({
  id: 109,
  title: 'Four Corners กฎหมายมหาชน (ชุดที่ 3)',
  sub: 'ฉบับวิเคราะห์แยกแยะ (20 ข้อ)',
  level: 'Four Corners AI',
  main: [
    {
      "q": "(ก) ยื่นคำขอออก น.ส.3 ก. แล้วเจ้าพนักงานเพิ่งเริ่มรังวัด ยังไม่สั่งการใด (ข) อธิบดีกรมที่ดินออกคำสั่งเพิกถอน น.ส.3 ก. ตามมาตรา 61 ป.ที่ดิน ข้อใดถูกต้อง",
      "o": [
        "ทั้ง (ก) และ (ข) ฟ้องศาลปกครองได้ เพราะเจ้าพนักงานที่ดินเป็นเจ้าหน้าที่ของรัฐ",
        "(ก) ฟ้องศาลยุติธรรมได้ทันที เพราะเป็นคดีสิทธิในที่ดิน ส่วน (ข) ฟ้องไม่ได้",
        "(ก) ฟ้องไม่ได้ เพราะการรังวัดเป็นเพียงการดำเนินการเพื่อจัดให้มีคำสั่ง ผู้ฟ้องยังไม่เดือดร้อนตามมาตรา 42 ส่วน (ข) เป็นคำสั่งทางปกครองตามมาตรา 5 ตรวจสอบได้ในศาลปกครอง",
        "ทั้งสองกรณีต้องรอให้มีคำสั่งก่อน จึงฟ้องศาลปกครองภายใน 90 วันเสมอ"
      ],
      "a": [2]

function say(txt){
 if(!('speechSynthesis' in window)){toast('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');return}
 const s=speechSynthesis;s.cancel();

 const vs=s.getVoices(),v=(ST.v.n&&vs.find(x=>x.name===ST.v.n))||vs.find(x=>/^th/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang}else if(vs.length)toast('ไม่พบเสียงภาษาไทยในอุปกรณ์ อาจอ่านไม่ชัด');

 h+=`<div class="card"><b>🎲 สุ่มรวมทุกชุด${lvl!=='ทั้งหมด'?` (ระดับ${lvl})`:''}</b><div class="row"><button class="btn p" onclick="start(-1,'m',20)">สุ่ม 20 ข้อ</button><button class="btn" onclick="start(-1,'m',0)">ทั้งหมด</button><button class="btn" onclick="start(-2,'m',0)">ฝึกข้อที่เคยตอบผิด</button></div></div>`;
 $('#app').innerHTML=h}

 qs=si<0?allQ().filter(q=>lvl==='ทั้งหมด'||DATA[q.si].level===lvl):pool(si,p);

function keyV(){
 let h=`<p class="mu">เฉลยทุกข้อ กดเปิดเพื่อดูโจทย์และตัวเลือก (ข้อที่ถูกไฮไลต์สีเขียว)</p>
 <div class="card"><label for="keySearch"><b>🔎 ค้นหาในเฉลย</b></label>
 <input id="keySearch" type="search" placeholder="พิมพ์คำค้น เช่น ลักทรัพย์, มาตรา 420, ศาล..." style="width:100%;font:inherit;padding:10px 12px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)" oninput="filterKey(this.value)">
 <div class="row"><button class="btn" onclick="document.getElementById('keySearch').value='';filterKey('')">ล้างคำค้น</button><span id="keyCount" class="mu"></span></div></div>`;
 DATA.forEach((s,si)=>{h+=`<section class="key-section" data-set="${si}"><h2>${s.title} <span class="mu">${s.sub} · ${s.level}</span></h2>`;
  [['m','ข้อสอบหลัก'],['r','ข้อสำรอง']].forEach(([p,nm])=>{const qs=pool(si,p);if(!qs.length)return;
   h+=`<div class="card key-group"><b>${nm}</b> <span class="mu">ตอบ: ${qs.map(q=>q.n+'='+q.a.map(j=>L[j]).join('/')).join(' · ')}</span>`;
   qs.forEach(q=>{const searchText=[q.q,...q.o,...q.a.map(j=>q.o[j]),s.title,s.sub,nm,ansL(q)].join(' ').toLocaleLowerCase('th');
    h+=`<details class="key-question" data-search="${esc(searchText)}" style="margin-top:8px"><summary>ข้อ ${q.n}. เฉลย ${ansL(q)}</summary><p>${esc(q.q)}</p>${spb(q,true)}${q.o.map((o,j)=>`<div class="opt ${isOk(q,j)?'ok':''}" style="margin:4px 0"><i>${L[j]}.</i><span>${esc(o)}</span></div>`).join('')}</details>`});
   h+='</div>'})+'</section>'});
 $('#app').innerHTML=h;filterKey('');
}
function normalizeKeyText(value) {
  return String(value ?? "")
    .normalize("NFC")
    .toLocaleLowerCase("th")
    .replace(/[\u200B\u200C\u200D\uFEFF]/g, "")
    .replace(/[\s\u00A0]+/g, " ")
    .trim();
}

function filterKey(value) {
  const term = normalizeKeyText(value);
  let shown = 0;

  document.querySelectorAll(".key-question").forEach(el => {
    const text = normalizeKeyText(el.textContent);
    const match = !term || text.includes(term);

    el.style.display = match ? "" : "none";
    if (match) shown++;
  });

  document.querySelectorAll(".key-section").forEach(sec => {
    const hasMatch = [...sec.querySelectorAll(".key-question")]
      .some(el => el.style.display !== "none");

    sec.style.display = hasMatch ? "" : "none";
  });

  const count = document.querySelector("#keyCount");
  if (count) {
    count.textContent = term
      ? `พบ ${shown} ข้อ`
      : `ทั้งหมด ${shown} ข้อ`;
  }
}

 h+='<h2>ประวัติล่าสุด</h2>'+(ST.att.length?`<div class="card"><table>${ST.att.slice(-10).reverse().map(a=>`<tr><td>${new Date(a.t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td><td>${a.w?'ฝึกข้อผิด':a.s<0?'สุ่มรวม':DATA[a.s].title+(a.p==='r'?' สำรอง':'')}</td><td>${a.sc}/${a.tt}</td><td>${pct(a.sc,a.tt)}%</td></tr>`).join('')}</table></div>`:'<p class="mu">ยังไม่มีประวัติ</p>');
 h+=`<h2>สถิติของข้อสอบ: การกระจายคำตอบที่ถูก</h2><div class="card">${dist.map((d,i)=>`<div class="hb"><span style="min-width:2.5em">ข้อ ${L[i]}</span><div class="bar"><div style="width:${pct(d,dn)}%"></div></div><span style="min-width:6em;text-align:right">${d} ข้อ (${pct(d,dn)}%)</span></div>`).join('')}<p class="mu" style="margin-bottom:0">รวม ${all.length} ข้อ จาก ${DATA.length} ชุด</p></div>
 <div class="row"><button class="btn" onclick="ask(this,()=>{ST={att:[],q:{},v:ST.v};save();render()})">🗑 ล้างสถิติ</button></div>`;
